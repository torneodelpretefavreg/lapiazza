<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Piazza">
<title>La Piazza di Fabbrico</title>
<meta name="description" content="La Piazza di Fabbrico — Cultura, Storia, Varia Umanità. Articoli, archivio, risultati sportivi e fotografie del paese.">
<meta name="theme-color" content="#8A1C1C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%238A1C1C'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23F3D3A6' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bordeaux:#8E1B2C;--bordeaux-2:#6F1322;--bordeaux-ch:#F8E6E8;
  --ocra:#F2B45A;--ocra-ch:#FDF0DC;
  --bg:#FBF8F3;--bg-2:#F2ECE3;--card:#FFFFFF;--scuro:#1C1214;
  --ink:#17120F;--ink-2:#4A433D;--muted:#857B71;--line:#E9E1D5;
  --r:18px;--ombra:0 1px 2px rgba(40,20,10,.05),0 8px 24px rgba(40,20,10,.07);
  --font-t:'Bricolage Grotesque',system-ui,sans-serif;--font:'Inter',system-ui,-apple-system,sans-serif;
  /* alias */
  --inchiostro:var(--ink);--grigio:var(--muted);--linea:var(--line);--carta:var(--bg);--carta-2:var(--bg-2);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit}
.boot{font-family:var(--font-t);color:var(--bordeaux);text-align:center;padding:30vh 16px;font-size:34px;font-weight:800;letter-spacing:-.04em}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.centro{text-align:center;margin-top:20px}
.nota{font-size:14px;color:var(--muted)}
.vuoto{text-align:center;color:var(--muted);padding:56px 16px;font-size:17px}

/* ---------- LOGO (dalla testata cartacea) ---------- */
.logo{display:inline-flex;align-items:flex-end;gap:.12em;font-family:Cinzel,Georgia,serif;font-weight:700;color:var(--bordeaux);line-height:.78;font-size:clamp(12.5px,3.7vw,16px);white-space:nowrap}
.logo-la{font-size:2.95em;letter-spacing:-.01em}
.logo-dx{display:flex;flex-direction:column;align-items:flex-end;padding-bottom:.1em}
.logo-pz{font-size:1.78em;padding:0 0 .12em .2em;border-bottom:1.5px solid currentColor}
.logo-di{font-family:var(--font);font-weight:600;font-variant:small-caps;color:var(--ink);font-size:.82em;letter-spacing:.06em;line-height:1.15;margin-top:.22em}
.logo-chiaro{color:#fff}
.logo-chiaro .logo-di{color:var(--ocra)}
.logo-grande{font-size:20px}
@media(max-width:420px){.hd .ico-btn{display:none}}

/* ---------- INTESTAZIONE ---------- */
.hd{position:sticky;top:0;z-index:30;background:rgba(251,248,243,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hd-top{max-width:1180px;margin:0 auto;padding:12px 18px 10px;display:flex;align-items:center;gap:14px}
.marchio{display:flex;align-items:center;gap:10px;min-width:0}
.marchio-ico{width:40px;height:40px;border-radius:12px;background:var(--bordeaux);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.marchio-ico span{font-family:var(--font-t);font-weight:800;color:var(--ocra);font-size:25px;line-height:1;margin-top:-3px}
.marchio-txt{display:flex;flex-direction:column;line-height:1}
.marchio-txt b{font-family:var(--font-t);font-weight:800;font-size:25px;letter-spacing:-.04em;color:var(--bordeaux)}
.marchio-txt small{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.motto-hd{display:none;font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
@media(min-width:860px){.motto-hd{display:block}}
.hd-azioni{margin-left:auto;display:flex;align-items:center;gap:8px}
.ico-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);flex:none}
.ico-btn:hover{border-color:var(--bordeaux);color:var(--bordeaux)}
.accedi{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px 0 13px;border-radius:999px;background:var(--bordeaux);color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 4px 14px rgba(142,27,44,.28);white-space:nowrap}
.accedi:hover{background:var(--bordeaux-2)}
.nav{max-width:1180px;margin:0 auto;padding:0 18px 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.nav a:hover{background:var(--bg-2)}
.nav a.on{background:var(--ink);color:#fff}
main{min-height:55vh;padding:22px 0 56px}

/* ---------- ELEMENTI COMUNI ---------- */
.chip-cat{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px;line-height:1.3}
.chip-cat::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.sez{margin:0 0 46px}
.sez-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sez-hd h2{font-family:var(--font-t);font-weight:800;font-size:clamp(24px,3.4vw,30px);letter-spacing:-.035em;margin:0;line-height:1.1}
.sez-hd .sub{font-size:14px;color:var(--muted);margin-top:4px}
.vedi{font-weight:600;font-size:14.5px;color:var(--bordeaux);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:gap .15s}
.vedi:hover{gap:9px}
.pag-hd{text-align:center;margin:6px auto 26px;max-width:640px}
.pag-hd h1{font-family:var(--font-t);font-weight:800;font-size:clamp(34px,6.5vw,52px);letter-spacing:-.045em;margin:0 0 6px;line-height:1.02}
.pag-hd p{margin:0;color:var(--muted)}
.indietro{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px;color:var(--bordeaux)}

/* apertura */
.hero{position:relative;display:flex;align-items:flex-end;border-radius:26px;overflow:hidden;min-height:460px;color:#fff;margin-bottom:34px;box-shadow:var(--ombra);isolation:isolate;background:linear-gradient(135deg,var(--bordeaux),#2A0B12)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .7s ease}
.hero:hover img{transform:scale(1.03)}
.hero::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,5,8,0) 20%,rgba(15,5,8,.5) 52%,rgba(15,5,8,.9))}
.hero.senza::after{background:radial-gradient(circle at 88% 12%,rgba(242,180,90,.45),transparent 42%)}
.hero-in{position:relative;padding:clamp(22px,4.4vw,44px);max-width:900px;display:flex;flex-direction:column;gap:10px}
.hero h2{font-family:var(--font-t);font-weight:800;font-size:clamp(31px,5.6vw,60px);line-height:1;letter-spacing:-.045em;margin:4px 0 0}
.hero p{margin:0;font-size:clamp(16px,2vw,19px);opacity:.92;max-width:680px;line-height:1.45}
.hero .meta{font-size:13.5px;opacity:.78;margin-top:4px}
@media(max-width:640px){.hero{min-height:440px;border-radius:22px}}

/* card */
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.riga{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin-bottom:46px}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--ombra);transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(40,20,10,.06),0 18px 38px rgba(40,20,10,.11)}
.card-img{aspect-ratio:16/10;object-fit:cover;width:100%;background:var(--bg-2)}
.card-ph{aspect-ratio:16/10;display:grid;place-items:center;font-family:var(--font-t);font-weight:800;font-size:56px;letter-spacing:-.05em;color:rgba(255,255,255,.92)}
.card-c{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-family:var(--font-t);font-weight:700;font-size:21px;line-height:1.14;letter-spacing:-.025em;margin:0}
.card p{margin:0;font-size:15px;color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{margin-top:auto;padding-top:4px;font-size:13px;color:var(--muted)}

/* avviso e invito */
.avviso{display:flex;gap:12px;align-items:center;background:var(--bordeaux-ch);color:var(--bordeaux);border-radius:14px;padding:12px 16px;margin-bottom:24px;font-weight:600}
.avviso::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--bordeaux);flex:none;animation:pulsa 1.8s infinite}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(142,27,44,.5)}70%{box-shadow:0 0 0 9px rgba(142,27,44,0)}100%{box-shadow:0 0 0 0 rgba(142,27,44,0)}}
.invito{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center;justify-content:space-between;background:var(--scuro);color:#fff;border-radius:26px;padding:clamp(24px,4.4vw,40px);margin-bottom:46px;position:relative;overflow:hidden;isolation:isolate}
.invito::before{content:'';position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:var(--bordeaux);z-index:-1}
.invito::after{content:'';position:absolute;right:120px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:var(--ocra);opacity:.9;z-index:-1}
.invito h3{font-family:var(--font-t);font-weight:800;font-size:clamp(24px,3.8vw,34px);letter-spacing:-.04em;margin:0 0 8px;line-height:1.05}
.invito p{margin:0;opacity:.78;max-width:540px}

/* sport */
.sport-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(272px,1fr);gap:14px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.sport-scroll::-webkit-scrollbar{display:none}
.tabellino{scroll-snap-align:start;background:linear-gradient(160deg,#2B0C13,#55152A);color:#fff;border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--ombra);display:flex;flex-direction:column}
.tab-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:14px}
.tab-hd b{font-family:var(--font-t);font-size:18px;letter-spacing:-.025em;display:block;line-height:1.15}
.tab-hd small{font-size:12px;opacity:.65}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.score .sq-n{font-size:13.5px;font-weight:600;line-height:1.2;opacity:.92}
.score .sq-n.noi{opacity:1;font-weight:800}
.score .num{font-family:var(--font-t);font-weight:800;font-size:36px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.esito{flex:none;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:6px;letter-spacing:.07em}
.e-v{background:#2E9E44}.e-p{background:#7C736B}.e-s{background:#D6453D}
.tab-data{font-size:12px;opacity:.65;text-align:center;margin:8px 0 14px}
.prossima{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);font-size:13px;display:flex;justify-content:space-between;gap:10px}
.prossima span:first-child{opacity:.65;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.08em;padding-top:2px}
.prossima span:last-child{text-align:right}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:3px 10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(40,20,10,.06);font-size:14.5px}
.match .c{text-align:right}.match .o{text-align:left}
.match .ris{font-family:var(--font-t);font-weight:800;font-variant-numeric:tabular-nums;background:var(--ink);color:#fff;padding:3px 10px;border-radius:8px;min-width:62px;text-align:center;font-size:16px}
.match .ris.prox{background:var(--bordeaux-ch);color:var(--bordeaux);font-size:13px}
.match-data{font-size:12px;color:var(--muted);grid-column:1/-1;text-align:center}
.noi{font-weight:700}
.sq-pag{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;margin-bottom:46px}
@media(max-width:780px){.sq-pag{grid-template-columns:1fr}}
.sq-pag h3{font-family:var(--font-t);font-weight:700;font-size:18px;letter-spacing:-.02em;margin:0 0 10px}
.tab-card{background:var(--card);border-radius:var(--r);box-shadow:var(--ombra);overflow:hidden}
table.clas{width:100%;border-collapse:collapse;font-size:14.5px}
table.clas th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
table.clas td{padding:9px 12px;border-bottom:1px solid var(--line)}
table.clas tr:last-child td{border-bottom:0}
table.clas .n{text-align:right;font-variant-numeric:tabular-nums}
table.clas .pos{width:34px;color:var(--muted);font-weight:700}
table.clas tr.noi td{background:var(--bordeaux-ch);color:var(--bordeaux);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);color:var(--ink-2);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;background:var(--card);cursor:pointer}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* foto */
.mosaico{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:10px}
.mosaico img{width:100%;height:100%;object-fit:cover;border-radius:14px;cursor:zoom-in;background:var(--bg-2);transition:filter .2s}
.mosaico img:hover{filter:brightness(1.07)}
.mosaico img:first-child{grid-column:span 2;grid-row:span 2}
@media(max-width:640px){.mosaico{grid-template-columns:repeat(3,1fr);grid-auto-rows:104px;gap:8px}}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.strip img{width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in;background:var(--bg-2);border-radius:14px}
.album-gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.album-gr .card-img{aspect-ratio:4/3}
.lb{position:fixed;inset:0;background:rgba(12,8,9,.96);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:16px}
.lb img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:8px}
.lb .did{color:#eee;margin-top:12px;font-size:15px;text-align:center;max-width:700px}
.lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;width:46px;height:46px;border-radius:50%;font-size:24px;cursor:pointer;line-height:1}
.lb .x{top:14px;right:14px}.lb .pr{left:10px;top:calc(50% - 23px)}.lb .nx{right:10px;top:calc(50% - 23px)}

/* cartaceo */
.cartaceo{display:flex;gap:30px;align-items:center;background:linear-gradient(135deg,var(--ocra-ch),#F7D7A6);border-radius:26px;padding:clamp(24px,4.4vw,40px);margin-bottom:46px}
.cartaceo .cop{width:140px;flex:none;transform:rotate(-4deg);box-shadow:0 18px 40px rgba(70,35,10,.28)}
.cartaceo h3{font-family:var(--font-t);font-weight:800;font-size:clamp(26px,4vw,36px);letter-spacing:-.04em;margin:10px 0 6px;line-height:1.05}
.cartaceo p{margin:0 0 16px;color:var(--ink-2)}
@media(max-width:560px){.cartaceo{flex-direction:column;text-align:center}.cartaceo .chip-cat{align-self:center}.cartaceo .azioni{justify-content:center}}
.cop{aspect-ratio:1/1.41;object-fit:cover;border-radius:6px;background:#fff;width:100%}
.cop-vuota{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--bordeaux);font-family:var(--font-t);font-weight:800;text-align:center;padding:12px;line-height:.95;font-size:22px;letter-spacing:-.04em}
.cop-vuota small{font-family:var(--font);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.numeri-gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:26px}
.numero-v{display:flex;flex-direction:column;gap:4px}
.numero-v .cop{box-shadow:var(--ombra);margin-bottom:8px;transition:transform .2s}
.numero-v:hover .cop{transform:translateY(-4px)}
.numero-v b{font-family:var(--font-t);font-size:19px;letter-spacing:-.02em}

/* articolo */
.progresso{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--bordeaux),var(--ocra));z-index:60;width:0;pointer-events:none}
.art{max-width:720px;margin:0 auto}
.art h1{font-family:var(--font-t);font-weight:800;font-size:clamp(33px,6.2vw,56px);line-height:1.02;letter-spacing:-.045em;margin:14px 0 12px}
.art .occhiello{font-size:clamp(18px,2.4vw,21px);color:var(--ink-2);margin:0 0 22px;line-height:1.45}
.autore{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:26px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--bordeaux);color:var(--ocra);display:grid;place-items:center;font-family:var(--font-t);font-weight:800;font-size:16px;flex:none}
.autore .nome{font-weight:700;font-size:15px;line-height:1.25}
.autore .meta{font-size:13.5px;color:var(--muted)}
.autore .btn{margin-left:auto}
.art figure{margin:0 0 30px}
.art figure img{width:100%;border-radius:20px}
.art figcaption{font-size:13.5px;color:var(--muted);margin-top:8px}
.corpo{font-size:18.5px;line-height:1.75;color:#231C18}
.corpo p{margin:0 0 1.15em}
.corpo h2{font-family:var(--font-t);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.2;margin:1.6em 0 .5em}
.corpo blockquote{margin:1.6em 0;padding:4px 0 4px 22px;border-left:4px solid var(--ocra);font-family:var(--font-t);font-weight:600;font-size:1.25em;line-height:1.4;letter-spacing:-.02em;color:var(--bordeaux)}
.corpo ul{margin:0 0 1.15em;padding-left:1.2em}
.corpo li{margin-bottom:.3em}
.corpo li::marker{color:var(--bordeaux)}
.corpo a{color:var(--bordeaux);text-decoration:underline;text-underline-offset:3px}
.anteprima-tag{background:var(--ocra-ch);border:1px solid #F0D3A2;padding:10px 14px;margin:0 auto 18px;font-size:14px;text-align:center;border-radius:12px;max-width:720px}

/* archivio */
.filtri{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cerca{position:relative;flex:1;min-width:220px}
.cerca svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cerca .input{padding-left:44px;width:100%;height:48px;border-radius:999px}
.filtri .sel{height:48px;border-radius:999px;padding:0 16px}
.mese{font-family:var(--font-t);font-weight:800;margin:30px 0 10px;letter-spacing:-.025em;font-size:20px}
.voce{display:grid;grid-template-columns:124px 1fr;gap:16px;padding:12px;border-radius:18px;background:var(--card);margin-bottom:10px;box-shadow:0 1px 2px rgba(40,20,10,.06);transition:box-shadow .2s}
.voce:hover{box-shadow:var(--ombra)}
.voce.senza{grid-template-columns:1fr;padding:16px 18px}
.voce img{width:124px;height:100%;min-height:96px;object-fit:cover;border-radius:12px;background:var(--bg-2)}
.voce h3{margin:7px 0 4px;font-family:var(--font-t);font-weight:700;font-size:19px;line-height:1.2;letter-spacing:-.025em}
.voce:hover h3{color:var(--bordeaux)}
.voce p{margin:0 0 4px;font-size:14.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:520px){.voce{grid-template-columns:92px 1fr;gap:12px}.voce img{width:92px}}

/* piè di pagina */
.piede{background:var(--scuro);color:#E9DFD6;padding:46px 18px 28px}
.piede-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:30px 56px;justify-content:space-between}
.piede .marchio-txt b{color:#fff}
.piede .marchio-txt small{color:#A89A8F}
.piede p{margin:14px 0 0;color:#A89A8F;font-size:14px;max-width:360px}
.piede-col{display:flex;flex-direction:column;gap:9px;font-size:14.5px;min-width:140px}
.piede-col b{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#A89A8F;margin-bottom:2px}
.piede-col a:hover{color:var(--ocra)}
.piede-fondo{max-width:1180px;margin:30px auto 0;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:#8C8077}

/* ---------- PULSANTI E MODULI ---------- */
.btn{font:inherit;font-weight:600;font-size:14.5px;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.3}
.btn:hover{border-color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn-p{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff}
.btn-p:hover{background:var(--bordeaux-2);border-color:var(--bordeaux-2)}
.btn-ocra{background:var(--ocra);border-color:var(--ocra);color:var(--ink);font-weight:700;padding:13px 24px;font-size:15.5px}
.btn-ocra:hover{background:#F6C478;border-color:#F6C478}
.btn-d{color:#B42318;border-color:#F1C6C1}
.btn-s{padding:5px 12px;font-size:13.5px}
.input,.sel{font:inherit;font-size:16px;padding:10px 13px;border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:0;color:var(--ink)}
.input:focus,.sel:focus{outline:none;border-color:var(--bordeaux);box-shadow:0 0 0 3px rgba(142,27,44,.12)}
.azioni{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.link-txt{color:var(--bordeaux);text-decoration:underline;text-underline-offset:3px;background:none;border:0;cursor:pointer;font:inherit;font-size:14px;padding:0}

/* ---------- REDAZIONE ---------- */
.demo{background:var(--ocra-ch);color:#6B4A12;padding:8px 16px;text-align:center;font-size:14px}
.adm-top{background:var(--scuro);color:#fff}
.adm-top .in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.adm-logo{display:flex;align-items:center;gap:10px}
.adm-logo .marchio-txt b{color:#fff}.adm-logo .marchio-txt small{color:#A89A8F}
.adm-tag{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.adm-top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
.adm-top .btn:hover{border-color:#fff}
.adm-tabs{background:rgba(251,248,243,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.adm-tabs .in{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:8px 18px;scrollbar-width:none}
.adm-tabs button{font-weight:600;font-size:14.5px;background:none;border:0;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.adm-tabs button:hover{background:var(--bg-2)}
.adm-tabs button.on{background:var(--ink);color:#fff}
.adm{max-width:1400px;margin:0 auto;padding:22px 18px 80px}
.h-adm{font-family:var(--font-t);font-weight:800;font-size:28px;letter-spacing:-.035em;margin:0}
.testa-adm{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pannello{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.pannello h3{margin:0 0 12px;font-family:var(--font-t);font-weight:700;font-size:20px;letter-spacing:-.02em}
.campi{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 14px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.campo.largo{grid-column:1/-1}
textarea.input{min-height:90px;resize:vertical;line-height:1.55}
.ed-testo{min-height:380px!important;font-size:17px!important;line-height:1.7!important}
.titolo-input{font-family:var(--font-t);font-size:24px!important;font-weight:700;letter-spacing:-.02em}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;vertical-align:1px}
.b-bozza{background:#EEE9E2;color:#5F574F}.b-pronto{background:#E3E0F7;color:#463A99}.b-revisione{background:#FDECC8;color:#8A5A00}.b-pubblicato{background:#DCF2E0;color:#1F6B30}.b-programmato{background:#E1E9FA;color:#284C8F}
.riga-adm{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.riga-adm:last-child{border-bottom:0}
.riga-adm img,.ph{width:64px;height:48px;object-fit:cover;flex:none;background:var(--bg-2);border-radius:8px}
.riga-adm .t{flex:1;min-width:170px}
.riga-adm .t b{display:block;font-size:15.5px}
@media(max-width:600px){.riga-adm .azioni{width:100%;justify-content:flex-end}}
.avviso-adm{background:var(--ocra-ch);border:1px solid #F0D3A2;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:14.5px}
.ed-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:53px;background:var(--bg);padding:8px 0;z-index:10;border-bottom:1px solid var(--line)}
.fs{border:0;padding:0;margin:0;min-width:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--scuro);color:#fff;padding:12px 20px;border-radius:999px;z-index:200;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14.5px;font-weight:500}
.toast.err{background:#B42318}
.blocco-ed{border:1px solid var(--line);border-left:4px solid var(--bordeaux);border-radius:12px;padding:12px;margin-bottom:10px;background:#FFFDF9}
.blocco-ed .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.blocco-ed .hd b{font-size:15px}
.login{max-width:420px;margin:44px auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:13px;box-shadow:var(--ombra)}
.login h2{font-family:var(--font-t);font-weight:800;letter-spacing:-.035em;color:var(--ink);margin:0;text-align:center;font-size:26px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bg-2)}
.thumb .p{padding:6px;display:flex;flex-direction:column;gap:6px}
.thumb .input{padding:6px 8px;font-size:14px}
.img-campo{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.img-campo>img{width:160px;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:var(--bg-2)}
.err-txt{color:#B42318;font-size:14px}

/* ---------- BARRA NOTIZIE ---------- */
.ticker{background:var(--scuro);color:#fff;display:flex;align-items:stretch;height:38px;font-size:13.5px;overflow:hidden}
.tk-lab{flex:none;display:flex;align-items:center;gap:8px;background:var(--bordeaux);padding:0 14px 0 16px;font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.tk-lab::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ocra);animation:pulsa-oc 1.8s infinite}
@keyframes pulsa-oc{0%{box-shadow:0 0 0 0 rgba(242,180,90,.6)}70%{box-shadow:0 0 0 7px rgba(242,180,90,0)}100%{box-shadow:0 0 0 0 rgba(242,180,90,0)}}
.tk-vis{flex:1;min-width:0;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.tk-nastro{display:flex;width:max-content;height:100%;align-items:center;animation:scorri 40s linear infinite}
.tk-nastro.fermo{animation:none}
.tk-vis:has(.fermo){overflow-x:auto;scrollbar-width:none}
.ticker:hover .tk-nastro,.ticker:focus-within .tk-nastro{animation-play-state:paused}
@keyframes scorri{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-voce{display:inline-flex;align-items:center;gap:8px;padding:0 20px;white-space:nowrap;height:100%;position:relative}
.tk-voce::after{content:'';position:absolute;right:0;top:12px;bottom:12px;width:1px;background:rgba(255,255,255,.16)}
a.tk-voce:hover .tk-txt{text-decoration:underline;text-underline-offset:3px}
.tk-tag{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ocra)}
.tk-ult .tk-tag{background:var(--ocra);color:var(--scuro);padding:2px 7px;border-radius:5px}
.tk-ult .tk-txt{font-weight:700}
.tk-esito{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;color:#fff}
@media(prefers-reduced-motion:reduce){.tk-nastro{animation:none}}

/* ---------- EDITOR PRIMA PAGINA ---------- */
.adm.largo{max-width:1520px}
.pp-barra{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:53px;z-index:15;background:rgba(251,248,243,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 0;border-bottom:1px solid var(--line)}
.pp-layout{display:grid;gap:18px}
@media(min-width:1000px){.pp-layout.con-lato{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.pp-lato{position:sticky;top:130px;max-height:calc(100vh - 150px);overflow:auto}}
.pp-schermo{border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--ombra);background:var(--bg);min-width:0}
.pp-cornice{display:flex;align-items:center;gap:6px;padding:9px 14px;background:#EFE8DD;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pp-cornice i{width:10px;height:10px;border-radius:50%;background:#D9CFC1;display:inline-block;flex:none}
.pp-cornice span{margin-left:8px;background:#fff;border-radius:999px;padding:3px 12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-sito .hd{position:relative;z-index:1}
.pp-sito main{padding-top:26px}
.pp-blocco{position:relative;border-radius:16px;cursor:pointer;outline:2px dashed transparent;outline-offset:5px;transition:outline-color .15s}
.pp-blocco:hover{outline-color:rgba(142,27,44,.4)}
.pp-blocco.sel{outline:2.5px solid var(--bordeaux)}
.pp-tk{border-radius:0;outline-offset:-3px}
.pp-etich{position:absolute;top:10px;left:10px;z-index:6;display:none;align-items:center;gap:4px;background:var(--bordeaux);color:#fff;font-size:12px;font-weight:700;padding:4px 5px 4px 11px;border-radius:9px;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap}
.pp-tk .pp-etich{top:5px;left:auto;right:8px;padding:3px 10px}
.pp-etich span{margin-right:4px}
.pp-etich button{background:rgba(255,255,255,.18);border:0;color:#fff;width:26px;height:24px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.pp-etich button:hover:not(:disabled){background:rgba(255,255,255,.34)}
.pp-etich button:disabled{opacity:.35;cursor:default}
.pp-blocco:hover>.pp-etich,.pp-blocco.sel>.pp-etich{display:flex}
@media(hover:none){.pp-blocco>.pp-etich{display:flex}}
.pp-vuoto{border:2px dashed #D8CCBA;border-radius:18px;padding:30px 16px;text-align:center;color:var(--muted);margin-bottom:40px;font-weight:600;background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(0,0,0,.018) 10px,rgba(0,0,0,.018) 20px)}
.pp-tk-off{margin:0;border-radius:0;padding:9px 16px;font-size:13px}
.pp-ins{display:flex;align-items:center;justify-content:center;min-height:30px;margin:-36px 0 8px;position:relative;z-index:4}
.pp-ins.primo{margin:0 0 8px}
.pp-ins.ultimo{margin-top:-20px}
.pp-ins::before{content:'';position:absolute;left:8%;right:8%;top:50%;border-top:2px dashed var(--bordeaux);opacity:0;transition:opacity .15s}
.pp-ins:hover::before{opacity:.45}
.pp-ins-btn{position:relative;font:inherit;font-size:12.5px;font-weight:700;background:var(--card);color:var(--bordeaux);border:1.5px solid var(--bordeaux);border-radius:999px;padding:4px 13px;cursor:pointer;opacity:0;transition:opacity .15s}
.pp-ins:hover .pp-ins-btn,.pp-ins.ultimo .pp-ins-btn,.pp-ins.primo.ultimo .pp-ins-btn{opacity:1}
@media(hover:none){.pp-ins-btn{opacity:1}}
.pp-ins.aperto{margin-top:-14px;margin-bottom:22px}
.pp-ins-menu{position:relative;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--ombra);max-width:640px}
.pp-lato{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pp-pan-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pp-pan-hd b{font-family:var(--font-t);font-size:19px;letter-spacing:-.02em}
.pp-pan-hd .ico-btn{width:32px;height:32px;cursor:pointer;font-size:13px}
.pp-lato .nota{margin:0 0 12px}
.pp-lista{display:flex;flex-direction:column;gap:6px}
.pp-voce{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;font-size:14.5px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.pp-voce:hover{border-color:var(--bordeaux)}
.pp-voce small{margin-left:auto;color:var(--muted);font-weight:500}
.pp-num{width:24px;height:24px;border-radius:7px;background:var(--bordeaux);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.spunta{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:500;cursor:pointer}
.spunta input{width:18px;height:18px;accent-color:var(--bordeaux)}
@media(max-width:999px){
  .pp-lato{display:none}
  .pp-lato.attivo{display:block;position:fixed;left:0;right:0;bottom:0;max-height:64vh;overflow:auto;z-index:60;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.22);padding:18px 18px 28px}
}

.da-pubbl{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#463A99;color:#fff}

/* ---------- EDITOR ARTICOLO CON ANTEPRIMA ---------- */
.ed-prev{display:none}
.ed-grid.mostra-prev .ed-form{display:none}
.ed-grid.mostra-prev .ed-prev{display:block}
.ed-prev-tit{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2px 0 10px}
.ed-prev-card{max-width:380px;margin-bottom:22px}
.ed-prev-art{padding:26px 18px}
@media(min-width:1100px){
  .ed-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
  .ed-grid .ed-form{display:block!important}
  .ed-grid .ed-prev{display:block!important;position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto;padding-right:4px}
  .btn-anteprima{display:none!important}
}

/* ---------- TELEFONO ---------- */
.tabbar{display:none}
@media(max-width:760px){
  .hd .nav{display:none}
  .hd-top{padding:10px 16px}
  .accedi{height:38px;padding:0 13px 0 11px;font-size:14px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(251,248,243,.95);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:5px 0 3px;border-radius:12px;-webkit-tap-highlight-color:transparent}
  .tabbar a.on{color:var(--bordeaux)}
  .tabbar a.on svg{stroke-width:2.4}
  .tabbar a:active{background:var(--bg-2)}
  .pubblico{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  main{padding:18px 0 40px}
  .wrap{padding:0 14px}
  .sez{margin-bottom:36px}
  .pag-hd{margin-bottom:18px}
}
@media(max-width:640px){
  /* schede articolo compatte: immagine a sinistra, testo a destra */
  .griglia,.riga{gap:12px}
  .riga{margin-bottom:36px}
  .griglia .card,.riga .card{display:grid;grid-template-columns:112px minmax(0,1fr);border-radius:16px}
  .griglia .card .card-img,.riga .card .card-img,.griglia .card .card-ph,.riga .card .card-ph{aspect-ratio:auto;width:100%;height:100%;min-height:118px}
  .griglia .card .card-ph,.riga .card .card-ph{font-size:34px}
  .griglia .card .card-c,.riga .card .card-c{padding:11px 13px 12px;gap:5px}
  .griglia .card h3,.riga .card h3{font-size:16.5px;line-height:1.2}
  .griglia .card p,.riga .card p{font-size:13.5px;-webkit-line-clamp:2}
  .griglia .card .meta,.riga .card .meta{font-size:12px}
  .card:hover{transform:none}
  .hero{min-height:400px}
  .hero-in{gap:8px}
  .voce{align-items:start}
  .voce img{height:92px;min-height:0}
  .cartaceo{gap:18px}
  .cartaceo .cop{width:118px}
  .invito{border-radius:22px}
  .art h1{margin-top:10px}
  .corpo{font-size:18px;line-height:1.7}
  .btn-s{min-height:34px}
  /* redazione */
  .demo{font-size:12.5px;padding:6px 12px}
  .adm-top .in{padding:8px 14px;gap:8px}
  .adm-top .logo{font-size:11.5px}
  .adm-utente{display:none}
  .adm-top .btn-s{padding:4px 10px;font-size:12.5px;min-height:30px}
  .adm-tabs .in{padding:6px 12px}
  .adm{padding:16px 14px 120px}
  .h-adm{font-size:24px}
  .pp-barra{position:static;padding:0 0 10px}
  .pp-nota-lunga{display:none}
  .pp-barra .azioni{width:100%}
  .pp-barra .btn-p{flex:1}
  .pp-sito main{padding-top:18px}
  .ed-head{position:static;border:0;padding:0;margin-bottom:10px}
  .ed-head .azioni{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));flex-wrap:nowrap;gap:8px;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
  .ed-head .azioni .btn{flex:1 1 auto;padding:10px 8px;font-size:14px;white-space:nowrap}
  .riga-adm{gap:10px}
  .riga-adm .azioni{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;margin:0 -2px;padding:2px}
  .riga-adm .azioni::-webkit-scrollbar{display:none}
  .riga-adm .azioni .btn{flex:none}
  .pannello{padding:14px}
  .testa-adm .btn-p{padding:9px 14px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom));border-radius:16px;text-align:center}
}
</style>
</head>
<body>
<div id="root"><div class="boot">La Piazza</div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

function fmtData(ms) { if (!ms) return ''; const d = new Date(ms); return `${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`; }
function dataISO(iso) { const [y, m, d] = String(iso || '').split('-').map(Number); return y ? new Date(y, (m || 1) - 1, d || 1) : null; }

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
/* Formattazione semplice: riga vuota = nuovo paragrafo, ## intertitolo, > citazione, - elenco, **grassetto**, *corsivo*, [testo](link) */
function md(t) {
  return String(t || '').replace(/\r/g, '').split(/\n\s*\n/).map(b => {
    b = b.trim(); if (!b) return '';
    const righe = b.split('\n');
    if (b.startsWith('## ')) return '<h2>' + inline(b.slice(3)) + '</h2>';
    if (righe.every(l => l.startsWith('>'))) return '<blockquote>' + righe.map(l => inline(l.replace(/^>\s?/, ''))).join('<br>') + '</blockquote>';
    if (righe.every(l => /^[-•]\s/.test(l))) return '<ul>' + righe.map(l => '<li>' + inline(l.replace(/^[-•]\s/, '')) + '</li>').join('') + '</ul>';
    return '<p>' + righe.map(inline).join('<br>') + '</p>';
  }).join('');
}
function testoPiano(t) { return String(t || '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[#>*_]/g, '').replace(/^\s*-\s/gm, '').replace(/\s+/g, ' ').trim(); }

/* Immagini: ottimizzazione automatica se ospitate su Cloudinary */
function imgUrl(u, w) {
  if (!u) return '';
  if (u.includes('res.cloudinary.com') && u.includes('/upload/') && !u.includes('/upload/f_auto'))
    return u.replace('/upload/', `/upload/f_auto,q_auto,c_limit,w_${w}/`);
  return u;
}
function comprimi(file, max, q) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('Lettura del file non riuscita'));
    r.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('Formato immagine non supportato'));
      im.onload = () => {
        let w = im.width, h = im.height; const s = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(im, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', q));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
async function caricaImmagine(file) {
  if (!file.type.startsWith('image/')) throw new Error('Il file scelto non è un\'immagine');
  const dataUrl = await comprimi(file, DEMO ? 1400 : 2000, DEMO ? 0.72 : 0.85);
  if (CLOUDINARY.cloudName && CLOUDINARY.uploadPreset) {
    const fd = new FormData();
    fd.append('file', dataUrl);
    fd.append('upload_preset', CLOUDINARY.uploadPreset);
    const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/image/upload`, { method: 'POST', body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error('Caricamento non riuscito: ' + ((j.error && j.error.message) || r.status));
    return j.secure_url;
  }
  if (DEMO) return dataUrl;
  throw new Error('Per caricare foto va configurato Cloudinary (vedi LEGGIMI). Intanto puoi incollare il link di un\'immagine.');
}

const Store = {
  async meta(nome) {
    if (DEMO) return { ...clone(META_DEFAULT[nome]), ...clone(demoLoad().meta[nome] || {}) };
    const s = await FB.db.collection('meta').doc(nome).get();
    return { ...clone(META_DEFAULT[nome]), ...(s.exists ? s.data() : {}) };

    if (DEMO) {
      const d = demoLoad();
      const nx = clone(fn({ ...clone(META_DEFAULT[nome]), ...clone(d.meta[nome] || {}) }));
      d.meta[nome] = nx; demoSave(); return nx;
    }
    const ref = FB.db.collection('meta').doc(nome);
    return FB.db.runTransaction(async t => {
      const s = await t.get(ref);
      const nx = clone(fn({ ...clone(META_DEFAULT[nome]), ...(s.exists ? s.data() : {}) }));
      t.set(ref, nx); return nx;
    });
  },
  async articolo(id) {

    });

      if (DEMO) { const d = demoLoad(); pubbl.forEach(a => { d.articoli[a.id] = a; }); demoSave(); }
      else { const b = FB.db.batch(); pubbl.forEach(a => b.set(FB.db.collection('articoli').doc(a.id), a)); await b.commit(); }
      const ids = new Set(pubbl.map(a => a.id));
      await Store.aggiornaMeta('indice', ix => {
        const l = (ix.articoli || []).filter(x => !ids.has(x.id)).concat(pubbl.map(voceIndice));
        l.sort((x, y) => y.data - x.data); return { articoli: l };
      });
    }
    await Store.aggiornaMeta('layout', () => layout);
    await Store.eliminaBozzaLayout().catch(() => {});
  },
  async eliminaArticolo(a, u) {
    if (DEMO) { delete demoLoad().articoli[a.id]; demoSave(); }
    else await FB.db.collection('articoli').doc(a.id).delete();
    if (u.ruolo === 'admin') await Store.aggiornaMeta('indice', ix => ({ articoli: (ix.articoli || []).filter(x => x.id !== a.id) }));
  },
  async utente(id) {
    if (DEMO) return clone(demoLoad().utenti[id] || { nome: 'Amministratore (demo)', utente: 'admin', ruolo: 'admin' });
    const s = await FB.db.collection('utenti').doc(id).get(); return s.exists ? s.data() : null;
  },
  async utenti() {
    if (DEMO) return Object.entries(demoLoad().utenti).map(([id, u]) => ({ uid: id, ...u }));
    const s = await FB.db.collection('utenti').get(); return s.docs.map(d => ({ uid: d.id, ...d.data() }));
  },
  async sistemaPronto() {
    if (DEMO) return true;
    const s = await FB.db.collection('meta').doc('sistema').get(); return s.exists;
  },
  async creaUtente({ nome, utente, password, ruolo }) {
    const u = pulisciUtente(utente);
    if (DEMO) {
      const d = demoLoad();
      if (Object.values(d.utenti).some(x => x.utente === u)) throw new Error('Questo nome utente esiste già.');
      d.utenti[uid()] = { nome, utente: u, ruolo, creato: Date.now() }; demoSave(); return;
    }
    const aut = appSecondaria();
    const r = await aut.createUserWithEmailAndPassword(emailDa(u), pwFirebase(password));
    const nuovo = r.user.uid;
    await aut.signOut().catch(() => {});
    await FB.db.collection('utenti').doc(nuovo).set({ nome, utente: u, ruolo, creato: Date.now() });
  },
  async aggiornaUtente(id, campi) {
    if (DEMO) { Object.assign(demoLoad().utenti[id], campi); demoSave(); return; }
    await FB.db.collection('utenti').doc(id).update(campi);
  }
};

const DEMO_USER_KEY = 'lapiazza_demo_user';
const Auth = {
  osserva(cb) {
    if (DEMO) { let u = null; try { u = JSON.parse(sessionStorage.getItem(DEMO_USER_KEY) || 'null'); } catch (e) {} cb(u); return () => {}; }
    return FB.auth.onAuthStateChanged(u => cb(u ? { uid: u.uid, email: u.email } : null));
  },
  async accedi(utente, pw) {
    if (DEMO) { const u = { uid: 'demo', email: emailDa(utente || 'admin') }; try { sessionStorage.setItem(DEMO_USER_KEY, JSON.stringify(u)); } catch (e) {} return u; }
    const r = await FB.auth.signInWithEmailAndPassword(emailDa(utente), pwFirebase(pw)); return { uid: r.user.uid, email: r.user.email };
  },
  async primoAdmin(nome, utente, pw, codice) {
    const u = pulisciUtente(utente);
    let r;
    try { r = await FB.auth.createUserWithEmailAndPassword(emailDa(u), pwFirebase(pw)); }
    catch (e) { if (e.code !== 'auth/email-already-in-use') throw e; r = await FB.auth.signInWithEmailAndPassword(emailDa(u), pwFirebase(pw)); }
    const b = FB.db.batch();
    b.set(FB.db.collection('utenti').doc(r.user.uid), { nome, utente: u, ruolo: 'admin', codiceSetup: codice, creato: Date.now() });
    b.set(FB.db.collection('meta').doc('sistema'), { inizializzato: true, creato: Date.now() });
    try { await b.commit(); }
    catch (e) {
      await FB.auth.signOut().catch(() => {});
      if (e.code === 'permission-denied') throw new Error('Codice di attivazione non valido.');
      throw e;
    }
    return { uid: r.user.uid, email: r.user.email };
  },
  async cambiaPassword(attuale, nuova) {
    if (DEMO) return;
    const u = FB.auth.currentUser;
    await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, pwFirebase(attuale)));
    await u.updatePassword(pwFirebase(nuova));
  },
  async esci() {
    if (DEMO) { try { sessionStorage.removeItem(DEMO_USER_KEY); } catch (e) {} return; }
    await FB.auth.signOut();
  }
};

/* ---------- routing con hash ---------- */
function useRotta() {
  const [h, setH] = useState(location.hash || '#/');
  useEffect(() => {
    const f = () => { setH(location.hash || '#/'); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f);
  }, []);
  return h.replace(/^#\/?/, '').split('/').map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
}

  const inCasa = p.casa === noi, fuori = p.ospite === noi;

  const mio = inCasa ? +p.gc : +p.go, loro = inCasa ? +p.go : +p.gc;
  return mio > loro ? 'V' : mio < loro ? 'S' : 'P';
}

/* ---------- barra notizie scorrevole ---------- */
const TICKER_DEFAULT = { attivo: true, testo: '', link: '', risultati: true, prossime: true, articoli: true, nArticoli: 4 };
function vociTicker(dati, pubblicati) {
  const T = { ...TICKER_DEFAULT, ...((dati.layout || {}).ticker || {}) };
  if (!T.attivo) return [];
  const voci = [];
  if (T.testo && T.testo.trim()) voci.push({ k: 'u', tag: 'Ultim\'ora', cls: 'tk-ult', testo: T.testo.trim(), link: T.link || '' });
  const sq = (dati.sport || {}).squadre || [], pt = (dati.sport || {}).partite || [];
  const oggi = oggiISO();
  if (T.risultati) sq.forEach(s => {
    const u = pt.filter(p => p.squadraId === s.id && giocata(p)).sort(perDataDesc)[0];
    if (u) voci.push({ k: 'r' + s.id, tag: s.sport || 'Sport', testo: `${u.casa} ${u.gc}–${u.go} ${u.ospite}`, link: '#/sport', esito: esito(u, s.nome) });
  });
  if (T.prossime) sq.forEach(s => {
    const n = pt.filter(p => p.squadraId === s.id && !giocata(p) && p.data >= oggi).sort(perDataAsc)[0];
    if (n) voci.push({ k: 'p' + s.id, tag: 'Prossima', testo: `${n.casa} – ${n.ospite} · ${fmtGiorno(n.data)}${n.ora ? ' ' + n.ora : ''}`, link: '#/sport' });
  });
  if (T.articoli) pubblicati.slice(0, +T.nArticoli || 4).forEach(a => voci.push({ k: 'a' + a.id, tag: a.categoria || 'Articolo', testo: a.titolo, link: '#/articolo/' + a.id, col: coloreCat(a.categoria) }));
  return voci;
}
const MOTO_RIDOTTO = (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
function Ticker({ dati, pubblicati }) {
  const voci = vociTicker(dati, pubblicati);
  if (!voci.length) return null;
  const durata = Math.max(22, Math.round(voci.reduce((s, v) => s + v.testo.length + v.tag.length + 8, 0) * 0.22));
  const lista = copia => voci.map(v => {
    const dentro = <>
      <span className="tk-tag" style={v.col ? { color: `color-mix(in srgb, ${v.col} 45%, #F2B45A)` } : undefined}>{v.tag}</span>
      {v.esito && <span className={'tk-esito e-' + v.esito.toLowerCase()}>{v.esito}</span>}
      <span className="tk-txt">{v.testo}</span>
    </>;
    const prop = { key: v.k + copia, className: 'tk-voce' + (v.cls ? ' ' + v.cls : ''), 'aria-hidden': copia ? 'true' : undefined, tabIndex: copia ? -1 : undefined };
    return v.link ? <a href={v.link} {...prop}>{dentro}</a> : <span {...prop}>{dentro}</span>;
  });
  return (
    <div className="ticker" role="region" aria-label="Ultime notizie e risultati">
      <span className="tk-lab">Le ultime</span>
      <div className="tk-vis">
        <div className={'tk-nastro' + (MOTO_RIDOTTO ? ' fermo' : '')} style={{ animationDuration: durata + 's' }}>{lista('')}{!MOTO_RIDOTTO && lista('-2')}</div>
      </div>
    </div>
  );
}

function Home({ dati, pubblicati, editor }) {
  const blocchi = dati.layout.blocchi || [];
  const perId = Object.fromEntries(pubblicati.map(a => [a.id, a]));
  const usati = new Set();
  blocchi.forEach(b => {
    if (b.tipo === 'apertura' && perId[b.articolo]) usati.add(b.articolo);
    if (b.tipo === 'riga') (b.articoli || []).forEach(id => { if (perId[id]) usati.add(id); });
  });
  const prendi = (n, cat) => {
    const out = [];
    for (const a of pubblicati) {
      if (out.length >= n) break;
      if (usati.has(a.id) || (cat && a.categoria !== cat)) continue;
      out.push(a); usati.add(a.id);
    }
    return out;
  };
  const periodicita = (dati.layout.testata || {}).periodicita;
  const el = blocchi.map((b, i) => {
    const x = (() => { switch (b.tipo) {
      case 'apertura': { const a = perId[b.articolo] || prendi(1)[0]; return a ? <BloccoApertura key={b.id} a={a} /> : null; }
      case 'riga': { const l = (b.articoli || []).map(id => perId[id]).filter(Boolean); return l.length ? <div key={b.id} className="riga">{l.map(a => <Card key={a.id} a={a} />)}</div> : null; }
      case 'ultimi': {
        const l = prendi(+b.n || 6, b.categoria);
        return l.length ? (
          <section key={b.id} className="sez">
            <SezHd t={b.titolo || 'Ultimi articoli'} link={b.categoria ? '#/categoria/' + encodeURIComponent(b.categoria) : '#/archivio'} />
            <div className="griglia">{l.map(a => <Card key={a.id} a={a} />)}</div>
          </section>) : null;
      }
      case 'sport': return <BloccoSport key={b.id} sport={dati.sport} />;
      case 'galleria': return <BloccoGalleria key={b.id} gallerie={dati.gallerie} albumId={b.album} />;
      case 'numero': return <BloccoNumero key={b.id} numeri={dati.numeri} periodicita={periodicita} />;
      case 'invito': return <BloccoInvito key={b.id} />;
      case 'avviso': return b.testo ? (b.link ? <a key={b.id} className="avviso" href={b.link}>{b.testo}</a> : <div key={b.id} className="avviso">{b.testo}</div>) : null;
      default: return null;
    } })();
    return editor ? editor.wrap(b, i, x) : x;
  }).filter(Boolean);
  if (editor && !blocchi.length) return editor.vuoto();
  if (!el.length) return <div className="vuoto">Ancora nessun articolo pubblicato.</div>;
  return <>{el}</>;
}

function Lightbox({ foto, i, chiudi }) {
  const [k, setK] = useState(i);
  const n = foto.length;
  const t0 = useRef(null);
  const chiudiRef = useRef(chiudi); chiudiRef.current = chiudi;
  useEffect(() => {
    const f = e => {
      if (e.key === 'Escape') chiudiRef.current();
      if (e.key === 'ArrowRight') setK(x => (x + 1) % n);
      if (e.key === 'ArrowLeft') setK(x => (x - 1 + n) % n);
    };
    document.addEventListener('keydown', f); document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', f); document.body.style.overflow = ''; };
  }, [n]);
  const f = foto[k] || foto[0];
  return (
    <div className="lb" onClick={chiudi}
      onTouchStart={e => { t0.current = e.touches[0].clientX; }}
      onTouchEnd={e => { if (t0.current == null) return; const dx = e.changedTouches[0].clientX - t0.current; if (Math.abs(dx) > 50) setK(x => (x + (dx < 0 ? 1 : -1) + n) % n); t0.current = null; }}>
      <img src={imgUrl(f.url, 1600)} alt={f.didascalia || ''} onClick={e => e.stopPropagation()} />
      <div className="did">{f.didascalia} {n > 1 && <span style={{ opacity: .6 }}>· {k + 1}/{n}</span>}</div>
      <button className="x" onClick={chiudi} aria-label="Chiudi">✕</button>
      {n > 1 && <>
        <button className="pr" aria-label="Precedente" onClick={e => { e.stopPropagation(); setK((k - 1 + n) % n); }}>‹</button>
        <button className="nx" aria-label="Successiva" onClick={e => { e.stopPropagation(); setK((k + 1) % n); }}>›</button>
      </>}
    </div>
  );
}

function righeClassifica(t) {
  return String(t || '').split('\n').map(l => l.split(/[;\t]/).map(x => x.trim())).filter(r => r[0]);
}

function Accesso({ onEntrato }) {

  const [codice, setCodice] = useState('');

  useEffect(() => {
    Store.sistemaPronto().then(p => { setPronto(p); if (!p) setUtente('admin'); }).catch(() => setPronto(true));
  }, []);
  const primo = pronto === false;
  const invia = async e => {
    e.preventDefault(); setErr(''); setOcc(true);
    try {
      if (primo) {
        if (!codice.trim()) throw new Error('Inserisci il codice di attivazione.');
        if (!nome.trim()) throw new Error('Inserisci nome e cognome.');
        if (!UTENTE_VALIDO.test(pulisciUtente(utente))) throw new Error('Nome utente non valido: usa lettere, numeri, punto o trattino.');
        if (pw.length < PW_MIN) throw new Error(`La password deve avere almeno ${PW_MIN} caratteri.`);
        if (pw !== pw2) throw new Error('Le due password non coincidono.');
        onEntrato(await Auth.primoAdmin(nome.trim(), utente, pw, codice.trim().toUpperCase()));
      } else {
        if (!DEMO && (!utente.trim() || !pw)) throw new Error('Inserisci nome utente e password.');
        onEntrato(await Auth.accedi(utente, pw));
      }
    } catch (ex) { setErr(msgErrore(ex)); }
    setOcc(false);
  };
  if (pronto === undefined) return <div className="vuoto">Caricamento…</div>;
  return (
    <form className="login" onSubmit={invia}>
      <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 4 }}><Marchio grande /></div>
      <h2>{primo ? 'Primo avvio' : 'Accesso redazione'}</h2>
      {primo && <div className="avviso-adm" style={{ margin: 0 }}>Configurazione iniziale riservata all'amministratore del sito: serve il codice di attivazione.</div>}
      {primo && <label className="campo"><span>Codice di attivazione</span><input className="input" autoCapitalize="characters" autoCorrect="off" spellCheck="false" autoComplete="off" value={codice} onChange={e => setCodice(e.target.value)} /></label>}

      <label className="campo"><span>Nome utente</span><input className="input" autoCapitalize="none" autoCorrect="off" spellCheck="false" autoComplete="username" value={utente} onChange={e => setUtente(e.target.value)} /></label>
      <label className="campo"><span>Password</span><input className="input" type="password" autoComplete={primo ? 'new-password' : 'current-password'} value={pw} onChange={e => setPw(e.target.value)} /></label>

      {err && <div className="err-txt">{err}</div>}

    <div className="login">
      <h2>Account non attivo</h2>
      <p style={{ margin: 0 }}>{utente.ruolo === 'disattivato' ? 'Il tuo account è stato disattivato. Contatta l\'amministratore.' : 'Profilo non trovato: contatta l\'amministratore.'}</p>
      <div className="azioni"><button className="btn" onClick={() => setAuthU({ ...authU })}>Riprova</button><button className="btn" onClick={esci}>Esci</button></div>
    </div>);
  else if (!dati) corpo = <div className="vuoto">Caricamento…</div>;
  else if (cambioPw) corpo = <CambiaPassword chiudi={() => setCambioPw(false)} avvisa={avvisa} />;
  else {
    const admin = utente.ruolo === 'admin';
    const tabs = [['home', 'Prima pagina'], ['articoli', 'Articoli'], ['sport', 'Sport'], ['foto', 'Foto'], ...(admin ? [['numeri', 'Numeri'], ['utenti', 'Utenti']] : [])];
    const p = { utente, dati, ricarica, avvisa };
    corpo = <>
      <div className="adm-tabs"><div className="in">{tabs.map(([k, l]) => <button key={k} className={tab === k ? 'on' : ''} onClick={() => setTab(k)}>{l}</button>)}</div></div>
      <div className={'adm' + (tab === 'home' ? ' largo' : '')}>
        {tab === 'articoli' && <GestioneArticoli {...p} />}
        {tab === 'home' && <GestionePrimaPagina key={'pp-' + utente.uid} {...p} />}
        {tab === 'sport' && <GestioneSport {...p} />}
        {tab === 'foto' && <GestioneFoto {...p} />}
        {tab === 'numeri' && admin && <GestioneNumeri {...p} />}
        {tab === 'utenti' && admin && <GestioneUtenti {...p} />}
      </div>
    </>;
  }
  return (
    <div>
      {DEMO && <div className="demo">Modalità demo: i dati restano solo in questo browser. Inserisci la configurazione Firebase per andare online.</div>}
      <div className="adm-top"><div className="in">
        <a href="#/" className="adm-logo"><Marchio chiaro /><span className="adm-tag">Redazione</span></a>
        <div className="azioni">
          {utente && utente !== 'carico' && <span className="adm-utente" style={{ fontSize: 14, opacity: .9 }}>{utente.nome || utente.utente}{utente.ruolo === 'admin' ? ' · amministratore' : ''}</span>}
          {authU && utente && utente !== 'carico' && ['admin', 'redattore'].includes(utente.ruolo) && <button className="btn btn-s" onClick={() => setCambioPw(true)}>Cambia password</button>}
          <a className="btn btn-s" href="#/">Vai al sito</a>
          {authU && <button className="btn btn-s" onClick={esci}>Esci</button>}
        </div>
      </div></div>
      {corpo}
      {toast && <div className={'toast' + (toast.err ? ' err' : '')}>{toast.msg}</div>}
    </div>
  );
}

/* ---------- articoli ---------- */
function GestioneArticoli({ utente, dati, ricarica, avvisa }) {
  const [lista, setLista] = useState(null);
  const [ed, setEd] = useState(null);
  const [filtro, setFiltro] = useState('');
  const [q, setQ] = useState('');
  const admin = utente.ruolo === 'admin';
  const categorie = dati.layout.categorie && dati.layout.categorie.length ? dati.layout.categorie : CATEGORIE_DEFAULT;
  const carica = useCallback(async () => {
    try { const l = await Store.articoliRedazione(utente); l.sort((a, b) => (b.modificato || 0) - (a.modificato || 0)); setLista(l); }
    catch (e) { avvisa(msgErrore(e), true); setLista([]); }
  }, [utente, avvisa]);
  useEffect(() => { carica(); }, [carica]);

  if (ed) return <Editor iniziale={ed} utente={utente} categorie={categorie} avvisa={avvisa}
    chiudi={async salvato => { setEd(null); if (salvato) { await carica(); ricarica(); } }} />;

  const nuovo = () => setEd({
    id: Store.nuovoId(), titolo: '', occhiello: '', sommario: '', testo: '', categoria: categorie[0], autore: utente.nome || '',
    autoreUid: utente.uid, immagine: '', didascalia: '', galleria: [], numero: '', stato: 'bozza', data: Date.now(), creato: Date.now()
  });
  const approva = async a => {
    try { await Store.salvaArticolo({ ...a, stato: 'pronto' }, utente); avvisa('Pronto per l\'uscita: andrà online con la prossima edizione'); carica(); }
    catch (e) { avvisa(msgErrore(e), true); }
  };
  const inApertura = async a => {
    try {
      const l = (await Store.bozzaLayout()) || clone(dati.layout);
      const blocchi = [...(l.blocchi || [])];
      const i = blocchi.findIndex(b => b.tipo === 'apertura');
      if (i >= 0) blocchi[i] = { ...blocchi[i], articolo: a.id };
      else blocchi.unshift({ id: uid(), tipo: 'apertura', articolo: a.id });
      await Store.salvaBozzaLayout({ ...l, blocchi });
      avvisa('Messo in apertura nella prima pagina in preparazione');
    } catch (e) { avvisa(msgErrore(e), true); }
  };
  const elimina = async a => {
    if (!confirm(`Eliminare definitivamente "${a.titolo || 'senza titolo'}"?`)) return;
    try { await Store.eliminaArticolo(a, utente); avvisa('Articolo eliminato'); carica(); ricarica(); }
    catch (e) { avvisa(msgErrore(e), true); }
  };
  const qq = norm(q.trim());
  const vis = (lista || []).filter(a => (!filtro || (filtro === 'miei' ? a.autoreUid === utente.uid : a.stato === filtro)) && (!qq || norm((a.titolo || '') + ' ' + (a.autore || '')).includes(qq)));
  const inRev = (lista || []).filter(a => a.stato === 'revisione').length;
  return <>
    <div className="testa-adm"><h2 className="h-adm">Articoli</h2><button className="btn btn-p" onClick={nuovo}>+ Nuovo articolo</button></div>
    {admin && inRev > 0 && <div className="avviso-adm"><b>{inRev}</b> articol{inRev === 1 ? 'o' : 'i'} in attesa di revisione. <button className="link-txt" onClick={() => setFiltro('revisione')}>Mostra</button></div>}
    <div className="filtri">
      <input className="input" placeholder="Cerca per titolo o autore" value={q} onChange={e => setQ(e.target.value)} style={{ flex: 1, minWidth: 180 }} />
      <select className="sel" value={filtro} onChange={e => setFiltro(e.target.value)}>
        <option value="">Tutti gli stati</option><option value="miei">Solo i miei</option><option value="bozza">Bozze</option><option value="revisione">In revisione</option><option value="pronto">Pronti per l'uscita</option><option value="pubblicato">Online</option>
      </select>
    </div>
    <div className="pannello" style={{ padding: '0 16px' }}>
      {lista === null ? <div className="vuoto">Caricamento…</div> : !vis.length ? <div className="vuoto">Nessun articolo.</div> :
        vis.map(a => {
          const puo = admin || (a.autoreUid === utente.uid && a.stato !== 'pubblicato');
          return (
            <div className="riga-adm" key={a.id}>
              {a.immagine ? <img src={imgUrl(a.immagine, 200)} alt="" /> : <div className="ph" />}
              <div className="t"><b>{a.titolo || '(senza titolo)'}</b>
                <span className="nota"><Badge a={a} /> {[a.categoria, a.autore, fmtData(a.data)].filter(Boolean).join(' · ')}</span></div>
              <div className="azioni">
                {admin && ['bozza', 'revisione'].includes(a.stato) && <button className="btn btn-s btn-p" onClick={() => approva(a)}>Approva</button>}
                {admin && (a.stato === 'pronto' || (a.stato === 'pubblicato' && a.data <= Date.now())) && <button className="btn btn-s" onClick={() => inApertura(a)}>Metti in apertura</button>}
                <a className="btn btn-s" href={'#/articolo/' + a.id} target="_blank" rel="noopener">Vedi</a>
                <button className="btn btn-s" onClick={() => setEd(clone(a))}>{puo ? 'Modifica' : 'Apri'}</button>
                {admin && <button className="btn btn-s btn-d" onClick={() => elimina(a)}>Elimina</button>}
              </div>
            </div>);
        })}
    </div>
  </>;
}

function CampoImmagine({ valore, onChange, avvisa, etichetta = 'Immagine' }) {
  const [occ, setOcc] = useState(false);
  const [url, setUrl] = useState('');
  const carica = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    setOcc(true);
    try { onChange(await caricaImmagine(f)); } catch (ex) { avvisa(ex.message, true); }
    setOcc(false);
  };
  const usaLink = () => { const u = url.trim(); if (/^https?:\/\//.test(u) || /^[\w./-]+\.(jpe?g|png|webp|gif)$/i.test(u)) { onChange(u); setUrl(''); } else avvisa('Link non valido', true); };
  return (
    <div className="campo largo"><span>{etichetta}</span>
      <div className="img-campo">
        {valore && <img src={imgUrl(valore, 400)} alt="" />}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, flex: 1, minWidth: 220 }}>
          <label className="btn" style={{ alignSelf: 'flex-start', cursor: 'pointer' }}>{occ ? 'Caricamento…' : (valore ? 'Sostituisci foto' : 'Carica foto')}
            <input type="file" accept="image/*" hidden onChange={carica} disabled={occ} /></label>
          <div style={{ display: 'flex', gap: 6 }}>
            <input className="input" style={{ flex: 1 }} placeholder="…oppure incolla il link di un'immagine" value={url} onChange={e => setUrl(e.target.value)} />
            <button type="button" className="btn btn-s" onClick={usaLink}>Usa</button>
          </div>
          {valore && <button type="button" className="btn btn-s btn-d" style={{ alignSelf: 'flex-start' }} onClick={() => onChange('')}>Rimuovi</button>}
        </div>
      </div>
    </div>
  );
}

function CampoGalleria({ foto, onChange, avvisa }) {
  const [occ, setOcc] = useState('');
  const carica = async e => {
    const fs = [...(e.target.files || [])]; e.target.value = ''; if (!fs.length) return;
    const nuove = [];
    for (let i = 0; i < fs.length; i++) {
      setOcc(`${i + 1}/${fs.length}`);
      try { nuove.push({ url: await caricaImmagine(fs[i]), didascalia: '' }); } catch (ex) { avvisa(ex.message, true); break; }
    }
    setOcc(''); onChange([...(foto || []), ...nuove]);
  };
  const setDid = (i, v) => onChange(foto.map((x, k) => k === i ? { ...x, didascalia: v } : x));
  return (
    <div className="campo largo"><span>Galleria fotografica (facoltativa)</span>
      {(foto || []).length > 0 && <div className="thumbs" style={{ marginBottom: 8 }}>{foto.map((x, i) => (
        <div className="thumb" key={i}><img src={imgUrl(x.url, 300)} alt="" />
          <div className="p"><input className="input" placeholder="Didascalia" value={x.didascalia || ''} onChange={e => setDid(i, e.target.value)} />
            <button type="button" className="btn btn-s btn-d" onClick={() => onChange(foto.filter((_, k) => k !== i))}>Togli</button></div>
        </div>))}</div>}
      <label className="btn" style={{ alignSelf: 'flex-start', cursor: 'pointer' }}>{occ ? 'Caricamento ' + occ : '+ Aggiungi foto'}
        <input type="file" accept="image/*" multiple hidden onChange={carica} disabled={!!occ} /></label>
    </div>
  );
}

function Editor({ iniziale, utente, categorie, avvisa, chiudi }) {
  const base = useMemo(() => ({ galleria: [], ...iniziale }), [iniziale]);
  const [a, setA] = useState(base);
  const [anteprima, setAnteprima] = useState(false);
  const [occ, setOcc] = useState(false);
  const ref = useRef(null);
  const admin = utente.ruolo === 'admin';
  const sola = !admin && (iniziale.stato === 'pubblicato' || iniziale.autoreUid !== utente.uid);
  const set = (k, v) => setA(x => ({ ...x, [k]: v }));
  const ins = (prima, dopo = '', seg = '') => {
    const t = ref.current; if (!t) return;
    const s = t.selectionStart, e = t.selectionEnd; const sel = a.testo.slice(s, e) || seg;
    set('testo', a.testo.slice(0, s) + prima + sel + dopo + a.testo.slice(e));
    requestAnimationFrame(() => { t.focus(); t.selectionStart = s + prima.length; t.selectionEnd = s + prima.length + sel.length; });
  };
  const link = () => { const u = prompt('Indirizzo del link (https://…)'); if (u && /^https?:\/\//.test(u.trim())) ins('[', `](${u.trim()})`, 'testo del link'); };
  const salva = async statoForzato => {
    if (!a.titolo.trim()) { avvisa('Il titolo è obbligatorio', true); return; }
    setOcc(true);
    try {
      const da = { ...a, titolo: a.titolo.trim(), stato: statoForzato || a.stato };
      await Store.salvaArticolo(da, utente);
      avvisa(da.stato === 'pubblicato' ? (da.data > Date.now() ? 'Pubblicazione programmata' : 'Articolo aggiornato online') : da.stato === 'pronto' ? 'Pronto per l\'uscita' : da.stato === 'revisione' ? 'Inviato in revisione' : 'Bozza salvata');
      chiudi(true);
    } catch (e) { avvisa(msgErrore(e), true); setOcc(false); }
  };
  const annulla = () => { if (JSON.stringify(a) !== JSON.stringify(base) && !confirm('Uscire senza salvare le modifiche?')) return; chiudi(false); };
  return (
    <div>
      <div className="ed-head">
        <button className="btn" onClick={annulla}>← Articoli</button>
        <div className="azioni">
          <button className="btn btn-anteprima" onClick={() => setAnteprima(!anteprima)}>{anteprima ? 'Modifica' : 'Anteprima'}</button>
          {!sola && <>
            <button className="btn" disabled={occ} onClick={() => salva()}>Salva</button>
            {admin ? (a.stato === 'pubblicato' ? null : <button className="btn btn-p" disabled={occ} onClick={() => salva('pronto')}>Pronto per l'uscita</button>)
              : <button className="btn btn-p" disabled={occ} onClick={() => salva('revisione')}>Invia in revisione</button>}
          </>}
        </div>
      </div>
      {sola && <div className="avviso-adm">Articolo già pubblicato: può modificarlo solo un amministratore.</div>}
      {!sola && admin && a.stato === 'pubblicato' && <div className="avviso-adm">Questo articolo è già online: salvando, le modifiche si vedono subito sul sito.</div>}
      {!sola && admin && a.stato !== 'pubblicato' && <div className="nota" style={{ marginBottom: 10 }}>Quando è a posto premi <b>Pronto per l'uscita</b>: andrà online insieme alla prossima edizione, dalla scheda Prima pagina.</div>}
      <div className={'ed-grid' + (anteprima ? ' mostra-prev' : '')}>
        <fieldset className="fs ed-form" disabled={sola}>
          <div className="pannello"><div className="campi">
            <label className="campo largo"><span>Titolo *</span><input className="input titolo-input" value={a.titolo} onChange={e => set('titolo', e.target.value)} /></label>
            <label className="campo largo"><span>Occhiello (sottotitolo)</span><input className="input" value={a.occhiello} onChange={e => set('occhiello', e.target.value)} /></label>
            <label className="campo largo"><span>Sommario per la prima pagina (se vuoto si usa l'inizio del testo)</span><textarea className="input" style={{ minHeight: 70 }} value={a.sommario} onChange={e => set('sommario', e.target.value)} /></label>
            <label className="campo"><span>Categoria</span><select className="sel" value={a.categoria} onChange={e => set('categoria', e.target.value)}>
              {[...new Set([...categorie, a.categoria].filter(Boolean))].map(c => <option key={c}>{c}</option>)}</select></label>
            <label className="campo"><span>Firma</span><input className="input" value={a.autore} onChange={e => set('autore', e.target.value)} /></label>
            <label className="campo"><span>Data di pubblicazione</span><input className="input" type="datetime-local" value={aLocale(a.data)} onChange={e => set('data', daLocale(e.target.value))} /></label>
            <label className="campo"><span>Uscito sul cartaceo nr. (facoltativo)</span><input className="input" value={a.numero} onChange={e => set('numero', e.target.value)} /></label>
            <label className="campo"><span>Stato</span><select className="sel" value={a.stato} onChange={e => set('stato', e.target.value)}>
              <option value="bozza">Bozza</option><option value="revisione">In revisione</option>{admin && <option value="pronto">Pronto per l'uscita</option>}{(admin || a.stato === 'pubblicato') && <option value="pubblicato">Online subito</option>}</select></label>
          </div></div>
          <div className="pannello"><div className="campi">
            <CampoImmagine valore={a.immagine} onChange={v => set('immagine', v)} avvisa={avvisa} etichetta="Immagine principale" />
            <label className="campo largo"><span>Didascalia</span><input className="input" value={a.didascalia} onChange={e => set('didascalia', e.target.value)} /></label>
          </div></div>
          <div className="pannello">
            <div className="campo"><span>Testo</span>
              <div className="toolbar">
                <button type="button" className="btn btn-s" onClick={() => ins('**', '**', 'grassetto')}><b>G</b></button>
                <button type="button" className="btn btn-s" onClick={() => ins('*', '*', 'corsivo')}><i>C</i></button>
                <button type="button" className="btn btn-s" onClick={() => ins('\n\n## ', '\n\n', 'Intertitolo')}>Intertitolo</button>
                <button type="button" className="btn btn-s" onClick={() => ins('\n\n> ', '\n\n', 'Citazione')}>Citazione</button>
                <button type="button" className="btn btn-s" onClick={() => ins('\n\n- ', '\n\n', 'voce elenco')}>Elenco</button>
                <button type="button" className="btn btn-s" onClick={link}>Link</button>
              </div>
              <textarea ref={ref} className="input ed-testo" value={a.testo} onChange={e => set('testo', e.target.value)} placeholder="Scrivi qui l'articolo. Lascia una riga vuota tra un paragrafo e l'altro." />
              <span className="nota">Riga vuota = nuovo paragrafo · **grassetto** · *corsivo* · ## intertitolo · &gt; citazione · - elenco</span>
            </div>
          </div>
          <div className="pannello"><div className="campi"><CampoGalleria foto={a.galleria} onChange={v => set('galleria', v)} avvisa={avvisa} /></div></div>
        </fieldset>
        <div className="ed-prev" onClickCapture={e => { if (e.target.closest('a')) e.preventDefault(); }}>
          <div className="ed-prev-tit">Anteprima in prima pagina</div>
          <div className="ed-prev-card"><Card a={{ ...voceIndice(a), titolo: a.titolo || 'Titolo dell\'articolo', data: a.data || Date.now() }} /></div>
          <div className="ed-prev-tit">Anteprima dell'articolo</div>
          <div className="pannello ed-prev-art"><VistaArticolo a={{ ...a, sommario: a.sommario || riassunto(a.testo) }} /></div>
        </div>
      </div>
    </div>
  );
}
