<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bordeaux:#8E1B2C;--bordeaux-2:#6F1322;--bordeaux-ch:#F8E6E8;
  --ocra:#F2B45A;--ocra-ch:#FDF0DC;
  --bg:#FBF8F3;--bg-2:#F2ECE3;--card:#FFFFFF;--scuro:#1C1214;
  --ink:#17120F;--ink-2:#4A433D;--muted:#857B71;--line:#E9E1D5;
  --r:18px;--ombra:0 1px 2px rgba(40,20,10,.05),0 8px 24px rgba(40,20,10,.07);
  --font-t:'Bricolage Grotesque',system-ui,sans-serif;--font:'Inter',system-ui,-apple-system,sans-serif;
  /* alias */
  --inchiostro:var(--ink);--grigio:var(--muted);--linea:var(--line);--carta:var(--bg);--carta-2:var(--bg-2);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit}
.boot{font-family:var(--font-t);color:var(--bordeaux);text-align:center;padding:30vh 16px;font-size:34px;font-weight:800;letter-spacing:-.04em}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.centro{text-align:center;margin-top:20px}
.nota{font-size:14px;color:var(--muted)}
.vuoto{text-align:center;color:var(--muted);padding:56px 16px;font-size:17px}

/* ---------- LOGO (dalla testata cartacea) ---------- */
.logo{display:inline-flex;align-items:flex-end;gap:.12em;font-family:Cinzel,Georgia,serif;font-weight:700;color:var(--bordeaux);line-height:.78;font-size:clamp(12.5px,3.7vw,16px);white-space:nowrap}
.logo-la{font-size:2.95em;letter-spacing:-.01em}
.logo-dx{display:flex;flex-direction:column;align-items:flex-end;padding-bottom:.1em}
.logo-pz{font-size:1.78em;padding:0 0 .12em .2em;border-bottom:1.5px solid currentColor}
.logo-di{font-family:var(--font);font-weight:600;font-variant:small-caps;color:var(--ink);font-size:.82em;letter-spacing:.06em;line-height:1.15;margin-top:.22em}
.logo-chiaro{color:#fff}
.logo-chiaro .logo-di{color:var(--ocra)}
.logo-grande{font-size:20px}
@media(max-width:420px){.hd .ico-btn{display:none}}

/* ---------- INTESTAZIONE ---------- */
.hd{position:sticky;top:0;z-index:30;background:rgba(251,248,243,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hd-top{max-width:1180px;margin:0 auto;padding:12px 18px 10px;display:flex;align-items:center;gap:14px}
.marchio{display:flex;align-items:center;gap:10px;min-width:0}
.marchio-ico{width:40px;height:40px;border-radius:12px;background:var(--bordeaux);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.marchio-ico span{font-family:var(--font-t);font-weight:800;color:var(--ocra);font-size:25px;line-height:1;margin-top:-3px}
.marchio-txt{display:flex;flex-direction:column;line-height:1}
.marchio-txt b{font-family:var(--font-t);font-weight:800;font-size:25px;letter-spacing:-.04em;color:var(--bordeaux)}
.marchio-txt small{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.motto-hd{display:none;font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
@media(min-width:860px){.motto-hd{display:block}}
.hd-azioni{margin-left:auto;display:flex;align-items:center;gap:8px}
.ico-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);flex:none}
.ico-btn:hover{border-color:var(--bordeaux);color:var(--bordeaux)}
.accedi{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px 0 13px;border-radius:999px;background:var(--bordeaux);color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 4px 14px rgba(142,27,44,.28);white-space:nowrap}
.accedi:hover{background:var(--bordeaux-2)}
.nav{max-width:1180px;margin:0 auto;padding:0 18px 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.nav a:hover{background:var(--bg-2)}
.nav a.on{background:var(--ink);color:#fff}
main{min-height:55vh;padding:22px 0 56px}

/* ---------- ELEMENTI COMUNI ---------- */
.chip-cat{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px;line-height:1.3}
.chip-cat::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.sez{margin:0 0 46px}
.sez-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sez-hd h2{font-family:var(--font-t);font-weight:800;font-size:clamp(24px,3.4vw,30px);letter-spacing:-.035em;margin:0;line-height:1.1}
.sez-hd .sub{font-size:14px;color:var(--muted);margin-top:4px}
.vedi{font-weight:600;font-size:14.5px;color:var(--bordeaux);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:gap .15s}
.vedi:hover{gap:9px}
.pag-hd{text-align:center;margin:6px auto 26px;max-width:640px}
.pag-hd h1{font-family:var(--font-t);font-weight:800;font-size:clamp(34px,6.5vw,52px);letter-spacing:-.045em;margin:0 0 6px;line-height:1.02}
.pag-hd p{margin:0;color:var(--muted)}
.indietro{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px;color:var(--bordeaux)}

/* apertura */
.hero{position:relative;display:flex;align-items:flex-end;border-radius:26px;overflow:hidden;min-height:460px;color:#fff;margin-bottom:34px;box-shadow:var(--ombra);isolation:isolate;background:linear-gradient(135deg,var(--bordeaux),#2A0B12)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .7s ease}
.hero:hover img{transform:scale(1.03)}
.hero::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,5,8,0) 20%,rgba(15,5,8,.5) 52%,rgba(15,5,8,.9))}
.hero.senza::after{background:radial-gradient(circle at 88% 12%,rgba(242,180,90,.45),transparent 42%)}
.hero-in{position:relative;padding:clamp(22px,4.4vw,44px);max-width:900px;display:flex;flex-direction:column;gap:10px}
.hero h2{font-family:var(--font-t);font-weight:800;font-size:clamp(31px,5.6vw,60px);line-height:1;letter-spacing:-.045em;margin:4px 0 0}
.hero p{margin:0;font-size:clamp(16px,2vw,19px);opacity:.92;max-width:680px;line-height:1.45}
.hero .meta{font-size:13.5px;opacity:.78;margin-top:4px}
@media(max-width:640px){.hero{min-height:440px;border-radius:22px}}

/* card */
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.riga{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin-bottom:46px}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--ombra);transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(40,20,10,.06),0 18px 38px rgba(40,20,10,.11)}
.card-img{aspect-ratio:16/10;object-fit:cover;width:100%;background:var(--bg-2)}
.card-ph{aspect-ratio:16/10;display:grid;place-items:center;font-family:var(--font-t);font-weight:800;font-size:56px;letter-spacing:-.05em;color:rgba(255,255,255,.92)}
.card-c{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-family:var(--font-t);font-weight:700;font-size:21px;line-height:1.14;letter-spacing:-.025em;margin:0}
.card p{margin:0;font-size:15px;color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{margin-top:auto;padding-top:4px;font-size:13px;color:var(--muted)}

/* avviso e invito */
.avviso{display:flex;gap:12px;align-items:center;background:var(--bordeaux-ch);color:var(--bordeaux);border-radius:14px;padding:12px 16px;margin-bottom:24px;font-weight:600}
.avviso::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--bordeaux);flex:none;animation:pulsa 1.8s infinite}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(142,27,44,.5)}70%{box-shadow:0 0 0 9px rgba(142,27,44,0)}100%{box-shadow:0 0 0 0 rgba(142,27,44,0)}}
.invito{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center;justify-content:space-between;background:var(--scuro);color:#fff;border-radius:26px;padding:clamp(24px,4.4vw,40px);margin-bottom:46px;position:relative;overflow:hidden;isolation:isolate}
.invito::before{content:'';position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:var(--bordeaux);z-index:-1}
.invito::after{content:'';position:absolute;right:120px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:var(--ocra);opacity:.9;z-index:-1}
.invito h3{font-family:var(--font-t);font-weight:800;font-size:clamp(24px,3.8vw,34px);letter-spacing:-.04em;margin:0 0 8px;line-height:1.05}
.invito p{margin:0;opacity:.78;max-width:540px}

/* sport */
.sport-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(272px,1fr);gap:14px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.sport-scroll::-webkit-scrollbar{display:none}
.tabellino{scroll-snap-align:start;background:linear-gradient(160deg,#2B0C13,#55152A);color:#fff;border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--ombra);display:flex;flex-direction:column}
.tab-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:14px}
.tab-hd b{font-family:var(--font-t);font-size:18px;letter-spacing:-.025em;display:block;line-height:1.15}
.tab-hd small{font-size:12px;opacity:.65}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.score .sq-n{font-size:13.5px;font-weight:600;line-height:1.2;opacity:.92}
.score .sq-n.noi{opacity:1;font-weight:800}
.score .num{font-family:var(--font-t);font-weight:800;font-size:36px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.esito{flex:none;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:6px;letter-spacing:.07em}
.e-v{background:#2E9E44}.e-p{background:#7C736B}.e-s{background:#D6453D}
.tab-data{font-size:12px;opacity:.65;text-align:center;margin:8px 0 14px}
.prossima{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);font-size:13px;display:flex;justify-content:space-between;gap:10px}
.prossima span:first-child{opacity:.65;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.08em;padding-top:2px}
.prossima span:last-child{text-align:right}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:3px 10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(40,20,10,.06);font-size:14.5px}
.match .c{text-align:right}.match .o{text-align:left}
.match .ris{font-family:var(--font-t);font-weight:800;font-variant-numeric:tabular-nums;background:var(--ink);color:#fff;padding:3px 10px;border-radius:8px;min-width:62px;text-align:center;font-size:16px}
.match .ris.prox{background:var(--bordeaux-ch);color:var(--bordeaux);font-size:13px}
.match-data{font-size:12px;color:var(--muted);grid-column:1/-1;text-align:center}
.noi{font-weight:700}
.sq-pag{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;margin-bottom:46px}
@media(max-width:780px){.sq-pag{grid-template-columns:1fr}}
.sq-pag h3{font-family:var(--font-t);font-weight:700;font-size:18px;letter-spacing:-.02em;margin:0 0 10px}
.tab-card{background:var(--card);border-radius:var(--r);box-shadow:var(--ombra);overflow:hidden}
table.clas{width:100%;border-collapse:collapse;font-size:14.5px}
table.clas th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
table.clas td{padding:9px 12px;border-bottom:1px solid var(--line)}
table.clas tr:last-child td{border-bottom:0}
table.clas .n{text-align:right;font-variant-numeric:tabular-nums}
table.clas .pos{width:34px;color:var(--muted);font-weight:700}
table.clas tr.noi td{background:var(--bordeaux-ch);color:var(--bordeaux);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);color:var(--ink-2);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;background:var(--card);cursor:pointer}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* foto */
.mosaico{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:10px}
.mosaico img{width:100%;height:100%;object-fit:cover;border-radius:14px;cursor:zoom-in;background:var(--bg-2);transition:filter .2s}
.mosaico img:hover{filter:brightness(1.07)}
.mosaico img:first-child{grid-column:span 2;grid-row:span 2}
@media(max-width:640px){.mosaico{grid-template-columns:repeat(3,1fr);grid-auto-rows:104px;gap:8px}}

<script type="text/babel" data-presets="react">
/* =====================================================================

const isoDa = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const oggiISO = () => isoDa(new Date());
function fmtData(ms) { if (!ms) return ''; const d = new Date(ms); return `${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`; }
function dataISO(iso) { const [y, m, d] = String(iso || '').split('-').map(Number); return y ? new Date(y, (m || 1) - 1, d || 1) : null; }
function fmtGiorno(iso) { const d = dataISO(iso); return d ? `${GG[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()].slice(0, 3)}` : ''; }

const daLocale = s => { const t = new Date(s).getTime(); return isNaN(t) ? Date.now() : t; };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
/* Formattazione semplice: riga vuota = nuovo paragrafo, ## intertitolo, > citazione, - elenco, **grassetto**, *corsivo*, [testo](link) */
function md(t) {
  return String(t || '').replace(/\r/g, '').split(/\n\s*\n/).map(b => {
    b = b.trim(); if (!b) return '';
    const righe = b.split('\n');
    if (b.startsWith('## ')) return '<h2>' + inline(b.slice(3)) + '</h2>';
    if (righe.every(l => l.startsWith('>'))) return '<blockquote>' + righe.map(l => inline(l.replace(/^>\s?/, ''))).join('<br>') + '</blockquote>';
    if (righe.every(l => /^[-•]\s/.test(l))) return '<ul>' + righe.map(l => '<li>' + inline(l.replace(/^[-•]\s/, '')) + '</li>').join('') + '</ul>';
    return '<p>' + righe.map(inline).join('<br>') + '</p>';
  }).join('');
}
function testoPiano(t) { return String(t || '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[#>*_]/g, '').replace(/^\s*-\s/gm, '').replace(/\s+/g, ' ').trim(); }
function riassunto(t, n = 220) { const s = testoPiano(t); return s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + '…' : s; }

/* Immagini: ottimizzazione automatica se ospitate su Cloudinary */
function imgUrl(u, w) {
  if (!u) return '';
  if (u.includes('res.cloudinary.com') && u.includes('/upload/') && !u.includes('/upload/f_auto'))
    return u.replace('/upload/', `/upload/f_auto,q_auto,c_limit,w_${w}/`);
  return u;
}
function comprimi(file, max, q) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('Lettura del file non riuscita'));
    r.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('Formato immagine non supportato'));
      im.onload = () => {
        let w = im.width, h = im.height; const s = Math.min(1, max / Math.max(w, h));

    const fd = new FormData();
    fd.append('file', dataUrl);
    fd.append('upload_preset', CLOUDINARY.uploadPreset);
    const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/image/upload`, { method: 'POST', body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error('Caricamento non riuscito: ' + ((j.error && j.error.message) || r.status));

/* ---------- archivio dati (Firestore o demo) ---------- */
const Store = {
  async meta(nome) {
    if (DEMO) return { ...clone(META_DEFAULT[nome]), ...clone(demoLoad().meta[nome] || {}) };
    const s = await FB.db.collection('meta').doc(nome).get();
    return { ...clone(META_DEFAULT[nome]), ...(s.exists ? s.data() : {}) };
  },
  async aggiornaMeta(nome, fn) {
    if (DEMO) {
      const d = demoLoad();
      const nx = clone(fn({ ...clone(META_DEFAULT[nome]), ...clone(d.meta[nome] || {}) }));
      d.meta[nome] = nx; demoSave(); return nx;
    }
    const ref = FB.db.collection('meta').doc(nome);
    return FB.db.runTransaction(async t => {
      const s = await t.get(ref);
      const nx = clone(fn({ ...clone(META_DEFAULT[nome]), ...(s.exists ? s.data() : {}) }));
      t.set(ref, nx); return nx;
    });
  },
  async articolo(id) {
    if (DEMO) { const a = demoLoad().articoli[id]; return a ? clone(a) : null; }
    try { const s = await FB.db.collection('articoli').doc(id).get(); return s.exists ? { id: s.id, ...s.data() } : null; }
    catch (e) { return null; }
  },
  async articoliRedazione(u) {
    if (DEMO) return Object.values(demoLoad().articoli).map(clone);
    const s = await FB.db.collection('articoli').get(); return s.docs.map(d => ({ id: d.id, ...d.data() }));
  },
  nuovoId() { return DEMO ? uid() : FB.db.collection('articoli').doc().id; },
  async salvaArticolo(a, u) {
    a = clone(a); Object.keys(a).forEach(k => { if (k.startsWith('_')) delete a[k]; });
    a.modificato = Date.now();
    if (DEMO) { demoLoad().articoli[a.id] = a; demoSave(); }
    else await FB.db.collection('articoli').doc(a.id).set(a);
    if (u.ruolo === 'admin') {
      await Store.aggiornaMeta('indice', ix => {
        const l = (ix.articoli || []).filter(x => x.id !== a.id);
        if (a.stato === 'pubblicato') l.push(voceIndice(a));
        l.sort((x, y) => y.data - x.data); return { articoli: l };
      });
    }
    return a;
  },
  async bozzaLayout() {
    if (DEMO) { const b = (demoLoad().bozze || {}).layout; return b ? clone(b) : null; }
    const s = await FB.db.collection('bozze').doc('layout').get();
    return s.exists ? s.data().layout : null;
  },
  async salvaBozzaLayout(l) {
    if (DEMO) { const d = demoLoad(); d.bozze = { ...(d.bozze || {}), layout: clone(l) }; demoSave(); return; }
    await FB.db.collection('bozze').doc('layout').set({ layout: clone(l), aggiornato: Date.now() });
  },
  async eliminaBozzaLayout() {
    if (DEMO) { const d = demoLoad(); if (d.bozze) delete d.bozze.layout; demoSave(); return; }
    await FB.db.collection('bozze').doc('layout').delete();
  },
  async pubblicaEdizione(layout, pronti) {
    const ora = Date.now();
    const pubbl = pronti.map(a => {
      const x = clone(a); Object.keys(x).forEach(k => { if (k.startsWith('_')) delete x[k]; });
      return { ...x, stato: 'pubblicato', data: x.data > ora ? x.data : ora, modificato: ora };
    });
    if (pubbl.length) {
      if (DEMO) { const d = demoLoad(); pubbl.forEach(a => { d.articoli[a.id] = a; }); demoSave(); }
      else { const b = FB.db.batch(); pubbl.forEach(a => b.set(FB.db.collection('articoli').doc(a.id), a)); await b.commit(); }
      const ids = new Set(pubbl.map(a => a.id));
      await Store.aggiornaMeta('indice', ix => {
        const l = (ix.articoli || []).filter(x => !ids.has(x.id)).concat(pubbl.map(voceIndice));
        l.sort((x, y) => y.data - x.data); return { articoli: l };
      });
    }
    await Store.aggiornaMeta('layout', () => layout);
    await Store.eliminaBozzaLayout().catch(() => {});
  },
  async eliminaArticolo(a, u) {
    if (DEMO) { delete demoLoad().articoli[a.id]; demoSave(); }
    else await FB.db.collection('articoli').doc(a.id).delete();
    if (u.ruolo === 'admin') await Store.aggiornaMeta('indice', ix => ({ articoli: (ix.articoli || []).filter(x => x.id !== a.id) }));
  },
  async utente(id) {
    if (DEMO) return clone(demoLoad().utenti[id] || { nome: 'Amministratore (demo)', utente: 'admin', ruolo: 'admin' });
    const s = await FB.db.collection('utenti').doc(id).get(); return s.exists ? s.data() : null;
  },
  async utenti() {
    if (DEMO) return Object.entries(demoLoad().utenti).map(([id, u]) => ({ uid: id, ...u }));
    const s = await FB.db.collection('utenti').get(); return s.docs.map(d => ({ uid: d.id, ...d.data() }));
  },
  async sistemaPronto() {
    if (DEMO) return true;
    const s = await FB.db.collection('meta').doc('sistema').get(); return s.exists;
  },
  async creaUtente({ nome, utente, password, ruolo }) {
    const u = pulisciUtente(utente);
    if (DEMO) {
      const d = demoLoad();
      if (Object.values(d.utenti).some(x => x.utente === u)) throw new Error('Questo nome utente esiste già.');
      d.utenti[uid()] = { nome, utente: u, ruolo, creato: Date.now() }; demoSave(); return;
    }
    const aut = appSecondaria();
    const r = await aut.createUserWithEmailAndPassword(emailDa(u), pwFirebase(password));
    const nuovo = r.user.uid;
    await aut.signOut().catch(() => {});
    await FB.db.collection('utenti').doc(nuovo).set({ nome, utente: u, ruolo, creato: Date.now() });
  },
  async aggiornaUtente(id, campi) {
    if (DEMO) { Object.assign(demoLoad().utenti[id], campi); demoSave(); return; }
    await FB.db.collection('utenti').doc(id).update(campi);
  }
};

const DEMO_USER_KEY = 'lapiazza_demo_user';
const Auth = {
  osserva(cb) {
    if (DEMO) { let u = null; try { u = JSON.parse(sessionStorage.getItem(DEMO_USER_KEY) || 'null'); } catch (e) {} cb(u); return () => {}; }
    return FB.auth.onAuthStateChanged(u => cb(u ? { uid: u.uid, email: u.email } : null));
  },
  async accedi(utente, pw) {
    if (DEMO) { const u = { uid: 'demo', email: emailDa(utente || 'admin') }; try { sessionStorage.setItem(DEMO_USER_KEY, JSON.stringify(u)); } catch (e) {} return u; }
    const r = await FB.auth.signInWithEmailAndPassword(emailDa(utente), pwFirebase(pw)); return { uid: r.user.uid, email: r.user.email };
  },
  async primoAdmin(nome, utente, pw, codice) {
    const u = pulisciUtente(utente);
    let r;
    try { r = await FB.auth.createUserWithEmailAndPassword(emailDa(u), pwFirebase(pw)); }
    catch (e) { if (e.code !== 'auth/email-already-in-use') throw e; r = await FB.auth.signInWithEmailAndPassword(emailDa(u), pwFirebase(pw)); }
    const b = FB.db.batch();
    b.set(FB.db.collection('utenti').doc(r.user.uid), { nome, utente: u, ruolo: 'admin', codiceSetup: codice, creato: Date.now() });
    b.set(FB.db.collection('meta').doc('sistema'), { inizializzato: true, creato: Date.now() });
    try { await b.commit(); }
    catch (e) {
      await FB.auth.signOut().catch(() => {});
      if (e.code === 'permission-denied') throw new Error('Codice di attivazione non valido.');
      throw e;
    }
    return { uid: r.user.uid, email: r.user.email };
  },
  async cambiaPassword(attuale, nuova) {
    if (DEMO) return;
    const u = FB.auth.currentUser;
    await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, pwFirebase(attuale)));
    await u.updatePassword(pwFirebase(nuova));
  },
  async esci() {
    if (DEMO) { try { sessionStorage.removeItem(DEMO_USER_KEY); } catch (e) {} return; }
    await FB.auth.signOut();
  }
};

/* ---------- routing con hash ---------- */
function useRotta() {
  const [h, setH] = useState(location.hash || '#/');
  useEffect(() => {
    const f = () => { setH(location.hash || '#/'); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f);
  }, []);
  return h.replace(/^#\/?/, '').split('/').map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
}

/* ---------- aggiungi alla schermata Home ---------- */
let promptInstallazione = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstallazione = e; window.dispatchEvent(new Event('lp-installa')); });
function InstallaApp() {
  const [, aggiorna] = useState(0);
  const [aiuto, setAiuto] = useState(false);
  useEffect(() => { const f = () => aggiorna(x => x + 1); window.addEventListener('lp-installa', f); return () => window.removeEventListener('lp-installa', f); }, []);
  let giaApp = false;
  try { giaApp = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) {}
  if (giaApp) return null;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const clic = async () => {
    if (promptInstallazione) {
      promptInstallazione.prompt();
      try { await promptInstallazione.userChoice; } catch (e) {}
      promptInstallazione = null; aggiorna(x => x + 1);
    } else setAiuto(!aiuto);
  };
  return (
    <div className="installa">
      <button className="btn-installa" onClick={clic}><img src={(document.querySelector('link[rel="apple-touch-icon"]') || {}).href} alt="" />Aggiungi La Piazza alla schermata Home</button>
      {aiuto && <p>{ios ? 'Su iPhone: tocca il tasto Condividi (il quadrato con la freccia verso l\'alto) e poi “Aggiungi alla schermata Home”.'
        : 'Apri il menu del browser (⋮ in alto a destra) e scegli “Aggiungi a schermata Home” o “Installa app”.'}</p>}
    </div>
  );
}

        {(a.occhiello || a.sommario) && <p>{a.occhiello || riassunto(a.sommario, 180)}</p>}

}

function Partita({ p, noi }) {
  const g = giocata(p);
  return (
    <div className="match">
      <div className="match-data">{fmtGiorno(p.data)}{p.ora ? ' · ' + p.ora : ''}{p.competizione ? ' · ' + p.competizione : ''}</div>
      <span className={'c' + (p.casa === noi ? ' noi' : '')}>{p.casa}</span>
      <span className={'ris' + (g ? '' : ' prox')}>{g ? `${p.gc} – ${p.go}` : 'vs'}</span>
      <span className={'o' + (p.ospite === noi ? ' noi' : '')}>{p.ospite}</span>
    </div>
  );
}

function esito(p, noi) {
  if (!giocata(p)) return null;
  const inCasa = p.casa === noi, fuori = p.ospite === noi;
  if (!inCasa && !fuori) return null;
  const mio = inCasa ? +p.gc : +p.go, loro = inCasa ? +p.go : +p.gc;
  return mio > loro ? 'V' : mio < loro ? 'S' : 'P';
}

function Tabellino({ s, partite }) {
  const oggi = oggiISO();
  const p = partite.filter(x => x.squadraId === s.id);
  const ult = p.filter(giocata).sort(perDataDesc)[0];
  const pro = p.filter(x => !giocata(x) && x.data >= oggi).sort(perDataAsc)[0];
  const e = ult && esito(ult, s.nome);
  return (
    <a className="tabellino" href="#/sport">
      <div className="tab-hd">
        <div><b>{s.nome}</b><small>{[s.sport, s.campionato].filter(Boolean).join(' · ')}</small></div>
        {e && <span className={'esito e-' + e.toLowerCase()}>{{ V: 'VITTORIA', P: 'PAREGGIO', S: 'SCONFITTA' }[e]}</span>}

      {ult ? <>
        <div className="score">
          <span className={'sq-n' + (ult.casa === s.nome ? ' noi' : '')}>{ult.casa}</span>
          <span className="num">{ult.gc}–{ult.go}</span>

  );
}

/* ---------- barra notizie scorrevole ---------- */
const TICKER_DEFAULT = { attivo: true, testo: '', link: '', risultati: true, prossime: true, articoli: true, nArticoli: 4 };
function vociTicker(dati, pubblicati) {
  const T = { ...TICKER_DEFAULT, ...((dati.layout || {}).ticker || {}) };
  if (!T.attivo) return [];
  const voci = [];
  if (T.testo && T.testo.trim()) voci.push({ k: 'u', tag: 'Ultim\'ora', cls: 'tk-ult', testo: T.testo.trim(), link: T.link || '' });
  const sq = (dati.sport || {}).squadre || [], pt = (dati.sport || {}).partite || [];
  const oggi = oggiISO();
  if (T.risultati) sq.forEach(s => {
    const u = pt.filter(p => p.squadraId === s.id && giocata(p)).sort(perDataDesc)[0];
    if (u) voci.push({ k: 'r' + s.id, tag: s.sport || 'Sport', testo: `${u.casa} ${u.gc}–${u.go} ${u.ospite}`, link: '#/sport', esito: esito(u, s.nome) });
  });
  if (T.prossime) sq.forEach(s => {
    const n = pt.filter(p => p.squadraId === s.id && !giocata(p) && p.data >= oggi).sort(perDataAsc)[0];
    if (n) voci.push({ k: 'p' + s.id, tag: 'Prossima', testo: `${n.casa} – ${n.ospite} · ${fmtGiorno(n.data)}${n.ora ? ' ' + n.ora : ''}`, link: '#/sport' });
  });
  if (T.articoli) pubblicati.slice(0, +T.nArticoli || 4).forEach(a => voci.push({ k: 'a' + a.id, tag: a.categoria || 'Articolo', testo: a.titolo, link: '#/articolo/' + a.id, col: coloreCat(a.categoria) }));
  return voci;
}
const MOTO_RIDOTTO = (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
function Ticker({ dati, pubblicati }) {
  const voci = vociTicker(dati, pubblicati);
  if (!voci.length) return null;
  const durata = Math.max(22, Math.round(voci.reduce((s, v) => s + v.testo.length + v.tag.length + 8, 0) * 0.22));
  const lista = copia => voci.map(v => {
    const dentro = <>
      <span className="tk-tag" style={v.col ? { color: `color-mix(in srgb, ${v.col} 45%, #F2B45A)` } : undefined}>{v.tag}</span>
      {v.esito && <span className={'tk-esito e-' + v.esito.toLowerCase()}>{v.esito}</span>}
      <span className="tk-txt">{v.testo}</span>
    </>;
    const prop = { key: v.k + copia, className: 'tk-voce' + (v.cls ? ' ' + v.cls : ''), 'aria-hidden': copia ? 'true' : undefined, tabIndex: copia ? -1 : undefined };
    return v.link ? <a href={v.link} {...prop}>{dentro}</a> : <span {...prop}>{dentro}</span>;
  });
  return (
    <div className="ticker" role="region" aria-label="Ultime notizie e risultati">
      <span className="tk-lab">Le ultime</span>
      <div className="tk-vis">
        <div className={'tk-nastro' + (MOTO_RIDOTTO ? ' fermo' : '')} style={{ animationDuration: durata + 's' }}>{lista('')}{!MOTO_RIDOTTO && lista('-2')}</div>
      </div>
    </div>
  );
}

function Home({ dati, pubblicati, editor }) {
  const blocchi = dati.layout.blocchi || [];
  const perId = Object.fromEntries(pubblicati.map(a => [a.id, a]));
  const usati = new Set();
  blocchi.forEach(b => {
    if (b.tipo === 'apertura' && perId[b.articolo]) usati.add(b.articolo);
    if (b.tipo === 'riga') (b.articoli || []).forEach(id => { if (perId[id]) usati.add(id); });
  });
  const prendi = (n, cat) => {
    const out = [];
    for (const a of pubblicati) {
      if (out.length >= n) break;
      if (usati.has(a.id) || (cat && a.categoria !== cat)) continue;
      out.push(a); usati.add(a.id);
    }
    return out;
  };
  const periodicita = (dati.layout.testata || {}).periodicita;
  const el = blocchi.map((b, i) => {
    const x = (() => { switch (b.tipo) {
      case 'apertura': { const a = perId[b.articolo] || prendi(1)[0]; return a ? <BloccoApertura key={b.id} a={a} /> : null; }
      case 'riga': { const l = (b.articoli || []).map(id => perId[id]).filter(Boolean); return l.length ? <div key={b.id} className="riga">{l.map(a => <Card key={a.id} a={a} />)}</div> : null; }
      case 'ultimi': {
        const l = prendi(+b.n || 6, b.categoria);
        return l.length ? (
          <section key={b.id} className="sez">
            <SezHd t={b.titolo || 'Ultimi articoli'} link={b.categoria ? '#/categoria/' + encodeURIComponent(b.categoria) : '#/archivio'} />
            <div className="griglia">{l.map(a => <Card key={a.id} a={a} />)}</div>
          </section>) : null;
      }
      case 'sport': return (dati.sport.squadre || []).length ? <BloccoSport key={b.id} sport={dati.sport} /> : null;
      case 'galleria': return (dati.gallerie.album || []).some(a => (a.foto || []).length) ? <BloccoGalleria key={b.id} gallerie={dati.gallerie} albumId={b.album} /> : null;
      case 'numero': return (dati.numeri.numeri || []).length ? <BloccoNumero key={b.id} numeri={dati.numeri} periodicita={periodicita} /> : null;
      case 'invito': return <BloccoInvito key={b.id} />;
      case 'avviso': return b.testo ? (b.link ? <a key={b.id} className="avviso" href={b.link}>{b.testo}</a> : <div key={b.id} className="avviso">{b.testo}</div>) : null;
      default: return null;
    } })();
    return editor ? editor.wrap(b, i, x) : x;
  }).filter(Boolean);
  if (editor && !blocchi.length) return editor.vuoto();
  if (!el.length) return (
    <div className="home-vuota">
      <Marchio grande />
      <h2>La prima edizione online è in arrivo</h2>
      <p>Stiamo preparando gli articoli. Intanto puoi aggiungere La Piazza alla schermata Home del telefono: la ritroverai come un'app.</p>
      <a className="btn btn-p" href="#/numeri">Sfoglia il cartaceo</a>
    </div>
  );
  return <>{el}</>;
}

function Lightbox({ foto, i, chiudi }) {
  const [k, setK] = useState(i);
  const n = foto.length;
  const t0 = useRef(null);
  const chiudiRef = useRef(chiudi); chiudiRef.current = chiudi;
  useEffect(() => {
    const f = e => {
      if (e.key === 'Escape') chiudiRef.current();
      if (e.key === 'ArrowRight') setK(x => (x + 1) % n);
      if (e.key === 'ArrowLeft') setK(x => (x - 1 + n) % n);
    };
    document.addEventListener('keydown', f); document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', f); document.body.style.overflow = ''; };
  }, [n]);
  const f = foto[k] || foto[0];
  return (
    <div className="lb" onClick={chiudi}
      onTouchStart={e => { t0.current = e.touches[0].clientX; }}
      onTouchEnd={e => { if (t0.current == null) return; const dx = e.changedTouches[0].clientX - t0.current; if (Math.abs(dx) > 50) setK(x => (x + (dx < 0 ? 1 : -1) + n) % n); t0.current = null; }}>
      <img src={imgUrl(f.url, 1600)} alt={f.didascalia || ''} onClick={e => e.stopPropagation()} />
      <div className="did">{f.didascalia} {n > 1 && <span style={{ opacity: .6 }}>· {k + 1}/{n}</span>}</div>
      <button className="x" onClick={chiudi} aria-label="Chiudi">✕</button>
      {n > 1 && <>
        <button className="pr" aria-label="Precedente" onClick={e => { e.stopPropagation(); setK((k - 1 + n) % n); }}>‹</button>
        <button className="nx" aria-label="Successiva" onClick={e => { e.stopPropagation(); setK((k + 1) % n); }}>›</button>
      </>}
    </div>
  );
}

function VistaArticolo({ a }) {
  const [lb, setLb] = useState(null);
  const [copiato, setCopiato] = useState(false);
  const condividi = async () => {
    const url = location.href;
    try {
      if (navigator.share) { await navigator.share({ title: a.titolo, url }); return; }
      await navigator.clipboard.writeText(url); setCopiato(true); setTimeout(() => setCopiato(false), 2000);
    } catch (e) {}
  };
  const gal = a.galleria || [];
  return (
    <article className="art">
      <ChipCat c={a.categoria} />
      <h1>{a.titolo || 'Senza titolo'}</h1>
      {a.occhiello && <p className="occhiello">{a.occhiello}</p>}
      <div className="autore">
        <span className="avatar">{iniziali(a.autore)}</span>
        <div>
          <div className="nome">{a.autore || 'Redazione'}</div>
          <div className="meta">{fmtData(a.data)} · {minutiLettura(a.testo)} min di lettura{a.numero ? ` · dal nr. ${a.numero}` : ''}</div>
        </div>
        <button className="btn btn-s" onClick={condividi}>{copiato ? 'Link copiato' : 'Condividi'}</button>

      {gal.length > 0 && <div style={{ marginTop: 34 }}>
        <SezHd t="Fotografie" sub={gal.length + ' foto'} />
        <div className="strip">{gal.map((x, i) => <img key={i} src={imgUrl(x.url, 400)} alt={x.didascalia || ''} loading="lazy" onClick={() => setLb(i)} />)}</div>
      </div>}

function PaginaArticolo({ id, pubblicati }) {
  const [a, setA] = useState(undefined);
  const barra = useRef(null);
  useEffect(() => { let ok = true; setA(undefined); Store.articolo(id).then(x => { if (ok) setA(x); }); return () => { ok = false; }; }, [id]);
  useEffect(() => {
    if (a) document.title = a.titolo + ' — La Piazza di Fabbrico';
    return () => { document.title = 'La Piazza di Fabbrico'; };
  }, [a]);
  useEffect(() => {
    const f = () => {
      if (!barra.current) return;
      const h = document.documentElement.scrollHeight - window.innerHeight;
      barra.current.style.width = (h > 0 ? Math.min(100, window.scrollY / h * 100) : 0) + '%';
    };
    window.addEventListener('scroll', f, { passive: true }); f();
    return () => window.removeEventListener('scroll', f);
  }, [a]);
  if (a === undefined) return <div className="vuoto">Caricamento…</div>;
  if (!a) return <div className="vuoto">Articolo non trovato.<div className="centro"><a className="btn" href="#/archivio">Vai agli articoli</a></div></div>;
  const altri = pubblicati.filter(x => x.id !== a.id);
  const correlati = [...altri.filter(x => x.categoria === a.categoria), ...altri.filter(x => x.categoria !== a.categoria)].slice(0, 3);
  const nonPubbl = a.stato !== 'pubblicato' || a.data > Date.now();
  return <>
    <div className="progresso" ref={barra} />
    {nonPubbl && <div className="anteprima-tag">Anteprima: questo articolo non è ancora visibile ai lettori.</div>}
    <VistaArticolo a={a} />
    {correlati.length > 0 && <section className="sez" style={{ marginTop: 56 }}>
      <SezHd t="Leggi anche" link="#/archivio" label="Tutti gli articoli" />
      <div className="griglia">{correlati.map(x => <Card key={x.id} a={x} />)}</div>
    </section>}
  </>;
}

function Archivio({ pubblicati, categorie, cat0 }) {
  const [q, setQ] = useState('');
  const [cat, setCat] = useState(cat0 || '');
  const [anno, setAnno] = useState('');
  const [n, setN] = useState(30);
  useEffect(() => { setCat(cat0 || ''); setN(30); }, [cat0]);
  const anni = [...new Set(pubblicati.map(a => new Date(a.data).getFullYear()))].sort((a, b) => b - a);
  const qq = norm(q.trim());
  const lista = pubblicati.filter(a =>
    (!cat || a.categoria === cat) && (!anno || new Date(a.data).getFullYear() === +anno) &&
    (!qq || norm([a.titolo, a.occhiello, a.sommario, a.autore].join(' ')).includes(qq)));
  let meseCorr = '';
  return (
    <div style={{ maxWidth: 860, margin: '0 auto' }}>
      <div className="pag-hd"><h1>{cat || 'Articoli'}</h1><p>{lista.length} articol{lista.length === 1 ? 'o' : 'i'}{cat ? '' : ', dal più recente'}</p></div>
      <div className="filtri">
        <label className="cerca"><IcoCerca /><input className="input" placeholder="Cerca un articolo, un autore…" value={q} onChange={e => { setQ(e.target.value); setN(30); }} /></label>
        <select className="sel" value={anno} onChange={e => { setAnno(e.target.value); setN(30); }}>
          <option value="">Tutti gli anni</option>{anni.map(y => <option key={y} value={y}>{y}</option>)}
        </select>
      </div>
      <div className="chips">
        <button className={'chip' + (!cat ? ' on' : '')} onClick={() => setCat('')}>Tutte</button>
        {categorie.map(c => <button key={c} className={'chip' + (cat === c ? ' on' : '')} onClick={() => { setCat(c); setN(30); }}>{c}</button>)}
      </div>
      {!lista.length && <div className="vuoto">Nessun articolo trovato.</div>}
      {lista.slice(0, n).map(a => {
        const d = new Date(a.data); const m = MESI[d.getMonth()] + ' ' + d.getFullYear();
        const titoloMese = m !== meseCorr; meseCorr = m;
        return (
          <React.Fragment key={a.id}>
            {titoloMese && <div className="mese">{cap(m)}</div>}
            <a className={'voce' + (a.immagine ? '' : ' senza')} href={'#/articolo/' + a.id}>

                <ChipCat c={a.categoria} />
                <h3>{a.titolo}</h3>
                <p>{a.occhiello || riassunto(a.sommario, 150)}</p>
                <div className="nota" style={{ fontSize: 13 }}>{metaArticolo(a)}</div>
              </div>
            </a>
          </React.Fragment>
        );
      })}
      {lista.length > n && <div className="centro"><button className="btn" onClick={() => setN(n + 30)}>Mostra altri</button></div>}
    </div>
  );
}

function righeClassifica(t) {
  return String(t || '').split('\n').map(l => l.split(/[;\t]/).map(x => x.trim())).filter(r => r[0]);
}

                <h3>Risultati</h3>

                  </table></div>) : <div className="nota">Classifica non disponibile.</div>}

function Badge({ a }) {
  const s = a.stato === 'pubblicato' && a.data > Date.now() ? 'programmato' : a.stato;
  const l = { bozza: 'Bozza', revisione: 'In revisione', pronto: 'Pronto per l\'uscita', pubblicato: 'Online', programmato: 'Programmato' }[s] || s;
  return <span className={'badge b-' + s}>{l}</span>;
}

function Accesso({ onEntrato }) {
  const [pronto, setPronto] = useState(undefined);
  const [nome, setNome] = useState(''); const [utente, setUtente] = useState(''); const [pw, setPw] = useState(''); const [pw2, setPw2] = useState('');
  const [codice, setCodice] = useState('');
  const [err, setErr] = useState(''); const [occ, setOcc] = useState(false);
  useEffect(() => {
    Store.sistemaPronto().then(p => { setPronto(p); if (!p) setUtente('admin'); }).catch(() => setPronto(true));
  }, []);
  const primo = pronto === false;
  const invia = async e => {
    e.preventDefault(); setErr(''); setOcc(true);
    try {
      if (primo) {
        if (!codice.trim()) throw new Error('Inserisci il codice di attivazione.');
        if (!nome.trim()) throw new Error('Inserisci nome e cognome.');
        if (!UTENTE_VALIDO.test(pulisciUtente(utente))) throw new Error('Nome utente non valido: usa lettere, numeri, punto o trattino.');
        if (pw.length < PW_MIN) throw new Error(`La password deve avere almeno ${PW_MIN} caratteri.`);
        if (pw !== pw2) throw new Error('Le due password non coincidono.');
        onEntrato(await Auth.primoAdmin(nome.trim(), utente, pw, codice.trim().toUpperCase()));
      } else {
        if (!DEMO && (!utente.trim() || !pw)) throw new Error('Inserisci nome utente e password.');
        onEntrato(await Auth.accedi(utente, pw));
      }
    } catch (ex) { setErr(msgErrore(ex)); }
    setOcc(false);
  };
  if (pronto === undefined) return <div className="vuoto">Caricamento…</div>;
  return (
    <form className="login" onSubmit={invia}>
      <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 4 }}><Marchio grande /></div>
      <h2>{primo ? 'Primo avvio' : 'Accesso redazione'}</h2>
      {primo && <div className="avviso-adm" style={{ margin: 0 }}>Configurazione iniziale riservata all'amministratore del sito: serve il codice di attivazione.</div>}
      {primo && <label className="campo"><span>Codice di attivazione</span><input className="input" autoCapitalize="characters" autoCorrect="off" spellCheck="false" autoComplete="off" value={codice} onChange={e => setCodice(e.target.value)} /></label>}
      {DEMO && <div className="avviso-adm" style={{ margin: 0 }}>Modalità demo: premi Entra, anche senza password.</div>}
      {primo && <label className="campo"><span>Nome e cognome</span><input className="input" value={nome} onChange={e => setNome(e.target.value)} /></label>}
      <label className="campo"><span>Nome utente</span><input className="input" autoCapitalize="none" autoCorrect="off" spellCheck="false" autoComplete="username" value={utente} onChange={e => setUtente(e.target.value)} /></label>
      <label className="campo"><span>Password</span><input className="input" type="password" autoComplete={primo ? 'new-password' : 'current-password'} value={pw} onChange={e => setPw(e.target.value)} /></label>
      {primo && <label className="campo"><span>Ripeti password</span><input className="input" type="password" autoComplete="new-password" value={pw2} onChange={e => setPw2(e.target.value)} /></label>}
      {err && <div className="err-txt">{err}</div>}
      <button className="btn btn-p" disabled={occ}>{occ ? 'Attendere…' : primo ? 'Crea amministratore ed entra' : 'Entra'}</button>
      {!primo && <div className="nota" style={{ textAlign: 'center' }}>Gli accessi alla redazione li crea l'amministratore.</div>}
    </form>
  );
}

function CambiaPassword({ chiudi, avvisa }) {
  const [a, setA] = useState(''); const [n, setN] = useState(''); const [n2, setN2] = useState('');
  const [err, setErr] = useState(''); const [occ, setOcc] = useState(false);
  const invia = async e => {
    e.preventDefault(); setErr('');
    if (n.length < PW_MIN) { setErr(`La nuova password deve avere almeno ${PW_MIN} caratteri.`); return; }
    if (n !== n2) { setErr('Le due password non coincidono.'); return; }
    setOcc(true);
    try { await Auth.cambiaPassword(a, n); avvisa('Password cambiata'); chiudi(); }
    catch (ex) { setErr(msgErrore(ex)); setOcc(false); }
  };
  return (
    <form className="login" onSubmit={invia} style={{ marginTop: 24 }}>
      <h2>Cambia password</h2>
      <label className="campo"><span>Password attuale</span><input className="input" type="password" autoComplete="current-password" value={a} onChange={e => setA(e.target.value)} /></label>
      <label className="campo"><span>Nuova password</span><input className="input" type="password" autoComplete="new-password" value={n} onChange={e => setN(e.target.value)} /></label>
      <label className="campo"><span>Ripeti nuova password</span><input className="input" type="password" autoComplete="new-password" value={n2} onChange={e => setN2(e.target.value)} /></label>
      {err && <div className="err-txt">{err}</div>}
      <div className="azioni" style={{ justifyContent: 'center' }}>
        <button className="btn btn-p" disabled={occ}>{occ ? 'Attendere…' : 'Salva'}</button>
        <button type="button" className="btn" onClick={chiudi}>Annulla</button>
      </div>
    </form>
  );
}

function Redazione({ dati, ricarica }) {
  const [authU, setAuthU] = useState(undefined);
  const [utente, setUtente] = useState(null);
  const [tab, setTab] = useState('home');
  const [toast, setToast] = useState(null);
  const [cambioPw, setCambioPw] = useState(false);
  const timer = useRef(null);
  const avvisa = useCallback((msg, err) => {
    setToast({ msg, err }); clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(null), err ? 5000 : 2800);
  }, []);
  useEffect(() => Auth.osserva(u => setAuthU(u)), []);
  useEffect(() => { document.title = 'Redazione — La Piazza'; return () => { document.title = 'La Piazza di Fabbrico'; }; }, []);
  useEffect(() => {
    let ok = true;
    if (!authU) { setUtente(null); return; }
    setUtente('carico');
    const base = { ruolo: 'sconosciuto', uid: authU.uid, email: authU.email };
    Store.utente(authU.uid).then(p => { if (ok) setUtente({ ...base, ...(p || {}), uid: authU.uid }); })
      .catch(() => { if (ok) setUtente(base); });
    return () => { ok = false; };
  }, [authU]);
  const esci = async () => { await Auth.esci(); setAuthU(null); setCambioPw(false); };

  let corpo;
  if (authU === undefined || (authU && (!utente || utente === 'carico'))) corpo = <div className="vuoto">Caricamento…</div>;
  else if (!authU) corpo = <Accesso onEntrato={u => setAuthU({ ...u })} />;
  else if (!['admin', 'redattore'].includes(utente.ruolo)) corpo = (
    <div className="login">
      <h2>Account non attivo</h2>
      <p style={{ margin: 0 }}>{utente.ruolo === 'disattivato' ? 'Il tuo account è stato disattivato. Contatta l\'amministratore.' : 'Profilo non trovato: contatta l\'amministratore.'}</p>
      <div className="azioni"><button className="btn" onClick={() => setAuthU({ ...authU })}>Riprova</button><button className="btn" onClick={esci}>Esci</button></div>
    </div>);
  else if (!dati) corpo = <div className="vuoto">Caricamento…</div>;
  else if (cambioPw) corpo = <CambiaPassword chiudi={() => setCambioPw(false)} avvisa={avvisa} />;
  else {
    const admin = utente.ruolo === 'admin';
    const tabs = [['home', 'Prima pagina'], ['articoli', 'Articoli'], ['sport', 'Sport'], ['foto', 'Foto'], ...(admin ? [['numeri', 'Numeri'], ['utenti', 'Utenti']] : [])];
    const p = { utente, dati, ricarica, avvisa };
    corpo = <>
      <div className="adm-tabs"><div className="in">{tabs.map(([k, l]) => <button key={k} className={tab === k ? 'on' : ''} onClick={() => setTab(k)}>{l}</button>)}</div></div>
      <div className={'adm' + (tab === 'home' ? ' largo' : '')}>
        {tab === 'articoli' && <GestioneArticoli {...p} />}
        {tab === 'home' && <GestionePrimaPagina key={'pp-' + utente.uid} {...p} />}
        {tab === 'sport' && <GestioneSport {...p} />}
        {tab === 'foto' && <GestioneFoto {...p} />}
        {tab === 'numeri' && admin && <GestioneNumeri {...p} />}
        {tab === 'utenti' && admin && <GestioneUtenti {...p} />}
      </div>
    </>;
  }
  return (
    <div>
      {DEMO && <div className="demo">Modalità demo: i dati restano solo in questo browser. Inserisci la configurazione Firebase per andare online.</div>}
      <div className="adm-top"><div className="in">
        <a href="#/" className="adm-logo"><Marchio chiaro /><span className="adm-tag">Redazione</span></a>
        <div className="azioni">
          {utente && utente !== 'carico' && <span className="adm-utente" style={{ fontSize: 14, opacity: .9 }}>{utente.nome || utente.utente}{utente.ruolo === 'admin' ? ' · amministratore' : ''}</span>}
          {authU && utente && utente !== 'carico' && ['admin', 'redattore'].includes(utente.ruolo) && <button className="btn btn-s" onClick={() => setCambioPw(true)}><span className="solo-pc">Cambia password</span><span className="solo-tel">Password</span></button>}
          <a className="btn btn-s" href="#/"><span className="solo-pc">Vai al sito</span><span className="solo-tel">Sito</span></a>
          {authU && <button className="btn btn-s" onClick={esci}>Esci</button>}
        </div>
      </div></div>
      {corpo}
      {toast && <div className={'toast' + (toast.err ? ' err' : '')}>{toast.msg}</div>}
    </div>
  );
}

/* ---------- articoli ---------- */
function GestioneArticoli({ utente, dati, ricarica, avvisa }) {
  const [lista, setLista] = useState(null);
  const [ed, setEd] = useState(null);
  const [filtro, setFiltro] = useState('');
  const [q, setQ] = useState('');
  const admin = utente.ruolo === 'admin';
  const categorie = dati.layout.categorie && dati.layout.categorie.length ? dati.layout.categorie : CATEGORIE_DEFAULT;
  const carica = useCallback(async () => {
    try { const l = await Store.articoliRedazione(utente); l.sort((a, b) => (b.modificato || 0) - (a.modificato || 0)); setLista(l); }
    catch (e) { avvisa(msgErrore(e), true); setLista([]); }
  }, [utente, avvisa]);
  useEffect(() => { carica(); }, [carica]);

  if (ed) return <Editor iniziale={ed} utente={utente} categorie={categorie} avvisa={avvisa}
    chiudi={async salvato => { setEd(null); if (salvato) { await carica(); ricarica(); } }} />;

  const nuovo = () => setEd({
    id: Store.nuovoId(), titolo: '', occhiello: '', sommario: '', testo: '', categoria: categorie[0], autore: utente.nome || '',
    autoreUid: utente.uid, immagine: '', didascalia: '', galleria: [], numero: '', stato: 'bozza', data: Date.now(), creato: Date.now()
  });
  const approva = async a => {
    try { await Store.salvaArticolo({ ...a, stato: 'pronto' }, utente); avvisa('Pronto per l\'uscita: andrà online con la prossima edizione'); carica(); }
    catch (e) { avvisa(msgErrore(e), true); }
  };
  const inApertura = async a => {
    try {
      const l = (await Store.bozzaLayout()) || clone(dati.layout);
      const blocchi = [...(l.blocchi || [])];
      const i = blocchi.findIndex(b => b.tipo === 'apertura');
      if (i >= 0) blocchi[i] = { ...blocchi[i], articolo: a.id };
      else blocchi.unshift({ id: uid(), tipo: 'apertura', articolo: a.id });
      await Store.salvaBozzaLayout({ ...l, blocchi });
      avvisa('Messo in apertura nella prima pagina in preparazione');
    } catch (e) { avvisa(msgErrore(e), true); }
  };
  const elimina = async a => {
    if (!confirm(`Eliminare definitivamente "${a.titolo || 'senza titolo'}"?`)) return;
    try { await Store.eliminaArticolo(a, utente); avvisa('Articolo eliminato'); carica(); ricarica(); }
    catch (e) { avvisa(msgErrore(e), true); }
  };
  const qq = norm(q.trim());
  const vis = (lista || []).filter(a => (!filtro || (filtro === 'miei' ? a.autoreUid === utente.uid : a.stato === filtro)) && (!qq || norm((a.titolo || '') + ' ' + (a.autore || '')).includes(qq)));
  const inRev = (lista || []).filter(a => a.stato === 'revisione').length;
  return <>
    <div className="testa-adm"><h2 className="h-adm">Articoli</h2><button className="btn btn-p" onClick={nuovo}>+ Nuovo articolo</button></div>
    {admin && inRev > 0 && <div className="avviso-adm"><b>{inRev}</b> articol{inRev === 1 ? 'o' : 'i'} in attesa di revisione. <button className="link-txt" onClick={() => setFiltro('revisione')}>Mostra</button></div>}
    <div className="filtri">
      <input className="input" placeholder="Cerca per titolo o autore" value={q} onChange={e => setQ(e.target.value)} style={{ flex: 1, minWidth: 180 }} />
      <select className="sel" value={filtro} onChange={e => setFiltro(e.target.value)}>
        <option value="">Tutti gli stati</option><option value="miei">Solo i miei</option><option value="bozza">Bozze</option><option value="revisione">In revisione</option><option value="pronto">Pronti per l'uscita</option><option value="pubblicato">Online</option>
      </select>
    </div>
    <div className="pannello" style={{ padding: '0 16px' }}>
      {lista === null ? <div className="vuoto">Caricamento…</div> : !vis.length ? <div className="vuoto">Nessun articolo.</div> :
        vis.map(a => {
          const puo = admin || (a.autoreUid === utente.uid && a.stato !== 'pubblicato');
          return (
            <div className="riga-adm" key={a.id}>
              {a.immagine ? <img src={imgUrl(a.immagine, 200)} alt="" /> : <div className="ph" />}
              <div className="t"><b>{a.titolo || '(senza titolo)'}</b>
                <span className="nota"><Badge a={a} /> {[a.categoria, a.autore, fmtData(a.data)].filter(Boolean).join(' · ')}</span></div>
              <div className="azioni">
                {admin && ['bozza', 'revisione'].includes(a.stato) && <button className="btn btn-s btn-p" onClick={() => approva(a)}>Approva</button>}
                {admin && (a.stato === 'pronto' || (a.stato === 'pubblicato' && a.data <= Date.now())) && <button className="btn btn-s" onClick={() => inApertura(a)}>Metti in apertura</button>}
                <a className="btn btn-s" href={'#/articolo/' + a.id} target="_blank" rel="noopener">Vedi</a>
                <button className="btn btn-s" onClick={() => setEd(clone(a))}>{puo ? 'Modifica' : 'Apri'}</button>
                {admin && <button className="btn btn-s btn-d" onClick={() => elimina(a)}>Elimina</button>}
              </div>
            </div>);
        })}
    </div>
  </>;
}

function CampoImmagine({ valore, onChange, avvisa, etichetta = 'Immagine' }) {
