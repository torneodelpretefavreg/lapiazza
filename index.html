  numero: 'Copertina e PDF dell\'ultimo numero cartaceo. Si aggiorna dalla sezione Numeri.',
  invito: 'Riquadro che invita i lettori a contattare la redazione.',
  avviso: 'Una riga in evidenza, ad esempio per un evento o una comunicazione urgente.'
};
const VUOTO_BLOCCO = {
  apertura: 'Apertura: comparirà qui l\'articolo principale',
  riga: 'Riga vuota: scegli gli articoli da affiancare',
  ultimi: 'Nessun altro articolo da mostrare qui',
  sport: 'Nessuna squadra inserita (sezione Sport)',
  galleria: 'Nessun album con foto (sezione Foto)',
  numero: 'Nessun numero cartaceo caricato (sezione Numeri)',
  invito: '',
  avviso: 'Avviso vuoto: scrivi il testo'
};
function nuovoBlocco(tipo) {
  const b = { id: uid(), tipo };
  if (tipo === 'apertura') b.articolo = '';
  if (tipo === 'riga') b.articoli = ['', ''];
  if (tipo === 'ultimi') Object.assign(b, { titolo: 'Ultimi articoli', n: 6, categoria: '' });
  if (tipo === 'galleria') b.album = '';
  if (tipo === 'avviso') Object.assign(b, { testo: '', link: '' });
  return b;
}

function SelArticolo({ v, on, vuoto, pubbl }) {
  return (
    <select className="sel" value={v || ''} onChange={e => on(e.target.value)} style={{ width: '100%' }}>
      <option value="">{vuoto}</option>
      {v && !pubbl.find(a => a.id === v) && <option value={v}>(articolo non più pubblicato)</option>}
      {pubbl.map(a => <option key={a.id} value={a.id}>{a.daPubblicare ? '[da pubblicare] ' : fmtData(a.data) + ' — '}{a.titolo.slice(0, 70)}</option>)}
    </select>
  );
}

function CampiBlocco({ b, set, pubbl, album, cats }) {
  if (b.tipo === 'apertura') return <SelArticolo v={b.articolo} on={v => set({ articolo: v })} vuoto="Automatico: l'articolo più recente" pubbl={pubbl} />;
  if (b.tipo === 'riga') return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      {(b.articoli || []).map((id, k) => <div key={k} style={{ display: 'flex', gap: 6 }}>
        <div style={{ flex: 1, minWidth: 0 }}><SelArticolo v={id} pubbl={pubbl} on={v => set({ articoli: b.articoli.map((x, z) => z === k ? v : x) })} vuoto="— scegli un articolo —" /></div>
        <button className="btn btn-s" onClick={() => set({ articoli: b.articoli.filter((_, z) => z !== k) })} aria-label="Togli">✕</button></div>)}
      {(b.articoli || []).length < 4 && <button className="btn btn-s" style={{ alignSelf: 'flex-start' }} onClick={() => set({ articoli: [...(b.articoli || []), ''] })}>+ articolo</button>}
    </div>
  );
  if (b.tipo === 'ultimi') return (
    <div className="campi">
      <label className="campo largo"><span>Titolo sezione</span><input className="input" value={b.titolo || ''} onChange={e => set({ titolo: e.target.value })} /></label>
      <label className="campo"><span>Quanti articoli</span><input className="input" type="number" min="1" max="24" value={b.n || 6} onChange={e => set({ n: Math.max(1, Math.min(24, +e.target.value || 6)) })} /></label>
      <label className="campo"><span>Categoria</span><select className="sel" value={b.categoria || ''} onChange={e => set({ categoria: e.target.value })}>
        <option value="">Tutte</option>{cats.map(c => <option key={c}>{c}</option>)}</select></label>
    </div>
  );
  if (b.tipo === 'galleria') return (
    <select className="sel" value={b.album || ''} onChange={e => set({ album: e.target.value })} style={{ width: '100%' }}>
      <option value="">Automatico: l'album più recente</option>{album.map(x => <option key={x.id} value={x.id}>{x.titolo}</option>)}</select>
  );
  if (b.tipo === 'avviso') return (
    <div className="campi">
      <label className="campo largo"><span>Testo</span><input className="input" value={b.testo || ''} onChange={e => set({ testo: e.target.value })} /></label>
      <label className="campo largo"><span>Link (facoltativo)</span><input className="input" value={b.link || ''} placeholder="https://… oppure #/articolo/…" onChange={e => set({ link: e.target.value })} /></label>
    </div>
  );
  return null;
}

function Inseritore({ onScegli, primo, ultimo }) {
  const [aperto, setAperto] = useState(false);
  return (
    <div className={'pp-ins' + (primo ? ' primo' : '') + (ultimo ? ' ultimo' : '') + (aperto ? ' aperto' : '')} onClick={e => e.stopPropagation()}>
      {!aperto ? <button className="pp-ins-btn" onClick={() => setAperto(true)}>+ Aggiungi blocco</button> :
        <div className="pp-ins-menu">
          {Object.entries(TIPI_BLOCCO).map(([k, l]) => <button key={k} className="chip" onClick={() => { setAperto(false); onScegli(k); }}>{l}</button>)}
          <button className="chip" onClick={() => setAperto(false)}>Annulla</button>
        </div>}
    </div>
  );
}

function GestionePrimaPagina({ utente, dati, ricarica, avvisa }) {
  const admin = utente.ruolo === 'admin';
  const [L, setL] = useState(() => clone(dati.layout));
  const [catTxt, setCatTxt] = useState((dati.layout.categorie || CATEGORIE_DEFAULT).join(', '));
  const [sel, setSel] = useState(null);
  const [occ, setOcc] = useState(false);
  const [pronto, setPronto] = useState(false);
  const [pronti, setPronti] = useState([]);
  const [salvato, setSalvato] = useState(null);
  const [salvataggio, setSalvataggio] = useState('');
  const normLayout = l => JSON.stringify({ ...l, categorie: l.categorie && l.categorie.length ? l.categorie : CATEGORIE_DEFAULT });
  useEffect(() => {
    let ok = true;
    Promise.all([Store.bozzaLayout().catch(() => null), Store.articoliRedazione(utente).catch(() => [])]).then(([b, arts]) => {
      if (!ok) return;
      setPronti(arts.filter(a => a.stato === 'pronto'));
      if (b) { setL(b); setCatTxt((b.categorie || CATEGORIE_DEFAULT).join(', ')); setSalvato(normLayout(b)); }
      else setSalvato(normLayout(dati.layout));
      setPronto(true);
    });
    return () => { ok = false; };
  }, []);
  const pubbl = useMemo(() => {
    const ora = Date.now();
    const online = (dati.indice.articoli || []).filter(a => a.data <= ora);
    const ids = new Set(pronti.map(a => a.id));
    const nuovi = pronti.map(a => ({ ...voceIndice(a), data: Math.max(a.data || 0, ora), daPubblicare: true }));
    return [...nuovi, ...online.filter(a => !ids.has(a.id))].sort((a, b) => b.data - a.data);
  }, [dati, pronti]);
  const visibili = pubbl;
  const album = ordinaAlbum(dati.gallerie.album);
  const cats = catTxt.split(',').map(s => s.trim()).filter(Boolean);
  const finale = { ...L, categorie: cats.length ? cats : CATEGORIE_DEFAULT };
  const diversoOnline = normLayout(finale) !== normLayout(dati.layout);
  const modificato = diversoOnline || pronti.length > 0;
  // salvataggio automatico della bozza
  useEffect(() => {
    if (!admin || !pronto || salvato === null) return;
    const s = normLayout(finale);
    if (s === salvato) return;
    setSalvataggio('Salvataggio…');
    const t = setTimeout(async () => {
      try { await Store.salvaBozzaLayout(finale); setSalvato(s); setSalvataggio('Bozza salvata'); }
      catch (e) { setSalvataggio('Bozza non salvata'); avvisa(msgErrore(e), true); }
    }, 900);
    return () => clearTimeout(t);
  }, [L, catTxt, pronto, salvato]);
  const T = { ...TICKER_DEFAULT, ...(L.ticker || {}) };
  const setT = patch => setL(x => ({ ...x, ticker: { ...TICKER_DEFAULT, ...(x.ticker || {}), ...patch } }));
  const setB = (id, patch) => setL(x => ({ ...x, blocchi: x.blocchi.map(b => b.id === id ? { ...b, ...patch } : b) }));
  const sposta = (id, d) => setL(x => {
    const b = [...x.blocchi]; const i = b.findIndex(y => y.id === id); const j = i + d;
    if (i < 0 || j < 0 || j >= b.length) return x; [b[i], b[j]] = [b[j], b[i]]; return { ...x, blocchi: b };
  });
  const togli = id => { setL(x => ({ ...x, blocchi: x.blocchi.filter(b => b.id !== id) })); setSel(null); };
  const inserisci = (pos, tipo) => {
    const b = nuovoBlocco(tipo);
    setL(x => { const l = [...(x.blocchi || [])]; l.splice(pos, 0, b); return { ...x, blocchi: l }; });
    setSel(b.id);
  };
  const vaiA = id => { setSel(id); setTimeout(() => { const el = document.getElementById('pp-' + id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 30); };
  const salva = async () => {
    const elenco = pronti.length ? '\n\nArticoli che andranno online:\n' + pronti.map(a => '• ' + (a.titolo || '(senza titolo)')).join('\n') : '';
    if (!confirm('Pubblicare l\'edizione? La nuova prima pagina sarà visibile a tutti.' + elenco)) return;
    setOcc(true);
    try {
      await Store.pubblicaEdizione(finale, pronti);
      setPronti([]); setSalvato(normLayout(finale)); setSalvataggio('');
      await ricarica(); avvisa('Edizione pubblicata: è online!');
    } catch (e) { avvisa(msgErrore(e), true); }
    setOcc(false);
  };
  const annulla = async () => {
    if (!confirm('Scartare la bozza e tornare alla prima pagina che è online adesso? (Gli articoli pronti restano pronti.)')) return;
    setL(clone(dati.layout)); setCatTxt((dati.layout.categorie || CATEGORIE_DEFAULT).join(', ')); setSel(null);
    try { await Store.eliminaBozzaLayout(); } catch (e) {}
    setSalvato(normLayout(dati.layout)); setSalvataggio('');
  };
  const bloccaLink = e => { const a = e.target.closest('a'); if (a && !e.target.closest('.pp-ins, .pp-etich')) e.preventDefault(); };

  const blocchi = L.blocchi || [];
  const selB = blocchi.find(b => b.id === sel);
  const editor = admin ? {
    wrap: (b, i, el) => (
      <React.Fragment key={b.id}>
        {i === 0 && <Inseritore primo onScegli={t => inserisci(0, t)} />}
        <div id={'pp-' + b.id} className={'pp-blocco' + (sel === b.id ? ' sel' : '')} onClick={() => setSel(b.id)}>
          <div className="pp-etich" onClick={e => e.stopPropagation()}>
            <span onClick={() => setSel(b.id)}>{TIPI_BLOCCO[b.tipo] || b.tipo}</span>
            <button disabled={i === 0} onClick={() => sposta(b.id, -1)} title="Sposta su" aria-label="Sposta su">↑</button>
            <button disabled={i === blocchi.length - 1} onClick={() => sposta(b.id, 1)} title="Sposta giù" aria-label="Sposta giù">↓</button>
            <button onClick={() => togli(b.id)} title="Elimina blocco" aria-label="Elimina blocco">✕</button>
          </div>
          {el || <div className="pp-vuoto">{VUOTO_BLOCCO[b.tipo] || 'Blocco vuoto'}</div>}
        </div>
        <Inseritore ultimo={i === blocchi.length - 1} onScegli={t => inserisci(i + 1, t)} />
      </React.Fragment>
    ),
    vuoto: () => <><div className="pp-vuoto">La prima pagina è vuota: aggiungi il primo blocco.</div><Inseritore primo ultimo onScegli={t => inserisci(0, t)} /></>
  } : null;

  const vista = { ...dati, layout: L };
  let lato;
  if (!admin) lato = null;
  else if (!pronto) lato = <div className="nota">Caricamento…</div>;
  else if (sel === 'ticker') lato = <>
    <div className="pp-pan-hd"><b>Barra notizie</b><button className="ico-btn" onClick={() => setSel(null)} aria-label="Chiudi">✕</button></div>
    <p className="nota">La striscia scorrevole in cima al sito, come nei giornali online.</p>
    <label className="spunta"><input type="checkbox" checked={T.attivo} onChange={e => setT({ attivo: e.target.checked })} /> Mostra la barra</label>
    <fieldset className="fs" disabled={!T.attivo} style={{ display: 'flex', flexDirection: 'column', gap: 10, marginTop: 6 }}>
      <label className="campo"><span>Ultim'ora (facoltativo)</span><input className="input" value={T.testo} placeholder="es. Sabato castagnata in piazza dalle 15" onChange={e => setT({ testo: e.target.value })} /></label>
      <label className="campo"><span>Link dell'ultim'ora (facoltativo)</span><input className="input" value={T.link} placeholder="#/articolo/… oppure https://…" onChange={e => setT({ link: e.target.value })} /></label>
      <label className="spunta"><input type="checkbox" checked={T.risultati} onChange={e => setT({ risultati: e.target.checked })} /> Ultimi risultati delle squadre</label>
      <label className="spunta"><input type="checkbox" checked={T.prossime} onChange={e => setT({ prossime: e.target.checked })} /> Prossime partite</label>
      <label className="spunta"><input type="checkbox" checked={T.articoli} onChange={e => setT({ articoli: e.target.checked })} /> Ultimi articoli</label>
      {T.articoli && <label className="campo"><span>Quanti articoli</span><input className="input" type="number" min="1" max="10" value={T.nArticoli} onChange={e => setT({ nArticoli: Math.max(1, Math.min(10, +e.target.value || 4)) })} /></label>}
    </fieldset>
  </>;
  else if (sel === 'impostazioni') lato = <>
    <div className="pp-pan-hd"><b>Impostazioni generali</b><button className="ico-btn" onClick={() => setSel(null)} aria-label="Chiudi">✕</button></div>
    <div className="campi" style={{ gridTemplateColumns: '1fr' }}>
      <label className="campo"><span>Periodicità del cartaceo</span><input className="input" value={(L.testata || {}).periodicita || ''} placeholder="Bimestrale" onChange={e => setL(x => ({ ...x, testata: { ...(x.testata || {}), periodicita: e.target.value } }))} /></label>
      <label className="campo"><span>Categorie (separate da virgola)</span><textarea className="input" style={{ minHeight: 70 }} value={catTxt} onChange={e => setCatTxt(e.target.value)} /></label>
      <label className="campo"><span>Testo a piè di pagina</span><input className="input" value={L.footer || ''} onChange={e => setL(x => ({ ...x, footer: e.target.value }))} /></label>
    </div>
  </>;
  else if (selB) {
    const i = blocchi.indexOf(selB);
    lato = <>
      <div className="pp-pan-hd"><b>{TIPI_BLOCCO[selB.tipo]}</b><button className="ico-btn" onClick={() => setSel(null)} aria-label="Chiudi">✕</button></div>
      <p className="nota">{DESCR_BLOCCO[selB.tipo]}</p>
      <CampiBlocco b={selB} set={p => setB(selB.id, p)} pubbl={visibili} album={album} cats={cats} />
      <div className="azioni" style={{ marginTop: 14 }}>
        <button className="btn btn-s" disabled={i === 0} onClick={() => sposta(selB.id, -1)}>↑ Sposta su</button>
        <button className="btn btn-s" disabled={i === blocchi.length - 1} onClick={() => sposta(selB.id, 1)}>↓ Sposta giù</button>
        <button className="btn btn-s btn-d" onClick={() => togli(selB.id)}>Elimina</button>
      </div>
    </>;
  } else lato = <>
    <div className="pp-pan-hd"><b>Struttura della pagina</b></div>
    <p className="nota">Clicca un blocco nell'anteprima, o qui sotto, per modificarlo. Passa col mouse tra due blocchi per aggiungerne uno nuovo.</p>
    <div className="pp-lista">
      <button className="pp-voce" onClick={() => vaiA('ticker')}><span className="pp-num">≡</span>Barra notizie<small>{T.attivo ? 'attiva' : 'spenta'}</small></button>
      {blocchi.map((b, k) => <button key={b.id} className="pp-voce" onClick={() => vaiA(b.id)}><span className="pp-num">{k + 1}</span>{TIPI_BLOCCO[b.tipo] || b.tipo}</button>)}
    </div>
    <div className="azioni" style={{ marginTop: 12 }}>
      <button className="btn btn-s" onClick={() => setSel('impostazioni')}>Impostazioni generali</button>
    </div>
  </>;

  return <>
    <div className="pp-barra">
      <div>
        <h2 className="h-adm">Prima pagina</h2>
        <div className="nota">{admin ? 'Così la vedono i lettori. Clicca un blocco per modificarlo.' : (modificato ? 'Anteprima dell\'edizione in preparazione. Solo gli amministratori possono modificarla e pubblicarla.' : 'Così la vedono i lettori. Solo gli amministratori possono modificarla.')}</div>
        {admin && <div className="nota pp-nota-lunga" style={{ marginTop: 2 }}>Le modifiche si salvano da sole in bozza e i lettori non le vedono finché non premi <b>Pubblica edizione</b>. Qui puoi usare gli articoli online e quelli <b>pronti per l'uscita</b>.</div>}
      </div>
      {admin && <div className="azioni">
        {salvataggio && <span className="nota">{salvataggio}</span>}
        {modificato ? <span className="badge b-revisione">Edizione in preparazione{pronti.length ? ` · ${pronti.length} articol${pronti.length === 1 ? 'o' : 'i'} da pubblicare` : ''}</span>
          : <span className="badge b-pubblicato">Uguale al sito online</span>}
        <button className="btn btn-s" onClick={() => setSel('impostazioni')}>Impostazioni</button>
        {diversoOnline && <button className="btn btn-s" onClick={annulla}>Scarta bozza</button>}
        <button className="btn btn-p" disabled={occ || !modificato || !pronto} onClick={salva}>{occ ? 'Pubblicazione…' : 'Pubblica edizione'}</button>
      </div>}
    </div>
    <div className={'pp-layout' + (admin ? ' con-lato' : '')}>
      <div className="pp-schermo">
        <div className="pp-cornice"><i /><i /><i /><span>La Piazza di Fabbrico · {modificato ? 'anteprima della prossima edizione' : 'come è online adesso'}</span></div>
        <div className="pp-sito" onClickCapture={bloccaLink}>
          {admin ? (
            <div id="pp-ticker" className={'pp-blocco pp-tk' + (sel === 'ticker' ? ' sel' : '')} onClick={() => setSel('ticker')}>
              <div className="pp-etich"><span>Barra notizie</span></div>
              {T.attivo ? <Ticker dati={vista} pubblicati={visibili} /> : <div className="pp-vuoto pp-tk-off">Barra notizie spenta: clicca per attivarla</div>}
              {T.attivo && !vociTicker(vista, visibili).length && <div className="pp-vuoto pp-tk-off">Barra notizie: ancora niente da mostrare</div>}
            </div>
          ) : <Ticker dati={vista} pubblicati={visibili} />}
          <Header r={['']} loggato />
          <main><div className="wrap"><Home dati={vista} pubblicati={visibili} editor={editor} /></div></main>
        </div>
      </div>
      {admin && <aside className={'pp-lato' + (sel ? ' attivo' : '')}>{lato}</aside>}
    </div>
  </>;
}

/* ---------- sport ---------- */
function GestioneSport({ ricarica, avvisa, dati }) {
  const [S, setS] = useState(() => clone(dati.sport));
  const [sel, setSel] = useState('');
  const [formSq, setFormSq] = useState(null);
  const [formP, setFormP] = useState(null);
  useEffect(() => { Store.meta('sport').then(setS).catch(() => {}); }, []);
  const agg = async (fn, msg) => {
    try { const nx = await Store.aggiornaMeta('sport', fn); setS(nx); ricarica(); if (msg) avvisa(msg); return true; }
    catch (e) { avvisa(msgErrore(e), true); return false; }
  };
  const sq = S.squadre || [];
  const cur = sq.find(s => s.id === sel) || sq[0];
  const partite = cur ? (S.partite || []).filter(p => p.squadraId === cur.id).sort(perDataDesc) : [];

  const salvaSq = async () => {
    const f = formSq; if (!f.nome.trim()) { avvisa('Inserisci il nome della squadra', true); return; }
    const v = { ...f, nome: f.nome.trim() };
    const ok = await agg(s => {
      const l = [...(s.squadre || [])]; const i = l.findIndex(x => x.id === v.id);
      const vecchio = i >= 0 ? l[i].nome : null;
      if (i >= 0) l[i] = v; else l.push(v);
      let p = s.partite || [];
      if (vecchio && vecchio !== v.nome) p = p.map(x => x.squadraId !== v.id ? x : { ...x, casa: x.casa === vecchio ? v.nome : x.casa, ospite: x.ospite === vecchio ? v.nome : x.ospite });
      return { ...s, squadre: l, partite: p };
    }, 'Squadra salvata');
    if (ok) { setFormSq(null); setSel(v.id); }
  };
  const eliminaSq = async s => {
    if (!confirm(`Eliminare "${s.nome}" e tutte le sue partite?`)) return;
    await agg(x => ({ ...x, squadre: (x.squadre || []).filter(y => y.id !== s.id), partite: (x.partite || []).filter(p => p.squadraId !== s.id) }), 'Squadra eliminata');
    setSel('');
  };
  const salvaP = async () => {
    const f = formP;
    if (!f.data || !f.casa.trim() || !f.ospite.trim()) { avvisa('Servono data, squadra di casa e ospite', true); return; }
    const num = v => v === '' || v == null ? '' : (isNaN(+v) ? '' : +v);
    const v = { ...f, casa: f.casa.trim(), ospite: f.ospite.trim(), gc: num(f.gc), go: num(f.go) };
    const ok = await agg(s => {
      const l = [...(s.partite || [])]; const i = l.findIndex(x => x.id === v.id);
      if (i >= 0) l[i] = v; else l.push(v); return { ...s, partite: l };
    }, 'Partita salvata');
    if (ok) setFormP(null);
  };
  const eliminaP = async p => { if (confirm('Eliminare la partita?')) await agg(s => ({ ...s, partite: (s.partite || []).filter(x => x.id !== p.id) }), 'Partita eliminata'); };

  return <>
    <div className="testa-adm"><h2 className="h-adm">Sport</h2>
      <button className="btn btn-p" onClick={() => setFormSq({ id: uid(), nome: '', sport: '', campionato: '', classifica: '' })}>+ Nuova squadra</button></div>

    {formSq && <div className="pannello"><h3>{sq.find(s => s.id === formSq.id) ? 'Modifica squadra' : 'Nuova squadra'}</h3>
      <div className="campi">
        <label className="campo"><span>Nome *</span><input className="input" value={formSq.nome} onChange={e => setFormSq({ ...formSq, nome: e.target.value })} /></label>
        <label className="campo"><span>Sport</span><input className="input" value={formSq.sport} placeholder="Calcio a 5" onChange={e => setFormSq({ ...formSq, sport: e.target.value })} /></label>
        <label className="campo"><span>Campionato</span><input className="input" value={formSq.campionato} onChange={e => setFormSq({ ...formSq, campionato: e.target.value })} /></label>
        <label className="campo largo"><span>Classifica: una squadra per riga, nel formato  Squadra ; Punti ; Giocate</span>
          <textarea className="input" style={{ minHeight: 150, fontFamily: 'monospace', fontSize: 14 }} value={formSq.classifica} placeholder={'Squadra A; 12; 5\nSquadra B; 10; 5'} onChange={e => setFormSq({ ...formSq, classifica: e.target.value })} /></label>
      </div>
      <div className="azioni" style={{ marginTop: 12 }}><button className="btn btn-p" onClick={salvaSq}>Salva</button><button className="btn" onClick={() => setFormSq(null)}>Annulla</button></div>
    </div>}

    {!sq.length ? <div className="vuoto">Nessuna squadra. Aggiungi la prima.</div> : <>
      <div className="chips">{sq.map(s => <button key={s.id} className={'chip' + (cur && cur.id === s.id ? ' on' : '')} onClick={() => { setSel(s.id); setFormP(null); }}>{s.nome}</button>)}</div>
      {cur && <div className="pannello">
        <div className="testa-adm" style={{ marginBottom: 6 }}>
          <div><h3 style={{ margin: 0 }}>{cur.nome}</h3><span className="nota">{[cur.sport, cur.campionato].filter(Boolean).join(' · ')}</span></div>
          <div className="azioni">
            <button className="btn btn-s" onClick={() => setFormSq({ classifica: '', sport: '', campionato: '', ...clone(cur) })}>Modifica squadra e classifica</button>
            <button className="btn btn-s btn-d" onClick={() => eliminaSq(cur)}>Elimina</button>
          </div>
        </div>
        <button className="btn btn-p" style={{ margin: '8px 0 12px' }} onClick={() => setFormP({ id: uid(), squadraId: cur.id, data: oggiISO(), ora: '', casa: cur.nome, ospite: '', gc: '', go: '', competizione: '' })}>+ Aggiungi partita</button>
        {formP && <div className="blocco-ed">
          <div className="campi">
            <label className="campo"><span>Data *</span><input className="input" type="date" value={formP.data} onChange={e => setFormP({ ...formP, data: e.target.value })} /></label>
            <label className="campo"><span>Ora</span><input className="input" type="time" value={formP.ora} onChange={e => setFormP({ ...formP, ora: e.target.value })} /></label>
            <label className="campo"><span>Giornata / competizione</span><input className="input" value={formP.competizione} onChange={e => setFormP({ ...formP, competizione: e.target.value })} /></label>
            <label className="campo"><span>Casa *</span><input className="input" value={formP.casa} onChange={e => setFormP({ ...formP, casa: e.target.value })} /></label>
            <label className="campo"><span>Ospite *</span><input className="input" value={formP.ospite} onChange={e => setFormP({ ...formP, ospite: e.target.value })} /></label>
            <div className="campo"><span>Risultato (vuoto se non ancora giocata)</span>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                <input className="input" style={{ width: 70 }} inputMode="numeric" value={formP.gc} onChange={e => setFormP({ ...formP, gc: e.target.value })} />–
                <input className="input" style={{ width: 70 }} inputMode="numeric" value={formP.go} onChange={e => setFormP({ ...formP, go: e.target.value })} />
              </div></div>
          </div>
          <div className="azioni" style={{ marginTop: 10 }}>
            <button className="btn btn-p" onClick={salvaP}>Salva partita</button>
            <button className="btn" onClick={() => setFormP({ ...formP, casa: formP.ospite, ospite: formP.casa, gc: formP.go, go: formP.gc })}>⇄ Inverti casa/ospite</button>
            <button className="btn" onClick={() => setFormP(null)}>Annulla</button>
          </div>
        </div>}
        {!partite.length ? <div className="nota">Nessuna partita inserita.</div> : partite.map(p => (
          <div className="riga-adm" key={p.id}>
            <div className="t"><b>{p.casa} {giocata(p) ? `${p.gc} – ${p.go}` : 'vs'} {p.ospite}</b>
              <span className="nota">{fmtGiorno(p.data)}{p.ora ? ' · ' + p.ora : ''}{p.competizione ? ' · ' + p.competizione : ''}{!giocata(p) ? ' · da giocare' : ''}</span></div>
            <div className="azioni"><button className="btn btn-s" onClick={() => setFormP(clone(p))}>{giocata(p) ? 'Modifica' : 'Inserisci risultato'}</button>
              <button className="btn btn-s btn-d" onClick={() => eliminaP(p)}>Elimina</button></div>
          </div>))}
      </div>}
    </>}
  </>;
}

/* ---------- foto ---------- */
function GestioneFoto({ dati, ricarica, avvisa }) {
  const [G, setG] = useState(() => clone(dati.gallerie));
  const [sel, setSel] = useState(null);
  const [form, setForm] = useState(null);
  const [occ, setOcc] = useState('');
  useEffect(() => { Store.meta('gallerie').then(setG).catch(() => {}); }, []);
  const agg = async (fn, msg) => {
    try { const nx = await Store.aggiornaMeta('gallerie', fn); setG(nx); ricarica(); if (msg) avvisa(msg); return true; }
    catch (e) { avvisa(msgErrore(e), true); return false; }
  };
  const albums = ordinaAlbum(G.album);
  const cur = albums.find(a => a.id === sel);
  const modAlbum = fn => agg(g => ({ ...g, album: (g.album || []).map(a => a.id === cur.id ? fn(a) : a) }));

  const salvaAlbum = async () => {
    if (!form.titolo.trim()) { avvisa('Serve un titolo', true); return; }
    const v = { ...form, titolo: form.titolo.trim() };
    const ok = await agg(g => {
      const l = [...(g.album || [])]; const i = l.findIndex(a => a.id === v.id);
      if (i >= 0) l[i] = { ...l[i], titolo: v.titolo, data: v.data, descrizione: v.descrizione }; else l.push({ ...v, foto: [] });
      return { ...g, album: l };
    }, 'Album salvato');
    if (ok) { setSel(v.id); setForm(null); }
  };
  const carica = async e => {
    const fs = [...(e.target.files || [])]; e.target.value = ''; if (!fs.length) return;
    const nuove = [];
    for (let i = 0; i < fs.length; i++) {
      setOcc(`Caricamento ${i + 1} di ${fs.length}…`);
      try { nuove.push({ url: await caricaImmagine(fs[i]), didascalia: '' }); } catch (ex) { avvisa(ex.message, true); break; }
    }
    setOcc('');
    if (nuove.length) await agg(g => ({ ...g, album: (g.album || []).map(a => a.id === cur.id ? { ...a, foto: [...(a.foto || []), ...nuove] } : a) }), `${nuove.length} foto aggiunte`);
  };
  const eliminaAlbum = async () => {
    if (!confirm(`Eliminare l'album "${cur.titolo}"?`)) return;
    const ok = await agg(g => ({ ...g, album: (g.album || []).filter(a => a.id !== cur.id) }), 'Album eliminato');
    if (ok) setSel(null);
  };

  if (form) return (
    <div className="pannello"><h3>{albums.find(a => a.id === form.id) ? 'Modifica album' : 'Nuovo album'}</h3>
      <div className="campi">
        <label className="campo"><span>Titolo *</span><input className="input" value={form.titolo} onChange={e => setForm({ ...form, titolo: e.target.value })} /></label>
        <label className="campo"><span>Data</span><input className="input" type="date" value={form.data} onChange={e => setForm({ ...form, data: e.target.value })} /></label>
        <label className="campo largo"><span>Descrizione</span><input className="input" value={form.descrizione} onChange={e => setForm({ ...form, descrizione: e.target.value })} /></label>
      </div>
      <div className="azioni" style={{ marginTop: 12 }}><button className="btn btn-p" onClick={salvaAlbum}>Salva</button><button className="btn" onClick={() => setForm(null)}>Annulla</button></div>
    </div>);

  if (cur) return <>
    <div className="testa-adm">
      <div><button className="link-txt" onClick={() => setSel(null)}>← Tutti gli album</button><h2 className="h-adm">{cur.titolo}</h2><span className="nota">{fmtGiornoLungo(cur.data)} · {(cur.foto || []).length} foto</span></div>
      <div className="azioni">
        <button className="btn" onClick={() => setForm({ id: cur.id, titolo: cur.titolo, data: cur.data || oggiISO(), descrizione: cur.descrizione || '' })}>Modifica</button>
        <button className="btn btn-d" onClick={eliminaAlbum}>Elimina album</button>
      </div>
    </div>
    <label className="btn btn-p" style={{ cursor: 'pointer', marginBottom: 14 }}>{occ || '+ Carica foto (anche più di una)'}
      <input type="file" accept="image/*" multiple hidden onChange={carica} disabled={!!occ} /></label>
    {!(cur.foto || []).length ? <div className="vuoto">Nessuna foto: caricane qualcuna.</div> :
      <div className="thumbs">{cur.foto.map((f, i) => (
        <div className="thumb" key={f.url.slice(-40) + i}>
          <img src={imgUrl(f.url, 300)} alt="" />
          <div className="p">
            <input className="input" placeholder="Didascalia" defaultValue={f.didascalia || ''}
              onBlur={e => { const v = e.target.value; if (v !== (f.didascalia || '')) modAlbum(a => ({ ...a, foto: a.foto.map((x, k) => k === i ? { ...x, didascalia: v } : x) })); }} />
            <div className="azioni">
              {i > 0 && <button className="btn btn-s" title="Usa come copertina" onClick={() => modAlbum(a => ({ ...a, foto: [a.foto[i], ...a.foto.filter((_, k) => k !== i)] }))}>Copertina</button>}
              <button className="btn btn-s btn-d" onClick={() => { if (confirm('Togliere la foto?')) modAlbum(a => ({ ...a, foto: a.foto.filter((_, k) => k !== i) })); }}>✕</button>
            </div>
          </div>
        </div>))}</div>}
  </>;

  return <>
    <div className="testa-adm"><h2 className="h-adm">Foto</h2>
      <button className="btn btn-p" onClick={() => setForm({ id: uid(), titolo: '', data: oggiISO(), descrizione: '' })}>+ Nuovo album</button></div>
    {!albums.length ? <div className="vuoto">Nessun album.</div> :
      <div className="pannello" style={{ padding: '0 16px' }}>{albums.map(a => (
        <div className="riga-adm" key={a.id}>
          {a.foto && a.foto[0] ? <img src={imgUrl(a.foto[0].url, 200)} alt="" /> : <div className="ph" />}
          <div className="t"><b>{a.titolo}</b><span className="nota">{fmtGiornoLungo(a.data)} · {(a.foto || []).length} foto</span></div>
          <div className="azioni"><button className="btn btn-s" onClick={() => setSel(a.id)}>Apri</button></div>
        </div>))}</div>}
  </>;
}

/* ---------- numeri cartacei ---------- */
function GestioneNumeri({ dati, ricarica, avvisa }) {
  const [N, setN] = useState(() => clone(dati.numeri));
  const [form, setForm] = useState(null);
  useEffect(() => { Store.meta('numeri').then(setN).catch(() => {}); }, []);
  const agg = async (fn, msg) => {
    try { const nx = await Store.aggiornaMeta('numeri', fn); setN(nx); ricarica(); if (msg) avvisa(msg); return true; }
    catch (e) { avvisa(msgErrore(e), true); return false; }
  };
  const l = ordinaNumeri(N.numeri);
  const salva = async () => {
    if (!String(form.nr).trim()) { avvisa('Serve il numero', true); return; }
    const v = { ...form, nr: String(form.nr).trim() };
    const ok = await agg(n => { const x = [...(n.numeri || [])]; const i = x.findIndex(y => y.id === v.id); if (i >= 0) x[i] = v; else x.push(v); return { numeri: x }; }, 'Numero salvato');
    if (ok) setForm(null);
  };
  if (form) return (
    <div className="pannello"><h3>{l.find(n => n.id === form.id) ? 'Modifica numero' : 'Nuovo numero'}</h3>
      <div className="campi">
        <label className="campo"><span>Numero *</span><input className="input" value={form.nr} onChange={e => setForm({ ...form, nr: e.target.value })} /></label>
        <label className="campo"><span>Uscita</span><input className="input" value={form.mese} placeholder="Settembre 2025" onChange={e => setForm({ ...form, mese: e.target.value })} /></label>
        <label className="campo largo"><span>Link al PDF</span><input className="input" value={form.pdf} placeholder="numeri/62.pdf  oppure  https://…" onChange={e => setForm({ ...form, pdf: e.target.value })} /></label>
        <CampoImmagine valore={form.copertina} onChange={v => setForm({ ...form, copertina: v })} avvisa={avvisa} etichetta="Copertina" />
      </div>
      <div className="azioni" style={{ marginTop: 12 }}><button className="btn btn-p" onClick={salva}>Salva</button><button className="btn" onClick={() => setForm(null)}>Annulla</button></div>
    </div>);
  const prossimo = l.length ? String((parseFloat(l[0].nr) || 0) + 1) : '';
  return <>
    <div className="testa-adm"><h2 className="h-adm">Numeri cartacei</h2>
      <button className="btn btn-p" onClick={() => setForm({ id: uid(), nr: prossimo, mese: '', pdf: '', copertina: '' })}>+ Nuovo numero</button></div>
    {!l.length ? <div className="vuoto">Nessun numero caricato.</div> :
      <div className="pannello" style={{ padding: '0 16px' }}>{l.map(n => (
        <div className="riga-adm" key={n.id}>
          {n.copertina ? <img src={imgUrl(n.copertina, 200)} alt="" style={{ height: 64, width: 46 }} /> : <div className="ph" style={{ height: 64, width: 46 }} />}
          <div className="t"><b>Nr. {n.nr}</b><span className="nota">{n.mese}{n.pdf ? ' · PDF presente' : ' · senza PDF'}</span></div>
          <div className="azioni"><button className="btn btn-s" onClick={() => setForm({ copertina: '', pdf: '', mese: '', ...clone(n) })}>Modifica</button>
            <button className="btn btn-s btn-d" onClick={() => { if (confirm(`Eliminare il nr. ${n.nr}?`)) agg(x => ({ numeri: (x.numeri || []).filter(y => y.id !== n.id) }), 'Numero eliminato'); }}>Elimina</button></div>
        </div>))}</div>}
  </>;
}

/* ---------- utenti ---------- */
function GestioneUtenti({ utente, avvisa }) {
  const [l, setL] = useState(null);
  const [form, setForm] = useState(null);
  const [occ, setOcc] = useState(false);
  const carica = useCallback(() => Store.utenti().then(x => setL(x.sort((a, b) => (a.nome || '').localeCompare(b.nome || '')))).catch(e => { avvisa(msgErrore(e), true); setL([]); }), [avvisa]);
  useEffect(() => { carica(); }, [carica]);
  const cambia = async (u, ruolo) => {
    try { await Store.aggiornaUtente(u.uid, { ruolo }); avvisa(ruolo === 'disattivato' ? 'Utente disattivato' : 'Ruolo aggiornato'); carica(); }
    catch (e) { avvisa(msgErrore(e), true); }
  };
  const suggerito = form ? pulisciUtente(norm(form.nome)).replace(/[^a-z0-9._-]/g, '') : '';
  const crea = async () => {
    const u = pulisciUtente(form.utente || suggerito);
    if (!form.nome.trim()) { avvisa('Inserisci nome e cognome', true); return; }
    if (!UTENTE_VALIDO.test(u)) { avvisa('Nome utente non valido: lettere minuscole, numeri, punto o trattino', true); return; }
    if ((l || []).some(x => x.utente === u)) { avvisa('Questo nome utente esiste già', true); return; }
    if (form.password.length < PW_MIN) { avvisa(`La password deve avere almeno ${PW_MIN} caratteri`, true); return; }
    setOcc(true);
    try {
      await Store.creaUtente({ nome: form.nome.trim(), utente: u, password: form.password, ruolo: form.ruolo });
      avvisa(`Utente "${u}" creato`); setForm(null); carica();
    } catch (e) { avvisa(msgErrore(e), true); }
    setOcc(false);
  };
  return <>
    <div className="testa-adm"><h2 className="h-adm">Utenti</h2>
      {!form && <button className="btn btn-p" onClick={() => setForm({ nome: '', utente: '', password: '', ruolo: 'redattore' })}>+ Nuovo utente</button>}</div>
    <p className="nota" style={{ marginTop: -6 }}>Crea qui gli accessi e comunica a ciascuno nome utente e password. I <b>redattori</b> scrivono articoli e li inviano in revisione, aggiornano sport e foto. Gli <b>amministratori</b> pubblicano e gestiscono tutto. Ognuno può cambiare la propria password con "Cambia password" in alto.</p>
    {form && <div className="pannello"><h3>Nuovo utente</h3>
      <div className="campi">
        <label className="campo"><span>Nome e cognome *</span><input className="input" value={form.nome} onChange={e => setForm({ ...form, nome: e.target.value })} /></label>
        <label className="campo"><span>Nome utente *</span><input className="input" autoCapitalize="none" autoCorrect="off" spellCheck="false" value={form.utente} placeholder={suggerito || 'es. mario.rossi'} onChange={e => setForm({ ...form, utente: e.target.value })} /></label>
        <label className="campo"><span>Password * (almeno {PW_MIN} caratteri)</span><input className="input" autoComplete="off" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} /></label>
        <label className="campo"><span>Ruolo</span><select className="sel" value={form.ruolo} onChange={e => setForm({ ...form, ruolo: e.target.value })}>
          <option value="redattore">Redattore</option><option value="admin">Amministratore</option></select></label>
      </div>
      <div className="azioni" style={{ marginTop: 12 }}>
        <button className="btn btn-p" disabled={occ} onClick={crea}>{occ ? 'Creazione…' : 'Crea utente'}</button>
        <button className="btn" onClick={() => setForm(null)}>Annulla</button>
      </div>
    </div>}
    <div className="pannello" style={{ padding: '0 16px' }}>
      {l === null ? <div className="vuoto">Caricamento…</div> : !l.length ? <div className="vuoto">Nessun utente.</div> : l.map(u => (
        <div className="riga-adm" key={u.uid} style={u.ruolo === 'disattivato' ? { opacity: .55 } : undefined}>
          <span className="avatar" style={{ width: 38, height: 38, fontSize: 14 }}>{iniziali(u.nome)}</span>
          <div className="t"><b>{u.nome || '(senza nome)'}{u.uid === utente.uid ? ' (tu)' : ''}</b><span className="nota">Utente: {u.utente || u.email || '—'}</span></div>
          <select className="sel" value={u.ruolo} disabled={u.uid === utente.uid} onChange={e => cambia(u, e.target.value)}>
            <option value="redattore">Redattore</option><option value="admin">Amministratore</option><option value="disattivato">Disattivato</option>
            {!['redattore', 'admin', 'disattivato'].includes(u.ruolo) && <option value={u.ruolo}>{u.ruolo}</option>}
          </select>
        </div>))}
    </div>
    <p className="nota">Se qualcuno dimentica la password: disattiva il suo utente e creane uno nuovo con un nome utente diverso (es. mario.rossi2).</p>
  </>;
}

/* =====================================================================
   APP
   ===================================================================== */
function App() {
  const r = useRotta();
  const [dati, setDati] = useState(null);
  const [errore, setErrore] = useState('');
  const carica = useCallback(async () => {
    try {
      const nomi = ['indice', 'layout', 'sport', 'gallerie', 'numeri'];
      const v = await Promise.all(nomi.map(n => Store.meta(n)));
      const d = {}; nomi.forEach((n, i) => { d[n] = v[i]; }); setDati(d); setErrore('');
    } catch (e) { console.error(e); setErrore('Impossibile caricare i contenuti. Riprova più tardi.'); }
  }, []);
  useEffect(() => { carica(); }, [carica]);
  const [loggato, setLoggato] = useState(false);
  const inRedazione = r[0] === 'redazione';
  useEffect(() => Auth.osserva(u => setLoggato(!!u)), [inRedazione]);
  const pubblicati = useMemo(() => {
    if (!dati) return [];
    const ora = Date.now();
    return (dati.indice.articoli || []).filter(a => a.data <= ora).sort((a, b) => b.data - a.data);
  }, [dati]);

  if (r[0] === 'redazione') return <Redazione dati={dati} ricarica={carica} />;

  const layout = dati ? dati.layout : META_DEFAULT.layout;
  const categorie = layout.categorie && layout.categorie.length ? layout.categorie : CATEGORIE_DEFAULT;
  let pagina;
  if (errore) pagina = <div className="vuoto">{errore}</div>;
  else if (!dati) pagina = <div className="vuoto">Caricamento…</div>;
  else switch (r[0]) {
    case 'articolo': pagina = <PaginaArticolo id={r[1]} pubblicati={pubblicati} />; break;
    case 'archivio': pagina = <Archivio pubblicati={pubblicati} categorie={categorie} cat0="" />; break;
    case 'categoria': pagina = <Archivio pubblicati={pubblicati} categorie={categorie} cat0={r[1] || ''} />; break;
    case 'sport': pagina = <PaginaSport sport={dati.sport} />; break;
    case 'foto': pagina = <PaginaFoto gallerie={dati.gallerie} albumId={r[1]} />; break;
    case 'numeri': pagina = <PaginaNumeri numeri={dati.numeri} />; break;
    default: pagina = <Home dati={dati} pubblicati={pubblicati} />;
  }
  return (
    <div className="pubblico">
      {dati && <Ticker dati={dati} pubblicati={pubblicati} />}
      <Header r={r} loggato={loggato} />
      <main><div className="wrap">{pagina}</div></main>
      <Piede layout={layout} />
      <TabBar r={r} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
