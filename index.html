function Accesso({ onEntrato }) {
  const [modo, setModo] = useState('login');
  const [nome, setNome] = useState(''); const [email, setEmail] = useState(''); const [pw, setPw] = useState('');
  const [err, setErr] = useState(''); const [msg, setMsg] = useState(''); const [occ, setOcc] = useState(false);
  const invia = async e => {
    e.preventDefault(); setErr(''); setMsg(''); setOcc(true);
    try {
      if (modo === 'login') onEntrato(await Auth.accedi(email.trim(), pw));
      else if (modo === 'reg') {
        if (!nome.trim()) throw new Error('Inserisci nome e cognome.');
        onEntrato(await Auth.registra(nome.trim(), email.trim(), pw));
      } else { await Auth.reset(email.trim()); setMsg('Ti abbiamo inviato un\'email per reimpostare la password.'); }
    } catch (ex) { setErr(msgErrore(ex)); }
    setOcc(false);
  };
  return (
    <form className="login" onSubmit={invia}>
      <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 4 }}><Marchio /></div>
      <h2>{modo === 'login' ? 'Accesso redazione' : modo === 'reg' ? 'Nuovo redattore' : 'Password dimenticata'}</h2>
      {DEMO && <div className="avviso-adm" style={{ margin: 0 }}>Modalità demo: inserisci un'email qualsiasi e premi Entra.</div>}
      {modo === 'reg' && <label className="campo"><span>Nome e cognome</span><input className="input" value={nome} onChange={e => setNome(e.target.value)} /></label>}
      <label className="campo"><span>Email</span><input className="input" type="email" autoComplete="email" value={email} onChange={e => setEmail(e.target.value)} required={!DEMO} /></label>
      {modo !== 'reset' && <label className="campo"><span>Password</span><input className="input" type="password" autoComplete={modo === 'reg' ? 'new-password' : 'current-password'} value={pw} onChange={e => setPw(e.target.value)} required={!DEMO} /></label>}
      {err && <div className="err-txt">{err}</div>}
      {msg && <div className="nota">{msg}</div>}
      <button className="btn btn-p" disabled={occ}>{occ ? 'Attendere…' : modo === 'login' ? 'Entra' : modo === 'reg' ? 'Registrati' : 'Invia email'}</button>
      <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8, flexWrap: 'wrap' }}>
        {modo !== 'login' && <button type="button" className="link-txt" onClick={() => setModo('login')}>Ho già un account</button>}
        {modo !== 'reg' && <button type="button" className="link-txt" onClick={() => setModo('reg')}>Registrati come redattore</button>}
        {modo === 'login' && <button type="button" className="link-txt" onClick={() => setModo('reset')}>Password dimenticata?</button>}
      </div>
      {modo === 'reg' && <div className="nota">Dopo la registrazione un amministratore dovrà abilitare il tuo account.</div>}
    </form>
  );
}

function Redazione({ dati, ricarica }) {
  const [authU, setAuthU] = useState(undefined);
  const [utente, setUtente] = useState(null);
  const [tab, setTab] = useState('articoli');
  const [toast, setToast] = useState(null);
  const timer = useRef(null);
  const avvisa = useCallback((msg, err) => {
    setToast({ msg, err }); clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(null), err ? 5000 : 2800);
  }, []);
  useEffect(() => Auth.osserva(u => setAuthU(u)), []);
  useEffect(() => { document.title = 'Redazione — La Piazza'; return () => { document.title = 'La Piazza di Fabbrico'; }; }, []);
  useEffect(() => {
    let ok = true;
    if (!authU) { setUtente(null); return; }
    setUtente('carico');
    const base = { ruolo: 'sconosciuto', uid: authU.uid, email: authU.email };
    Store.utente(authU.uid).then(p => { if (ok) setUtente({ ...base, ...(p || {}), uid: authU.uid }); })
      .catch(() => { if (ok) setUtente(base); });
    return () => { ok = false; };
  }, [authU]);
  const esci = async () => { await Auth.esci(); setAuthU(null); };

  let corpo;
  if (authU === undefined || (authU && (!utente || utente === 'carico'))) corpo = <div className="vuoto">Caricamento…</div>;
  else if (!authU) corpo = <Accesso onEntrato={u => setAuthU({ ...u })} />;
  else if (!['admin', 'redattore'].includes(utente.ruolo)) corpo = (
    <div className="login">
      <h2>Account non attivo</h2>
      <p style={{ margin: 0 }}>{utente.ruolo === 'in_attesa' ? 'Registrazione completata. Un amministratore deve abilitare il tuo account prima che tu possa scrivere.'
        : utente.ruolo === 'disattivato' ? 'Il tuo account è stato disattivato.' : 'Profilo non trovato: contatta l\'amministratore.'}</p>
      <div className="azioni"><button className="btn" onClick={() => setAuthU({ ...authU })}>Riprova</button><button className="btn" onClick={esci}>Esci</button></div>
    </div>);
  else if (!dati) corpo = <div className="vuoto">Caricamento…</div>;
  else {
    const admin = utente.ruolo === 'admin';
    const tabs = [['articoli', 'Articoli'], ...(admin ? [['home', 'Prima pagina']] : []), ['sport', 'Sport'], ['foto', 'Foto'], ...(admin ? [['numeri', 'Numeri'], ['utenti', 'Utenti']] : [])];
    const p = { utente, dati, ricarica, avvisa };
    corpo = <>
      <div className="adm-tabs"><div className="in">{tabs.map(([k, l]) => <button key={k} className={tab === k ? 'on' : ''} onClick={() => setTab(k)}>{l}</button>)}</div></div>
      <div className="adm">
        {tab === 'articoli' && <GestioneArticoli {...p} />}
        {tab === 'home' && admin && <GestionePrimaPagina {...p} />}
        {tab === 'sport' && <GestioneSport {...p} />}
        {tab === 'foto' && <GestioneFoto {...p} />}
        {tab === 'numeri' && admin && <GestioneNumeri {...p} />}
        {tab === 'utenti' && admin && <GestioneUtenti {...p} />}
      </div>
    </>;
  }
  return (
    <div>
      {DEMO && <div className="demo">Modalità demo: i dati restano solo in questo browser. Inserisci la configurazione Firebase per andare online.</div>}
      <div className="adm-top"><div className="in">
        <a href="#/" className="adm-logo"><Marchio /><span className="adm-tag">Redazione</span></a>
        <div className="azioni">
          {utente && utente !== 'carico' && <span style={{ fontSize: 14, opacity: .9 }}>{utente.nome || utente.email}{utente.ruolo === 'admin' ? ' · amministratore' : ''}</span>}
          <a className="btn btn-s" href="#/">Vai al sito</a>
          {authU && <button className="btn btn-s" onClick={esci}>Esci</button>}
        </div>
      </div></div>
      {corpo}
      {toast && <div className={'toast' + (toast.err ? ' err' : '')}>{toast.msg}</div>}
    </div>
  );
}

/* ---------- articoli ---------- */
function GestioneArticoli({ utente, dati, ricarica, avvisa }) {
  const [lista, setLista] = useState(null);
  const [ed, setEd] = useState(null);
  const [filtro, setFiltro] = useState('');
  const [q, setQ] = useState('');
  const admin = utente.ruolo === 'admin';
  const categorie = dati.layout.categorie && dati.layout.categorie.length ? dati.layout.categorie : CATEGORIE_DEFAULT;
  const carica = useCallback(async () => {
    try { const l = await Store.articoliRedazione(utente); l.sort((a, b) => (b.modificato || 0) - (a.modificato || 0)); setLista(l); }
    catch (e) { avvisa(msgErrore(e), true); setLista([]); }
  }, [utente, avvisa]);
  useEffect(() => { carica(); }, [carica]);

  if (ed) return <Editor iniziale={ed} utente={utente} categorie={categorie} avvisa={avvisa}
    chiudi={async salvato => { setEd(null); if (salvato) { await carica(); ricarica(); } }} />;

  const nuovo = () => setEd({
    id: Store.nuovoId(), titolo: '', occhiello: '', sommario: '', testo: '', categoria: categorie[0], autore: utente.nome || '',
    autoreUid: utente.uid, immagine: '', didascalia: '', galleria: [], numero: '', stato: 'bozza', data: Date.now(), creato: Date.now()
  });
  const elimina = async a => {
    if (!confirm(`Eliminare definitivamente "${a.titolo || 'senza titolo'}"?`)) return;
    try { await Store.eliminaArticolo(a, utente); avvisa('Articolo eliminato'); carica(); ricarica(); }
    catch (e) { avvisa(msgErrore(e), true); }
  };
  const qq = norm(q.trim());
  const vis = (lista || []).filter(a => (!filtro || a.stato === filtro) && (!qq || norm((a.titolo || '') + ' ' + (a.autore || '')).includes(qq)));
  const inRev = (lista || []).filter(a => a.stato === 'revisione').length;
  return <>
    <div className="testa-adm"><h2 className="h-adm">{admin ? 'Articoli' : 'I miei articoli'}</h2><button className="btn btn-p" onClick={nuovo}>+ Nuovo articolo</button></div>
    {admin && inRev > 0 && <div className="avviso-adm"><b>{inRev}</b> articol{inRev === 1 ? 'o' : 'i'} in attesa di revisione. <button className="link-txt" onClick={() => setFiltro('revisione')}>Mostra</button></div>}
    <div className="filtri">
      <input className="input" placeholder="Cerca per titolo o autore" value={q} onChange={e => setQ(e.target.value)} style={{ flex: 1, minWidth: 180 }} />
      <select className="sel" value={filtro} onChange={e => setFiltro(e.target.value)}>
        <option value="">Tutti gli stati</option><option value="bozza">Bozze</option><option value="revisione">In revisione</option><option value="pubblicato">Pubblicati</option>
      </select>
    </div>
    <div className="pannello" style={{ padding: '0 16px' }}>
      {lista === null ? <div className="vuoto">Caricamento…</div> : !vis.length ? <div className="vuoto">Nessun articolo.</div> :
        vis.map(a => {
          const puo = admin || (a.autoreUid === utente.uid && a.stato !== 'pubblicato');
          return (
            <div className="riga-adm" key={a.id}>
              {a.immagine ? <img src={imgUrl(a.immagine, 200)} alt="" /> : <div className="ph" />}
              <div className="t"><b>{a.titolo || '(senza titolo)'}</b>
                <span className="nota"><Badge a={a} /> {[a.categoria, a.autore, fmtData(a.data)].filter(Boolean).join(' · ')}</span></div>
              <div className="azioni">
                <a className="btn btn-s" href={'#/articolo/' + a.id} target="_blank" rel="noopener">Vedi</a>
                <button className="btn btn-s" onClick={() => setEd(clone(a))}>{puo ? 'Modifica' : 'Apri'}</button>
                {puo && <button className="btn btn-s btn-d" onClick={() => elimina(a)}>Elimina</button>}
              </div>
            </div>);
        })}
    </div>
  </>;
}

function CampoImmagine({ valore, onChange, avvisa, etichetta = 'Immagine' }) {
  const [occ, setOcc] = useState(false);
  const [url, setUrl] = useState('');
  const carica = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    setOcc(true);
    try { onChange(await caricaImmagine(f)); } catch (ex) { avvisa(ex.message, true); }
    setOcc(false);
  };
  const usaLink = () => { const u = url.trim(); if (/^https?:\/\//.test(u) || /^[\w./-]+\.(jpe?g|png|webp|gif)$/i.test(u)) { onChange(u); setUrl(''); } else avvisa('Link non valido', true); };
  return (
    <div className="campo largo"><span>{etichetta}</span>
      <div className="img-campo">
        {valore && <img src={imgUrl(valore, 400)} alt="" />}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, flex: 1, minWidth: 220 }}>
          <label className="btn" style={{ alignSelf: 'flex-start', cursor: 'pointer' }}>{occ ? 'Caricamento…' : (valore ? 'Sostituisci foto' : 'Carica foto')}
            <input type="file" accept="image/*" hidden onChange={carica} disabled={occ} /></label>
          <div style={{ display: 'flex', gap: 6 }}>
            <input className="input" style={{ flex: 1 }} placeholder="…oppure incolla il link di un'immagine" value={url} onChange={e => setUrl(e.target.value)} />
            <button type="button" className="btn btn-s" onClick={usaLink}>Usa</button>
          </div>
          {valore && <button type="button" className="btn btn-s btn-d" style={{ alignSelf: 'flex-start' }} onClick={() => onChange('')}>Rimuovi</button>}
        </div>
      </div>
    </div>
  );
}

function CampoGalleria({ foto, onChange, avvisa }) {
  const [occ, setOcc] = useState('');
  const carica = async e => {
    const fs = [...(e.target.files || [])]; e.target.value = ''; if (!fs.length) return;
    const nuove = [];
    for (let i = 0; i < fs.length; i++) {
      setOcc(`${i + 1}/${fs.length}`);
      try { nuove.push({ url: await caricaImmagine(fs[i]), didascalia: '' }); } catch (ex) { avvisa(ex.message, true); break; }
    }
    setOcc(''); onChange([...(foto || []), ...nuove]);
  };
  const setDid = (i, v) => onChange(foto.map((x, k) => k === i ? { ...x, didascalia: v } : x));
  return (
    <div className="campo largo"><span>Galleria fotografica (facoltativa)</span>
      {(foto || []).length > 0 && <div className="thumbs" style={{ marginBottom: 8 }}>{foto.map((x, i) => (
        <div className="thumb" key={i}><img src={imgUrl(x.url, 300)} alt="" />
          <div className="p"><input className="input" placeholder="Didascalia" value={x.didascalia || ''} onChange={e => setDid(i, e.target.value)} />
            <button type="button" className="btn btn-s btn-d" onClick={() => onChange(foto.filter((_, k) => k !== i))}>Togli</button></div>
        </div>))}</div>}
      <label className="btn" style={{ alignSelf: 'flex-start', cursor: 'pointer' }}>{occ ? 'Caricamento ' + occ : '+ Aggiungi foto'}
        <input type="file" accept="image/*" multiple hidden onChange={carica} disabled={!!occ} /></label>
    </div>
  );
}

function Editor({ iniziale, utente, categorie, avvisa, chiudi }) {
  const base = useMemo(() => ({ galleria: [], ...iniziale }), [iniziale]);
  const [a, setA] = useState(base);
  const [anteprima, setAnteprima] = useState(false);
  const [occ, setOcc] = useState(false);
  const ref = useRef(null);
  const admin = utente.ruolo === 'admin';
  const sola = !admin && (iniziale.stato === 'pubblicato' || iniziale.autoreUid !== utente.uid);
  const set = (k, v) => setA(x => ({ ...x, [k]: v }));
  const ins = (prima, dopo = '', seg = '') => {
    const t = ref.current; if (!t) return;
    const s = t.selectionStart, e = t.selectionEnd; const sel = a.testo.slice(s, e) || seg;
    set('testo', a.testo.slice(0, s) + prima + sel + dopo + a.testo.slice(e));
    requestAnimationFrame(() => { t.focus(); t.selectionStart = s + prima.length; t.selectionEnd = s + prima.length + sel.length; });
  };
  const link = () => { const u = prompt('Indirizzo del link (https://…)'); if (u && /^https?:\/\//.test(u.trim())) ins('[', `](${u.trim()})`, 'testo del link'); };
  const salva = async statoForzato => {
    if (!a.titolo.trim()) { avvisa('Il titolo è obbligatorio', true); return; }
    setOcc(true);
    try {
      const da = { ...a, titolo: a.titolo.trim(), stato: statoForzato || a.stato };
      await Store.salvaArticolo(da, utente);
      avvisa(da.stato === 'pubblicato' ? (da.data > Date.now() ? 'Pubblicazione programmata' : 'Articolo pubblicato') : da.stato === 'revisione' ? 'Inviato in revisione' : 'Bozza salvata');
      chiudi(true);
    } catch (e) { avvisa(msgErrore(e), true); setOcc(false); }
  };
  const annulla = () => { if (JSON.stringify(a) !== JSON.stringify(base) && !confirm('Uscire senza salvare le modifiche?')) return; chiudi(false); };
  return (
    <div>
      <div className="ed-head">
        <button className="btn" onClick={annulla}>← Articoli</button>
        <div className="azioni">
          <button className="btn" onClick={() => setAnteprima(!anteprima)}>{anteprima ? 'Modifica' : 'Anteprima'}</button>
          {!sola && <>
            <button className="btn" disabled={occ} onClick={() => salva()}>Salva</button>
            {admin ? <button className="btn btn-p" disabled={occ} onClick={() => salva('pubblicato')}>Pubblica</button>
              : <button className="btn btn-p" disabled={occ} onClick={() => salva('revisione')}>Invia in revisione</button>}
          </>}
        </div>
      </div>
      {sola && <div className="avviso-adm">Articolo già pubblicato: può modificarlo solo un amministratore.</div>}
      {anteprima ? <div className="pannello" style={{ padding: '24px 16px' }}><VistaArticolo a={{ ...a, sommario: a.sommario || riassunto(a.testo) }} /></div> :
        <fieldset className="fs" disabled={sola}>
          <div className="pannello"><div className="campi">
            <label className="campo largo"><span>Titolo *</span><input className="input titolo-input" value={a.titolo} onChange={e => set('titolo', e.target.value)} /></label>
            <label className="campo largo"><span>Occhiello (sottotitolo)</span><input className="input" value={a.occhiello} onChange={e => set('occhiello', e.target.value)} /></label>
            <label className="campo largo"><span>Sommario per la prima pagina (se vuoto si usa l'inizio del testo)</span><textarea className="input" style={{ minHeight: 70 }} value={a.sommario} onChange={e => set('sommario', e.target.value)} /></label>
            <label className="campo"><span>Categoria</span><select className="sel" value={a.categoria} onChange={e => set('categoria', e.target.value)}>
              {[...new Set([...categorie, a.categoria].filter(Boolean))].map(c => <option key={c}>{c}</option>)}</select></label>
            <label className="campo"><span>Firma</span><input className="input" value={a.autore} onChange={e => set('autore', e.target.value)} /></label>
            <label className="campo"><span>Data di pubblicazione</span><input className="input" type="datetime-local" value={aLocale(a.data)} onChange={e => set('data', daLocale(e.target.value))} /></label>
            <label className="campo"><span>Uscito sul cartaceo nr. (facoltativo)</span><input className="input" value={a.numero} onChange={e => set('numero', e.target.value)} /></label>
            <label className="campo"><span>Stato</span><select className="sel" value={a.stato} onChange={e => set('stato', e.target.value)}>
              <option value="bozza">Bozza</option><option value="revisione">In revisione</option>{(admin || a.stato === 'pubblicato') && <option value="pubblicato">Pubblicato</option>}</select></label>
          </div></div>
          <div className="pannello"><div className="campi">
            <CampoImmagine valore={a.immagine} onChange={v => set('immagine', v)} avvisa={avvisa} etichetta="Immagine principale" />
            <label className="campo largo"><span>Didascalia</span><input className="input" value={a.didascalia} onChange={e => set('didascalia', e.target.value)} /></label>
          </div></div>
          <div className="pannello">
            <div className="campo"><span>Testo</span>
              <div className="toolbar">
                <button type="button" className="btn btn-s" onClick={() => ins('**', '**', 'grassetto')}><b>G</b></button>
                <button type="button" className="btn btn-s" onClick={() => ins('*', '*', 'corsivo')}><i>C</i></button>
                <button type="button" className="btn btn-s" onClick={() => ins('\n\n## ', '\n\n', 'Intertitolo')}>Intertitolo</button>
                <button type="button" className="btn btn-s" onClick={() => ins('\n\n> ', '\n\n', 'Citazione')}>Citazione</button>
                <button type="button" className="btn btn-s" onClick={() => ins('\n\n- ', '\n\n', 'voce elenco')}>Elenco</button>
                <button type="button" className="btn btn-s" onClick={link}>Link</button>
              </div>
              <textarea ref={ref} className="input ed-testo" value={a.testo} onChange={e => set('testo', e.target.value)} placeholder="Scrivi qui l'articolo. Lascia una riga vuota tra un paragrafo e l'altro." />
              <span className="nota">Riga vuota = nuovo paragrafo · **grassetto** · *corsivo* · ## intertitolo · &gt; citazione · - elenco</span>
            </div>
          </div>
          <div className="pannello"><div className="campi"><CampoGalleria foto={a.galleria} onChange={v => set('galleria', v)} avvisa={avvisa} /></div></div>
        </fieldset>}
    </div>
  );
}

/* ---------- prima pagina ---------- */
function GestionePrimaPagina({ dati, ricarica, avvisa }) {
  const [L, setL] = useState(() => clone(dati.layout));
  const [catTxt, setCatTxt] = useState((dati.layout.categorie || CATEGORIE_DEFAULT).join(', '));
  const [occ, setOcc] = useState(false);
  const [nuovoTipo, setNuovoTipo] = useState('');
  const pubbl = [...(dati.indice.articoli || [])].sort((a, b) => b.data - a.data);
  const album = ordinaAlbum(dati.gallerie.album);
  const cats = catTxt.split(',').map(s => s.trim()).filter(Boolean);
  const setT = (k, v) => setL(x => ({ ...x, testata: { ...(x.testata || {}), [k]: v } }));
  const setB = (i, patch) => setL(x => { const b = [...x.blocchi]; b[i] = { ...b[i], ...patch }; return { ...x, blocchi: b }; });
  const sposta = (i, d) => setL(x => { const b = [...x.blocchi]; const j = i + d; if (j < 0 || j >= b.length) return x; [b[i], b[j]] = [b[j], b[i]]; return { ...x, blocchi: b }; });
  const togli = i => setL(x => ({ ...x, blocchi: x.blocchi.filter((_, k) => k !== i) }));
  const aggiungi = () => {
    const tipo = nuovoTipo; if (!tipo) return;
    const b = { id: uid(), tipo };
    if (tipo === 'apertura') b.articolo = '';
    if (tipo === 'riga') b.articoli = ['', ''];
    if (tipo === 'ultimi') Object.assign(b, { titolo: 'Ultimi articoli', n: 6, categoria: '' });
    if (tipo === 'galleria') b.album = '';
    if (tipo === 'avviso') Object.assign(b, { testo: '', link: '' });
    setL(x => ({ ...x, blocchi: [...(x.blocchi || []), b] })); setNuovoTipo('');
  };
  const salva = async () => {
    setOcc(true);
    try {
      const nx = { ...L, categorie: cats.length ? cats : CATEGORIE_DEFAULT };
      await Store.aggiornaMeta('layout', () => nx); await ricarica(); avvisa('Prima pagina aggiornata');
    } catch (e) { avvisa(msgErrore(e), true); }
    setOcc(false);
  };
  const SelArt = ({ v, on, vuoto }) => (
    <select className="sel" value={v || ''} onChange={e => on(e.target.value)} style={{ width: '100%' }}>
      <option value="">{vuoto}</option>
      {v && !pubbl.find(a => a.id === v) && <option value={v}>(articolo non più pubblicato)</option>}
      {pubbl.map(a => <option key={a.id} value={a.id}>{fmtData(a.data)} — {a.titolo.slice(0, 70)}</option>)}
    </select>);
  return <>
    <div className="testa-adm"><h2 className="h-adm">Prima pagina</h2>
      <div className="azioni"><a className="btn" href="#/" target="_blank" rel="noopener">Vedi sito</a><button className="btn btn-p" disabled={occ} onClick={salva}>{occ ? 'Salvataggio…' : 'Salva e pubblica'}</button></div></div>

    <div className="pannello"><h3>Composizione</h3>
      <p className="nota" style={{ marginTop: -6 }}>I blocchi compaiono nell'ordine qui sotto. Gli articoli scelti a mano non vengono ripetuti nei blocchi automatici.</p>
      {(L.blocchi || []).map((b, i) => (
        <div className="blocco-ed" key={b.id}>
          <div className="hd"><b>{i + 1}. {TIPI_BLOCCO[b.tipo] || b.tipo}</b>
            <div className="azioni">
              <button className="btn btn-s" disabled={i === 0} onClick={() => sposta(i, -1)} aria-label="Su">↑</button>
              <button className="btn btn-s" disabled={i === L.blocchi.length - 1} onClick={() => sposta(i, 1)} aria-label="Giù">↓</button>
              <button className="btn btn-s btn-d" onClick={() => togli(i)}>Togli</button>
            </div></div>
          {b.tipo === 'apertura' && <SelArt v={b.articolo} on={v => setB(i, { articolo: v })} vuoto="Automatico: l'articolo più recente" />}
          {b.tipo === 'riga' && <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {(b.articoli || []).map((id, k) => <div key={k} style={{ display: 'flex', gap: 6 }}>
              <div style={{ flex: 1, minWidth: 0 }}><SelArt v={id} on={v => setB(i, { articoli: b.articoli.map((x, z) => z === k ? v : x) })} vuoto="— scegli un articolo —" /></div>
              <button className="btn btn-s" onClick={() => setB(i, { articoli: b.articoli.filter((_, z) => z !== k) })}>✕</button></div>)}
            {(b.articoli || []).length < 4 && <button className="btn btn-s" style={{ alignSelf: 'flex-start' }} onClick={() => setB(i, { articoli: [...(b.articoli || []), ''] })}>+ articolo</button>}
          </div>}
          {b.tipo === 'ultimi' && <div className="campi">
            <label className="campo"><span>Titolo sezione</span><input className="input" value={b.titolo || ''} onChange={e => setB(i, { titolo: e.target.value })} /></label>
            <label className="campo"><span>Quanti articoli</span><input className="input" type="number" min="1" max="24" value={b.n || 6} onChange={e => setB(i, { n: Math.max(1, Math.min(24, +e.target.value || 6)) })} /></label>
            <label className="campo"><span>Categoria</span><select className="sel" value={b.categoria || ''} onChange={e => setB(i, { categoria: e.target.value })}>
              <option value="">Tutte</option>{cats.map(c => <option key={c}>{c}</option>)}</select></label>
          </div>}
          {b.tipo === 'galleria' && <select className="sel" value={b.album || ''} onChange={e => setB(i, { album: e.target.value })} style={{ width: '100%' }}>
            <option value="">Automatico: l'album più recente</option>{album.map(x => <option key={x.id} value={x.id}>{x.titolo}</option>)}</select>}
          {b.tipo === 'avviso' && <div className="campi">
            <label className="campo largo"><span>Testo</span><input className="input" value={b.testo || ''} onChange={e => setB(i, { testo: e.target.value })} /></label>
            <label className="campo largo"><span>Link (facoltativo)</span><input className="input" value={b.link || ''} placeholder="https://… oppure #/articolo/…" onChange={e => setB(i, { link: e.target.value })} /></label>
          </div>}
          {['sport', 'numero'].includes(b.tipo) && <div className="nota">Si aggiorna da solo con i dati delle sezioni {b.tipo === 'sport' ? 'Sport' : 'Numeri'}.</div>}
          {b.tipo === 'invito' && <div className="nota">Riquadro che invita i lettori a scrivere per il giornale e porta all'area redazione.</div>}
        </div>))}
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 8 }}>
        <select className="sel" value={nuovoTipo} onChange={e => setNuovoTipo(e.target.value)}>
          <option value="">Aggiungi un blocco…</option>{Object.entries(TIPI_BLOCCO).map(([k, l]) => <option key={k} value={k}>{l}</option>)}</select>
        <button className="btn" disabled={!nuovoTipo} onClick={aggiungi}>Aggiungi</button>
      </div>
    </div>

    <div className="pannello"><h3>Impostazioni</h3>
      <div className="campi">
        <label className="campo"><span>Periodicità</span><input className="input" value={(L.testata || {}).periodicita || ''} placeholder="Bimestrale" onChange={e => setT('periodicita', e.target.value)} /></label>
        <label className="campo largo"><span>Categorie (separate da virgola)</span><input className="input" value={catTxt} onChange={e => setCatTxt(e.target.value)} /></label>
        <label className="campo largo"><span>Testo a piè di pagina</span><input className="input" value={L.footer || ''} onChange={e => setL({ ...L, footer: e.target.value })} /></label>
      </div>
    </div>
  </>;
}

/* ---------- sport ---------- */
function GestioneSport({ ricarica, avvisa, dati }) {
  const [S, setS] = useState(() => clone(dati.sport));
  const [sel, setSel] = useState('');
  const [formSq, setFormSq] = useState(null);
  const [formP, setFormP] = useState(null);
  useEffect(() => { Store.meta('sport').then(setS).catch(() => {}); }, []);
  const agg = async (fn, msg) => {
    try { const nx = await Store.aggiornaMeta('sport', fn); setS(nx); ricarica(); if (msg) avvisa(msg); return true; }
    catch (e) { avvisa(msgErrore(e), true); return false; }
  };
  const sq = S.squadre || [];
  const cur = sq.find(s => s.id === sel) || sq[0];
  const partite = cur ? (S.partite || []).filter(p => p.squadraId === cur.id).sort(perDataDesc) : [];

  const salvaSq = async () => {
    const f = formSq; if (!f.nome.trim()) { avvisa('Inserisci il nome della squadra', true); return; }
    const v = { ...f, nome: f.nome.trim() };
    const ok = await agg(s => {
      const l = [...(s.squadre || [])]; const i = l.findIndex(x => x.id === v.id);
      const vecchio = i >= 0 ? l[i].nome : null;
      if (i >= 0) l[i] = v; else l.push(v);
      let p = s.partite || [];
      if (vecchio && vecchio !== v.nome) p = p.map(x => x.squadraId !== v.id ? x : { ...x, casa: x.casa === vecchio ? v.nome : x.casa, ospite: x.ospite === vecchio ? v.nome : x.ospite });
      return { ...s, squadre: l, partite: p };
    }, 'Squadra salvata');
    if (ok) { setFormSq(null); setSel(v.id); }
  };
  const eliminaSq = async s => {
    if (!confirm(`Eliminare "${s.nome}" e tutte le sue partite?`)) return;
    await agg(x => ({ ...x, squadre: (x.squadre || []).filter(y => y.id !== s.id), partite: (x.partite || []).filter(p => p.squadraId !== s.id) }), 'Squadra eliminata');
    setSel('');
  };
  const salvaP = async () => {
    const f = formP;
    if (!f.data || !f.casa.trim() || !f.ospite.trim()) { avvisa('Servono data, squadra di casa e ospite', true); return; }
    const num = v => v === '' || v == null ? '' : (isNaN(+v) ? '' : +v);
    const v = { ...f, casa: f.casa.trim(), ospite: f.ospite.trim(), gc: num(f.gc), go: num(f.go) };
    const ok = await agg(s => {
      const l = [...(s.partite || [])]; const i = l.findIndex(x => x.id === v.id);
      if (i >= 0) l[i] = v; else l.push(v); return { ...s, partite: l };
    }, 'Partita salvata');
    if (ok) setFormP(null);
  };
  const eliminaP = async p => { if (confirm('Eliminare la partita?')) await agg(s => ({ ...s, partite: (s.partite || []).filter(x => x.id !== p.id) }), 'Partita eliminata'); };

  return <>
    <div className="testa-adm"><h2 className="h-adm">Sport</h2>
      <button className="btn btn-p" onClick={() => setFormSq({ id: uid(), nome: '', sport: '', campionato: '', classifica: '' })}>+ Nuova squadra</button></div>

    {formSq && <div className="pannello"><h3>{sq.find(s => s.id === formSq.id) ? 'Modifica squadra' : 'Nuova squadra'}</h3>
      <div className="campi">
        <label className="campo"><span>Nome *</span><input className="input" value={formSq.nome} onChange={e => setFormSq({ ...formSq, nome: e.target.value })} /></label>
        <label className="campo"><span>Sport</span><input className="input" value={formSq.sport} placeholder="Calcio a 5" onChange={e => setFormSq({ ...formSq, sport: e.target.value })} /></label>
        <label className="campo"><span>Campionato</span><input className="input" value={formSq.campionato} onChange={e => setFormSq({ ...formSq, campionato: e.target.value })} /></label>
        <label className="campo largo"><span>Classifica: una squadra per riga, nel formato  Squadra ; Punti ; Giocate</span>
          <textarea className="input" style={{ minHeight: 150, fontFamily: 'monospace', fontSize: 14 }} value={formSq.classifica} placeholder={'Squadra A; 12; 5\nSquadra B; 10; 5'} onChange={e => setFormSq({ ...formSq, classifica: e.target.value })} /></label>
      </div>
      <div className="azioni" style={{ marginTop: 12 }}><button className="btn btn-p" onClick={salvaSq}>Salva</button><button className="btn" onClick={() => setFormSq(null)}>Annulla</button></div>
    </div>}

    {!sq.length ? <div className="vuoto">Nessuna squadra. Aggiungi la prima.</div> : <>
      <div className="chips">{sq.map(s => <button key={s.id} className={'chip' + (cur && cur.id === s.id ? ' on' : '')} onClick={() => { setSel(s.id); setFormP(null); }}>{s.nome}</button>)}</div>
      {cur && <div className="pannello">
        <div className="testa-adm" style={{ marginBottom: 6 }}>
          <div><h3 style={{ margin: 0 }}>{cur.nome}</h3><span className="nota">{[cur.sport, cur.campionato].filter(Boolean).join(' · ')}</span></div>
          <div className="azioni">
            <button className="btn btn-s" onClick={() => setFormSq({ classifica: '', sport: '', campionato: '', ...clone(cur) })}>Modifica squadra e classifica</button>
            <button className="btn btn-s btn-d" onClick={() => eliminaSq(cur)}>Elimina</button>
          </div>
        </div>
        <button className="btn btn-p" style={{ margin: '8px 0 12px' }} onClick={() => setFormP({ id: uid(), squadraId: cur.id, data: oggiISO(), ora: '', casa: cur.nome, ospite: '', gc: '', go: '', competizione: '' })}>+ Aggiungi partita</button>
        {formP && <div className="blocco-ed">
          <div className="campi">
            <label className="campo"><span>Data *</span><input className="input" type="date" value={formP.data} onChange={e => setFormP({ ...formP, data: e.target.value })} /></label>
            <label className="campo"><span>Ora</span><input className="input" type="time" value={formP.ora} onChange={e => setFormP({ ...formP, ora: e.target.value })} /></label>
            <label className="campo"><span>Giornata / competizione</span><input className="input" value={formP.competizione} onChange={e => setFormP({ ...formP, competizione: e.target.value })} /></label>
            <label className="campo"><span>Casa *</span><input className="input" value={formP.casa} onChange={e => setFormP({ ...formP, casa: e.target.value })} /></label>
            <label className="campo"><span>Ospite *</span><input className="input" value={formP.ospite} onChange={e => setFormP({ ...formP, ospite: e.target.value })} /></label>
            <div className="campo"><span>Risultato (vuoto se non ancora giocata)</span>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                <input className="input" style={{ width: 70 }} inputMode="numeric" value={formP.gc} onChange={e => setFormP({ ...formP, gc: e.target.value })} />–
                <input className="input" style={{ width: 70 }} inputMode="numeric" value={formP.go} onChange={e => setFormP({ ...formP, go: e.target.value })} />
              </div></div>
          </div>
          <div className="azioni" style={{ marginTop: 10 }}>
            <button className="btn btn-p" onClick={salvaP}>Salva partita</button>
            <button className="btn" onClick={() => setFormP({ ...formP, casa: formP.ospite, ospite: formP.casa, gc: formP.go, go: formP.gc })}>⇄ Inverti casa/ospite</button>
            <button className="btn" onClick={() => setFormP(null)}>Annulla</button>
          </div>
        </div>}
        {!partite.length ? <div className="nota">Nessuna partita inserita.</div> : partite.map(p => (
          <div className="riga-adm" key={p.id}>
            <div className="t"><b>{p.casa} {giocata(p) ? `${p.gc} – ${p.go}` : 'vs'} {p.ospite}</b>
              <span className="nota">{fmtGiorno(p.data)}{p.ora ? ' · ' + p.ora : ''}{p.competizione ? ' · ' + p.competizione : ''}{!giocata(p) ? ' · da giocare' : ''}</span></div>
            <div className="azioni"><button className="btn btn-s" onClick={() => setFormP(clone(p))}>{giocata(p) ? 'Modifica' : 'Inserisci risultato'}</button>
              <button className="btn btn-s btn-d" onClick={() => eliminaP(p)}>Elimina</button></div>
          </div>))}
      </div>}
    </>}
  </>;
}

/* ---------- foto ---------- */
function GestioneFoto({ dati, ricarica, avvisa }) {
  const [G, setG] = useState(() => clone(dati.gallerie));
  const [sel, setSel] = useState(null);
  const [form, setForm] = useState(null);
  const [occ, setOcc] = useState('');
  useEffect(() => { Store.meta('gallerie').then(setG).catch(() => {}); }, []);
  const agg = async (fn, msg) => {
    try { const nx = await Store.aggiornaMeta('gallerie', fn); setG(nx); ricarica(); if (msg) avvisa(msg); return true; }
    catch (e) { avvisa(msgErrore(e), true); return false; }
  };
  const albums = ordinaAlbum(G.album);
  const cur = albums.find(a => a.id === sel);
  const modAlbum = fn => agg(g => ({ ...g, album: (g.album || []).map(a => a.id === cur.id ? fn(a) : a) }));

  const salvaAlbum = async () => {
    if (!form.titolo.trim()) { avvisa('Serve un titolo', true); return; }
    const v = { ...form, titolo: form.titolo.trim() };
    const ok = await agg(g => {
      const l = [...(g.album || [])]; const i = l.findIndex(a => a.id === v.id);
      if (i >= 0) l[i] = { ...l[i], titolo: v.titolo, data: v.data, descrizione: v.descrizione }; else l.push({ ...v, foto: [] });
      return { ...g, album: l };
    }, 'Album salvato');
    if (ok) { setSel(v.id); setForm(null); }
  };
  const carica = async e => {
    const fs = [...(e.target.files || [])]; e.target.value = ''; if (!fs.length) return;
    const nuove = [];
    for (let i = 0; i < fs.length; i++) {
      setOcc(`Caricamento ${i + 1} di ${fs.length}…`);
      try { nuove.push({ url: await caricaImmagine(fs[i]), didascalia: '' }); } catch (ex) { avvisa(ex.message, true); break; }
    }
    setOcc('');
    if (nuove.length) await agg(g => ({ ...g, album: (g.album || []).map(a => a.id === cur.id ? { ...a, foto: [...(a.foto || []), ...nuove] } : a) }), `${nuove.length} foto aggiunte`);
  };
  const eliminaAlbum = async () => {
    if (!confirm(`Eliminare l'album "${cur.titolo}"?`)) return;
    const ok = await agg(g => ({ ...g, album: (g.album || []).filter(a => a.id !== cur.id) }), 'Album eliminato');
    if (ok) setSel(null);
  };

  if (form) return (
    <div className="pannello"><h3>{albums.find(a => a.id === form.id) ? 'Modifica album' : 'Nuovo album'}</h3>
      <div className="campi">
        <label className="campo"><span>Titolo *</span><input className="input" value={form.titolo} onChange={e => setForm({ ...form, titolo: e.target.value })} /></label>
        <label className="campo"><span>Data</span><input className="input" type="date" value={form.data} onChange={e => setForm({ ...form, data: e.target.value })} /></label>
        <label className="campo largo"><span>Descrizione</span><input className="input" value={form.descrizione} onChange={e => setForm({ ...form, descrizione: e.target.value })} /></label>
      </div>
      <div className="azioni" style={{ marginTop: 12 }}><button className="btn btn-p" onClick={salvaAlbum}>Salva</button><button className="btn" onClick={() => setForm(null)}>Annulla</button></div>
    </div>);

  if (cur) return <>
    <div className="testa-adm">
      <div><button className="link-txt" onClick={() => setSel(null)}>← Tutti gli album</button><h2 className="h-adm">{cur.titolo}</h2><span className="nota">{fmtGiornoLungo(cur.data)} · {(cur.foto || []).length} foto</span></div>
      <div className="azioni">
        <button className="btn" onClick={() => setForm({ id: cur.id, titolo: cur.titolo, data: cur.data || oggiISO(), descrizione: cur.descrizione || '' })}>Modifica</button>
        <button className="btn btn-d" onClick={eliminaAlbum}>Elimina album</button>
      </div>
    </div>
    <label className="btn btn-p" style={{ cursor: 'pointer', marginBottom: 14 }}>{occ || '+ Carica foto (anche più di una)'}
      <input type="file" accept="image/*" multiple hidden onChange={carica} disabled={!!occ} /></label>
    {!(cur.foto || []).length ? <div className="vuoto">Nessuna foto: caricane qualcuna.</div> :
      <div className="thumbs">{cur.foto.map((f, i) => (
        <div className="thumb" key={f.url.slice(-40) + i}>
          <img src={imgUrl(f.url, 300)} alt="" />
          <div className="p">
            <input className="input" placeholder="Didascalia" defaultValue={f.didascalia || ''}
              onBlur={e => { const v = e.target.value; if (v !== (f.didascalia || '')) modAlbum(a => ({ ...a, foto: a.foto.map((x, k) => k === i ? { ...x, didascalia: v } : x) })); }} />
            <div className="azioni">
              {i > 0 && <button className="btn btn-s" title="Usa come copertina" onClick={() => modAlbum(a => ({ ...a, foto: [a.foto[i], ...a.foto.filter((_, k) => k !== i)] }))}>Copertina</button>}
              <button className="btn btn-s btn-d" onClick={() => { if (confirm('Togliere la foto?')) modAlbum(a => ({ ...a, foto: a.foto.filter((_, k) => k !== i) })); }}>✕</button>
            </div>
          </div>
        </div>))}</div>}
  </>;

  return <>
    <div className="testa-adm"><h2 className="h-adm">Foto</h2>
      <button className="btn btn-p" onClick={() => setForm({ id: uid(), titolo: '', data: oggiISO(), descrizione: '' })}>+ Nuovo album</button></div>
    {!albums.length ? <div className="vuoto">Nessun album.</div> :
      <div className="pannello" style={{ padding: '0 16px' }}>{albums.map(a => (
        <div className="riga-adm" key={a.id}>
          {a.foto && a.foto[0] ? <img src={imgUrl(a.foto[0].url, 200)} alt="" /> : <div className="ph" />}
          <div className="t"><b>{a.titolo}</b><span className="nota">{fmtGiornoLungo(a.data)} · {(a.foto || []).length} foto</span></div>
          <div className="azioni"><button className="btn btn-s" onClick={() => setSel(a.id)}>Apri</button></div>
        </div>))}</div>}
  </>;
}

/* ---------- numeri cartacei ---------- */
function GestioneNumeri({ dati, ricarica, avvisa }) {
  const [N, setN] = useState(() => clone(dati.numeri));
  const [form, setForm] = useState(null);
  useEffect(() => { Store.meta('numeri').then(setN).catch(() => {}); }, []);
  const agg = async (fn, msg) => {
    try { const nx = await Store.aggiornaMeta('numeri', fn); setN(nx); ricarica(); if (msg) avvisa(msg); return true; }
    catch (e) { avvisa(msgErrore(e), true); return false; }
  };
  const l = ordinaNumeri(N.numeri);
  const salva = async () => {
    if (!String(form.nr).trim()) { avvisa('Serve il numero', true); return; }
    const v = { ...form, nr: String(form.nr).trim() };
    const ok = await agg(n => { const x = [...(n.numeri || [])]; const i = x.findIndex(y => y.id === v.id); if (i >= 0) x[i] = v; else x.push(v); return { numeri: x }; }, 'Numero salvato');
    if (ok) setForm(null);
  };
  if (form) return (
    <div className="pannello"><h3>{l.find(n => n.id === form.id) ? 'Modifica numero' : 'Nuovo numero'}</h3>
      <div className="campi">
        <label className="campo"><span>Numero *</span><input className="input" value={form.nr} onChange={e => setForm({ ...form, nr: e.target.value })} /></label>
        <label className="campo"><span>Uscita</span><input className="input" value={form.mese} placeholder="Settembre 2025" onChange={e => setForm({ ...form, mese: e.target.value })} /></label>
        <label className="campo largo"><span>Link al PDF</span><input className="input" value={form.pdf} placeholder="numeri/62.pdf  oppure  https://…" onChange={e => setForm({ ...form, pdf: e.target.value })} /></label>
        <CampoImmagine valore={form.copertina} onChange={v => setForm({ ...form, copertina: v })} avvisa={avvisa} etichetta="Copertina" />
      </div>
      <div className="azioni" style={{ marginTop: 12 }}><button className="btn btn-p" onClick={salva}>Salva</button><button className="btn" onClick={() => setForm(null)}>Annulla</button></div>
    </div>);
  const prossimo = l.length ? String((parseFloat(l[0].nr) || 0) + 1) : '';
  return <>
    <div className="testa-adm"><h2 className="h-adm">Numeri cartacei</h2>
      <button className="btn btn-p" onClick={() => setForm({ id: uid(), nr: prossimo, mese: '', pdf: '', copertina: '' })}>+ Nuovo numero</button></div>
    {!l.length ? <div className="vuoto">Nessun numero caricato.</div> :
      <div className="pannello" style={{ padding: '0 16px' }}>{l.map(n => (
        <div className="riga-adm" key={n.id}>
          {n.copertina ? <img src={imgUrl(n.copertina, 200)} alt="" style={{ height: 64, width: 46 }} /> : <div className="ph" style={{ height: 64, width: 46 }} />}
          <div className="t"><b>Nr. {n.nr}</b><span className="nota">{n.mese}{n.pdf ? ' · PDF presente' : ' · senza PDF'}</span></div>
          <div className="azioni"><button className="btn btn-s" onClick={() => setForm({ copertina: '', pdf: '', mese: '', ...clone(n) })}>Modifica</button>
            <button className="btn btn-s btn-d" onClick={() => { if (confirm(`Eliminare il nr. ${n.nr}?`)) agg(x => ({ numeri: (x.numeri || []).filter(y => y.id !== n.id) }), 'Numero eliminato'); }}>Elimina</button></div>
        </div>))}</div>}
  </>;
}

/* ---------- utenti ---------- */
function GestioneUtenti({ utente, avvisa }) {
  const [l, setL] = useState(null);
  const carica = useCallback(() => Store.utenti().then(x => setL(x.sort((a, b) => (a.nome || '').localeCompare(b.nome || '')))).catch(e => { avvisa(msgErrore(e), true); setL([]); }), [avvisa]);
  useEffect(() => { carica(); }, [carica]);
  const cambia = async (u, r) => {
    try { await Store.impostaRuolo(u.uid, r); avvisa('Ruolo aggiornato'); carica(); } catch (e) { avvisa(msgErrore(e), true); }
  };
  const attesa = (l || []).filter(u => u.ruolo === 'in_attesa').length;
  return <>
    <div className="testa-adm"><h2 className="h-adm">Utenti</h2></div>
    <p className="nota" style={{ marginTop: -6 }}>I redattori si registrano dalla pagina di accesso (<b>{location.href.split('#')[0]}#/redazione</b> → "Registrati come redattore"). Qui li abiliti. I redattori scrivono articoli e li inviano in revisione, e aggiornano sport e foto. Gli amministratori pubblicano e gestiscono tutto.</p>
    {attesa > 0 && <div className="avviso-adm">{attesa} richiest{attesa === 1 ? 'a' : 'e'} in attesa di approvazione.</div>}
    <div className="pannello" style={{ padding: '0 16px' }}>
      {l === null ? <div className="vuoto">Caricamento…</div> : l.map(u => (
        <div className="riga-adm" key={u.uid}>
          <div className="t"><b>{u.nome || '(senza nome)'}{u.uid === utente.uid ? ' (tu)' : ''}</b><span className="nota">{u.email}</span></div>
          <select className="sel" value={u.ruolo} disabled={u.uid === utente.uid} onChange={e => cambia(u, e.target.value)}>
            <option value="in_attesa">In attesa</option><option value="redattore">Redattore</option><option value="admin">Amministratore</option><option value="disattivato">Disattivato</option>
          </select>
        </div>))}
    </div>
  </>;
}

/* =====================================================================
   APP
   ===================================================================== */
function App() {
  const r = useRotta();
  const [dati, setDati] = useState(null);
  const [errore, setErrore] = useState('');
  const carica = useCallback(async () => {
    try {
      const nomi = ['indice', 'layout', 'sport', 'gallerie', 'numeri'];
      const v = await Promise.all(nomi.map(n => Store.meta(n)));
      const d = {}; nomi.forEach((n, i) => { d[n] = v[i]; }); setDati(d); setErrore('');
    } catch (e) { console.error(e); setErrore('Impossibile caricare i contenuti. Riprova più tardi.'); }
  }, []);
  useEffect(() => { carica(); }, [carica]);
  const [loggato, setLoggato] = useState(false);
  const inRedazione = r[0] === 'redazione';
  useEffect(() => Auth.osserva(u => setLoggato(!!u)), [inRedazione]);
  const pubblicati = useMemo(() => {
    if (!dati) return [];
    const ora = Date.now();
    return (dati.indice.articoli || []).filter(a => a.data <= ora).sort((a, b) => b.data - a.data);
  }, [dati]);

  if (r[0] === 'redazione') return <Redazione dati={dati} ricarica={carica} />;

  const layout = dati ? dati.layout : META_DEFAULT.layout;
  const categorie = layout.categorie && layout.categorie.length ? layout.categorie : CATEGORIE_DEFAULT;
  let pagina;
  if (errore) pagina = <div className="vuoto">{errore}</div>;
  else if (!dati) pagina = <div className="vuoto">Caricamento…</div>;
  else switch (r[0]) {
    case 'articolo': pagina = <PaginaArticolo id={r[1]} pubblicati={pubblicati} />; break;
    case 'archivio': pagina = <Archivio pubblicati={pubblicati} categorie={categorie} cat0="" />; break;
    case 'categoria': pagina = <Archivio pubblicati={pubblicati} categorie={categorie} cat0={r[1] || ''} />; break;
    case 'sport': pagina = <PaginaSport sport={dati.sport} />; break;
    case 'foto': pagina = <PaginaFoto gallerie={dati.gallerie} albumId={r[1]} />; break;
    case 'numeri': pagina = <PaginaNumeri numeri={dati.numeri} />; break;
    default: pagina = <Home dati={dati} pubblicati={pubblicati} />;
  }
  return <>
    <Header r={r} loggato={loggato} />
    <main><div className="wrap">{pagina}</div></main>
    <Piede layout={layout} />
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
